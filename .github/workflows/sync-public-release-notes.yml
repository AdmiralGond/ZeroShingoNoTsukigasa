name: Synchronize public release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-public-release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-descriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release note files
        uses: actions/checkout@v4
      - name: Synchronize the two existing public releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for version in v2026.11.19.6 v2026.11.20.7; do
            note_file=".github/release-notes/${version}.md"
            test -f "$note_file"
            gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release edit "$version" --repo "$GITHUB_REPOSITORY" --notes-file "$note_file"
            actual="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
            expected="$(cat "$note_file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Release body mismatch for $version" >&2
              exit 1
            fi
            echo "Synchronized $version"
          done
