name: Sanitize existing public release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sanitize-existing-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published notes
        uses: actions/checkout@v4
      - name: Update published release descriptions and initial version label
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          initial="v2026.11.16.1"
          initial_notes=".github/release-notes/${initial}.md"

          # Update the public changelog text for all existing versions first.
          for version in v2026.11.17.2 v2026.11.18.3; do
            notes=".github/release-notes/${version}.md"
            test -f "${notes}"
            gh release edit "${version}" \
              --repo "${repo}" \
              --title "Missile Defense Roguelite ${version}" \
              --notes-file "${notes}"
            echo "Updated public description for ${version}"
          done

          # Normalize the original build's description and label.
          old_tag="$(gh release list --repo "${repo}" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("build-")) | .tagName] | first // empty')"
          if [[ -n "${old_tag}" ]]; then
            gh release edit "${old_tag}" \
              --repo "${repo}" \
              --title "Missile Defense Roguelite ${initial}" \
              --notes-file "${initial_notes}"
            echo "Updated original build public description"
            # Keep the existing release record and retag its original commit.
            old_sha="$(gh release view "${old_tag}" --repo "${repo}" --json targetCommitish --jq '.targetCommitish')"
            echo "Resolved original build target"
            gh api --method POST "repos/${repo}/git/refs" -f ref="refs/tags/${initial}" -f sha="${old_sha}" >/dev/null
            echo "Created public version tag"
            release_id="$(gh release view "${old_tag}" --repo "${repo}" --json databaseId --jq '.databaseId')"
            gh api --method PATCH "repos/${repo}/releases/${release_id}" \
              -f tag_name="${initial}" \
              -f name="Missile Defense Roguelite ${initial}" \
              -f body="$(cat "${initial_notes}")" \
              -f target_commitish="${old_sha}" >/dev/null
            echo "Reassigned original release to the public version tag"
            gh api --method DELETE "repos/${repo}/git/refs/tags/${old_tag}" >/dev/null
            echo "Removed hash-bearing original tag"
          fi

          for version in v2026.11.17.2 v2026.11.18.3; do
            actual="$(gh release view "${version}" --repo "${repo}" --json body --jq '.body')"
            expected="$(cat ".github/release-notes/${version}.md")"
            [[ "${actual}" == "${expected}" ]] || { echo "Public notes verification failed for ${version}" >&2; exit 1; }
          done
          echo "Public release descriptions synchronized."
