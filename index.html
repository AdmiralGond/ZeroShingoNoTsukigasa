  const session = new GameSession(StageRegistry.STAGE_01);

  // The drawn length is nonlinear; actual integer HP/MP and combat timing stay linear.
  const POINTER_RING_CURVE = 0.35;
  const POINTER_RING_SIZE = 72;
  const POINTER_RING_CIRCUMFERENCES = Object.freeze({
    mp: 2 * Math.PI * 29,
    hp: 2 * Math.PI * 24.5,
  });
  function curvedResourceRatio(current, maximum) {
    if (!(maximum > 0)) return 0;
    const ratio = Math.max(0, Math.min(1, current / maximum));
    return (1 - POINTER_RING_CURVE) * ratio + POINTER_RING_CURVE * ratio * ratio;
  }
  function setResourceRingLength(circle, circumference, ratio) {
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = String(circumference * (1 - ratio));
  }
  function renderPointerDefenseRings(snapshot) {
    if (!snapshot.defenseResources) {
      pointerDefenseRings.style.visibility = "hidden";
      return;
    }
    const resources = snapshot.defenseResources;
    setResourceRingLength(
      pointerMpRing, POINTER_RING_CIRCUMFERENCES.mp,
      curvedResourceRatio(resources.mp, resources.maxMp)
    );
    setResourceRingLength(
      pointerHpRing, POINTER_RING_CIRCUMFERENCES.hp,
      curvedResourceRatio(resources.hp, resources.maxHp)
    );
    pointerDefenseRings.style.visibility = pointerInsideGame ? "visible" : "hidden";
  }

  let pointerInsideGame = false;
  // Window listener also detects leaving a letterboxed game root after resize.
  window.addEventListener("pointermove", evt => {
    // CSS layout uses a zoomed 1600x900 design space, not window pixels.
    if (evt.pointerType && evt.pointerType !== "mouse" && evt.pointerType !== "pen") return;
    const rect = canvas.getBoundingClientRect();
    if (!(rect.width > 0 && rect.height > 0)) return;
    // Read fractional CSS dimensions to match the clip's position after layout zoom.
    // canvas.clientWidth/clientHeight round fractional widths and shift the ring at edges.
    const clipStyle = getComputedStyle(pointerDefenseRings.parentElement);
    const width = parseFloat(clipStyle.width);
    const height = parseFloat(clipStyle.height);
    const x = (evt.clientX - rect.left) * width / rect.width;
    const y = (evt.clientY - rect.top) * height / rect.height;
    if (x < 0 || y < 0 || x > width || y > height) {
      pointerInsideGame = false;
      pointerDefenseRings.style.visibility = "hidden";
      return;
    }
    const left = x - POINTER_RING_SIZE / 2;
    const top = y - POINTER_RING_SIZE / 2;
    pointerDefenseRings.style.transform = `translate(${left}px, ${top}px)`;
    pointerInsideGame = true;
    pointerDefenseRings.style.visibility = session.world.defenseState ? "visible" : "hidden";
  }, {passive:true});

    pointerInsideGame = false;

  function canvasPoint(evt) {
    const r = canvas.getBoundingClientRect();
    return new Vec2(
      (evt.clientX - r.left) *
        (tacticalSurface.logicalWidth / r.width),
      (evt.clientY - r.top) *
        (tacticalSurface.logicalHeight / r.height)
    );
  }

    // Exponential wheel response gives smooth zooming on both
    // mouse wheels and trackpads. Zoom remains centered on the current view.
    const factor = Math.exp(-evt.deltaY * 0.0012);
    cameraZoom = Math.min(
      MAX_CAMERA_ZOOM,
      Math.max(
        minimumCameraZoomForStage(session.stageSpec),
        cameraZoom * factor

    const nextPoint = canvasPoint(evt);
    const dx = nextPoint.x - cameraPan.lastPoint.x;
    const dy = nextPoint.y - cameraPan.lastPoint.y;
    cameraCenter.x -= dx / cameraZoom;
    cameraCenter.y -= dy / cameraZoom;
    cameraPan.lastPoint = nextPoint;
    evt.preventDefault();
  });

  function endCameraPan(evt) {
    if (!cameraPan.active || evt.pointerId !== cameraPan.pointerId) return;
    cameraPan.active = false;
    cameraPan.pointerId = null;
    cameraPan.lastPoint = null;
    if (canvas.hasPointerCapture?.(evt.pointerId)) {

      return;

    if (session.world.battleState !== BattleState.RUNNING) return;
    if (evt.button !== 0) return;

    const p = screenToWorld(canvasPoint(evt));

    const coreRadius = 18 / cameraZoom;
    const assistRadius = session.stageSpec.useAssistSelection
      ? 38 / cameraZoom

    const candidates = session.world.tracks
      .filter(t => t.visible)
      .map(t => {
        const d = distance(p, t.displayPosition);
        const engaged = session.isTrackEngaged(t);
        const pending = session.isTrackPending(t);
        return {
          track: t,
          distance: d,
          inCore: d <= coreRadius,
          inAssist: d <= assistRadius,
          eligible:
            !engaged &&
            !pending &&
            session.canCreateReservation(t),
        };
      })
      .filter(c => c.inAssist);

    candidates.sort((a, b) => {
      // Stage 02 selection priority:
      // selectable > Core Area > closer to pointer > stable Track order.
      if (a.eligible !== b.eligible) return a.eligible ? -1 : 1;
      if (a.inCore !== b.inCore) return a.inCore ? -1 : 1;
      if (a.distance !== b.distance) return a.distance - b.distance;
      return a.track.trackId.localeCompare(b.track.trackId);
    });

    if (candidates.length) {
      const reservable = candidates.find(candidate => candidate.eligible);
      const existing = candidates.find(candidate =>
        session.isTrackEngaged(candidate.track) ||
        session.isTrackPending(candidate.track)
      );
      const chosen = reservable || existing || null;
      if (chosen) {
        session.selectTrack(chosen.track.trackId);
      }
    }
  });

  function buildRadarScale() {
    if (
      !radarScaleOverlayEl ||
      !radarAxisLinesEl ||
      !radarTickLinesEl ||
      !radarAzimuthLabelsEl
    ) return;

    const NS = "http://www.w3.org/2000/svg";
    const center = 103.5;

    // Bright blue/cyan instrument ring is the geometric reference.
    const blueRingRadius = 92.5;

    // Every crosshair/diagonal diameter terminates on that ring.
    const axisRadius = blueRingRadius;

    // Tick hierarchy grows OUTWARD from the blue ring instead of carving inward.
    const tickBaseRadius = 94.0;
    const minorTickOuterRadius = 99.0;
    const mediumTickOuterRadius = 102.0;
    const majorTickOuterRadius = 106.0;

    const labelEdgeGap = 4.0;

    radarAxisLinesEl.replaceChildren();
    radarTickLinesEl.replaceChildren();
    radarAzimuthLabelsEl.replaceChildren();

    const point = (angleRadians, radius) => ({
      x: center + Math.cos(angleRadians) * radius,
      y: center + Math.sin(angleRadians) * radius,
    });

    // Six exact diameters. All use the same master center.
    for (let axisDegrees = 0; axisDegrees < 180; axisDegrees += 30) {
      const angle = (axisDegrees - 90) * Math.PI / 180;
      const a = point(angle, axisRadius);
      const b = point(angle + Math.PI, axisRadius);
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", a.x.toFixed(3));
      line.setAttribute("y1", a.y.toFixed(3));
      line.setAttribute("x2", b.x.toFixed(3));
      line.setAttribute("y2", b.y.toFixed(3));
      line.setAttribute(
        "class",
        axisDegrees % 90 === 0 ? "axis-main" : "axis-secondary"
      );
      radarAxisLinesEl.appendChild(line);
    }

    // Three-level SVG line ticks:
    // 2° minor / 10° medium / 30° major.
    // All begin outside the blue ring and extend outward.
    for (let degrees = 0; degrees < 360; degrees += 2) {
      const angle = (degrees - 90) * Math.PI / 180;
      const major = degrees % 30 === 0;
      const medium = !major && degrees % 10 === 0;

      const outerRadius =
        major
          ? majorTickOuterRadius
          : medium
            ? mediumTickOuterRadius
            : minorTickOuterRadius;

      const a = point(angle, tickBaseRadius);
      const b = point(angle, outerRadius);

      const tick = document.createElementNS(NS, "line");
      tick.setAttribute("x1", a.x.toFixed(3));
      tick.setAttribute("y1", a.y.toFixed(3));
      tick.setAttribute("x2", b.x.toFixed(3));
      tick.setAttribute("y2", b.y.toFixed(3));
      tick.setAttribute(
        "class",
        major
          ? "tick-major"
          : medium
            ? "tick-medium"
            : "tick-minor"
      );
      radarTickLinesEl.appendChild(tick);
    }

    // Put labels only far enough outside the tick ring to keep a constant
    // visible edge gap. Their actual SVG bounding boxes are used, so 000/180
    // and 090/270 do not receive an artificially identical center radius.
    const pendingLabels = [];

    for (let degrees = 0; degrees < 360; degrees += 30) {
      const angle = (degrees - 90) * Math.PI / 180;
      const label = document.createElementNS(NS, "text");
      label.setAttribute("class", "azimuth-label");
      label.textContent = String(degrees).padStart(3, "0");

      // Temporary location so getBBox() can measure the rendered text.
      label.setAttribute("x", center);
      label.setAttribute("y", center);
      radarAzimuthLabelsEl.appendChild(label);
      pendingLabels.push({ label, angle });
    }

    for (const { label, angle } of pendingLabels) {
      const box = label.getBBox();
      const radialHalfExtent =
        Math.abs(Math.cos(angle)) * box.width * 0.5 +
        Math.abs(Math.sin(angle)) * box.height * 0.5;
      const labelRadius =
        majorTickOuterRadius + labelEdgeGap + radialHalfExtent;
      const p = point(angle, labelRadius);

      label.setAttribute("x", p.x.toFixed(3));
      label.setAttribute("y", p.y.toFixed(3));
    }
  }

  function makeShipVectorPaths() {
    const hull = new Path2D();
    hull.moveTo(0, -0.52);
    hull.lineTo(0.11, -0.36);
    hull.lineTo(0.15, -0.12);
    hull.lineTo(0.14, 0.22);
    hull.lineTo(0.09, 0.46);
    hull.lineTo(0.04, 0.52);
    hull.lineTo(-0.04, 0.52);
    hull.lineTo(-0.09, 0.46);
    hull.lineTo(-0.14, 0.22);
    hull.lineTo(-0.15, -0.12);
    hull.lineTo(-0.11, -0.36);
    hull.closePath();

    const superstructure = new Path2D();
    superstructure.rect(-0.075, -0.18, 0.15, 0.16);
    superstructure.rect(-0.060, 0.03, 0.12, 0.13);

    const deck = new Path2D();
    deck.moveTo(0, -0.44);
    deck.lineTo(0, 0.43);
    deck.moveTo(-0.10, -0.25);
    deck.lineTo(0.10, -0.25);
    deck.moveTo(-0.09, 0.19);
    deck.lineTo(0.09, 0.19);

    return Object.freeze({
      hull,
      superstructure,
      deck,
    });
  }

  const SHIP_VECTOR_PATHS = makeShipVectorPaths();

  const TacticalChartRenderer = {
    columnLabel(index) {
      let n = Math.max(0, Math.trunc(index)) + 1;
      let label = "";
      while (n > 0) {
        n -= 1;
        label = String.fromCharCode(65 + (n % 26)) + label;
        n = Math.floor(n / 26);
      }
      return label;
    },

    plotRect() {
      const viewport = cameraPlotViewport();
      return {
        left: viewport.left,
        top: viewport.top,
        right: viewport.right,
        bottom: viewport.bottom,
      };
    },

    beginPlotClip() {
      const plot = this.plotRect();
      tacticalSurface.setScreenTransform(ctx);
      ctx.beginPath();
      ctx.rect(
        plot.left,
        plot.top,
        plot.right - plot.left,
        plot.bottom - plot.top
      );
      ctx.clip();
    },

    drawCoordinateFrame(bounds, minorGrid, majorGrid) {
      tacticalSurface.setScreenTransform(ctx);
      ctx.save();

      const headerHeight =
        TACTICAL_CHART.coordinateHeaderHeight;
      const gutterWidth =
        TACTICAL_CHART.coordinateGutterWidth;

      /*
       * Two long coordinate boxes meet directly at one '\\' seam.
       * No separate upper-left corner square is created.
       */
      const boxLeft = 2.5;
      const boxTop = 2.5;
      const boxRight = W - 2.5;
      const boxBottom = H - 2.5;
      const seamX0 = boxLeft + 3.5;
      const seamY0 = boxTop + 3.5;
      const seamX1 = gutterWidth + 1.5;
      const seamY1 = headerHeight + 1.5;

      // Horizontal coordinate box.
      ctx.fillStyle = TACTICAL_CHART.coordinateFrameBackground;
      ctx.strokeStyle = TACTICAL_CHART.coordinateBorderColor;
      ctx.lineWidth = 1.05;
      ctx.beginPath();
      ctx.moveTo(seamX0, seamY0);
      ctx.lineTo(boxRight, boxTop);
      ctx.lineTo(boxRight, headerHeight + 1.5);
      ctx.lineTo(seamX1, seamY1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Vertical coordinate box.
      ctx.beginPath();
      ctx.moveTo(seamX0, seamY0);
      ctx.lineTo(seamX1, seamY1);
      ctx.lineTo(gutterWidth + 1.5, boxBottom);
      ctx.lineTo(boxLeft, boxBottom);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Inner structure lines.
      ctx.strokeStyle = TACTICAL_CHART.coordinateInnerBorderColor;
      ctx.lineWidth = 0.85;

      ctx.beginPath();
      ctx.moveTo(seamX0 + 3, seamY0 + 1);
      ctx.lineTo(boxRight - 3, boxTop + 3);
      ctx.lineTo(boxRight - 3, headerHeight - 0.5);
      ctx.lineTo(seamX1 - 2, seamY1 - 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(seamX0 + 1, seamY0 + 3);
      ctx.lineTo(seamX1 - 2, seamY1 - 2);
      ctx.lineTo(gutterWidth - 0.5, boxBottom - 3);
      ctx.lineTo(boxLeft + 3, boxBottom - 3);
      ctx.stroke();

      // Shared diagonal seam: upper-left to lower-right.
      ctx.strokeStyle = "rgba(132, 238, 255, .78)";
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      ctx.moveTo(seamX0, seamY0);
      ctx.lineTo(seamX1, seamY1);
      ctx.stroke();

      const startMinorX =
        Math.floor(bounds.left / minorGrid) * minorGrid;
      const startMinorY =
        Math.floor(bounds.top / minorGrid) * minorGrid;

      // Ruler ticks: every minor interval gets a short tick, with major
      // boundaries receiving a longer/brighter mark.
      for (
        let x = startMinorX;
        x <= bounds.right + minorGrid;
        x += minorGrid
      ) {
        const p = worldToScreen(new Vec2(x, cameraCenter.y));
        if (p.x < gutterWidth || p.x > W) continue;

        const isMajor =
          Math.round(x / minorGrid) %
            TACTICAL_CHART.majorEvery === 0;

        ctx.strokeStyle = isMajor
          ? TACTICAL_CHART.coordinateMajorTickColor
          : TACTICAL_CHART.coordinateMinorTickColor;
        ctx.lineWidth = isMajor ? 1 : 0.75;
        ctx.beginPath();
        ctx.moveTo(
          p.x,
          headerHeight - (isMajor ? 8 : 4)
        );
        ctx.lineTo(p.x, headerHeight - 1);
        ctx.stroke();
      }

      for (
        let y = startMinorY;
        y <= bounds.bottom + minorGrid;
        y += minorGrid
      ) {
        const p = worldToScreen(new Vec2(cameraCenter.x, y));
        if (p.y < headerHeight || p.y > H) continue;

        const isMajor =
          Math.round(y / minorGrid) %
            TACTICAL_CHART.majorEvery === 0;

        ctx.strokeStyle = isMajor
          ? TACTICAL_CHART.coordinateMajorTickColor
          : TACTICAL_CHART.coordinateMinorTickColor;
        ctx.lineWidth = isMajor ? 1 : 0.75;
        ctx.beginPath();
        ctx.moveTo(
          gutterWidth - (isMajor ? 8 : 4),
          p.y
        );
        ctx.lineTo(gutterWidth - 1, p.y);
        ctx.stroke();
      }

      // Coordinates label the major-grid CELLS, not the grid line itself.
      // This makes A/B/C and 01/02/03 read as a frame index rather than text
      // floating directly on top of tactical grid lines.
      ctx.fillStyle = TACTICAL_CHART.coordinateColor;
      ctx.font =
        "700 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx.textBaseline = "middle";

      const startMajorX =
        Math.floor(bounds.left / majorGrid) * majorGrid;
      const startMajorY =
        Math.floor(bounds.top / majorGrid) * majorGrid;

      ctx.textAlign = "center";
      let columnOrdinal = 0;
      for (
        let x = startMajorX;
        x <= bounds.right;
        x += majorGrid, columnOrdinal++
      ) {
        const left =
          worldToScreen(new Vec2(x, cameraCenter.y)).x;
        const right =
          worldToScreen(
            new Vec2(x + majorGrid, cameraCenter.y)
          ).x;
        const center = (left + right) * 0.5;

        if (
          center < gutterWidth + 8 ||
          center > W - 8
        ) {
          continue;
        }

        ctx.fillText(
          this.columnLabel(columnOrdinal),
          center,
          headerHeight * 0.43
        );
      }

      ctx.textAlign = "center";
      let rowOrdinal = 1;
      for (
        let y = startMajorY;
        y <= bounds.bottom;
        y += majorGrid, rowOrdinal++
      ) {
        const top =
          worldToScreen(new Vec2(cameraCenter.x, y)).y;
        const bottom =
          worldToScreen(
            new Vec2(cameraCenter.x, y + majorGrid)
          ).y;
        const center = (top + bottom) * 0.5;

        if (
          center < headerHeight + 7 ||
          center > H - 7
        ) {
          continue;
        }

        ctx.fillText(
          String(rowOrdinal).padStart(2, "0"),
          gutterWidth * 0.46,
          center
        );
      }

      ctx.restore();
    },

    draw() {
      tacticalSurface.setScreenTransform(ctx);
      ctx.fillStyle = TACTICAL_CHART.background;
      ctx.fillRect(0, 0, W, H);

      const bounds = visibleWorldBounds();
      const minorGrid = TACTICAL_CHART.minorGrid;
      const majorGrid =
        minorGrid * TACTICAL_CHART.majorEvery;

      const startX =
        Math.floor(bounds.left / minorGrid) * minorGrid;
      const startY =
        Math.floor(bounds.top / minorGrid) * minorGrid;

      ctx.save();

      // Grid belongs to the plot, not to the coordinate frame.
      this.beginPlotClip();
      beginWorldTransform();

      ctx.strokeStyle =
        TACTICAL_CHART.minorGridColor;
      ctx.lineWidth = 0.75 / cameraZoom;

      for (let x = startX; x <= bounds.right; x += minorGrid) {
        const major =
          Math.round(x / minorGrid) %
          TACTICAL_CHART.majorEvery === 0;
        if (major) continue;

        ctx.beginPath();
        ctx.moveTo(x, bounds.top);
        ctx.lineTo(x, bounds.bottom);
        ctx.stroke();
      }

      for (let y = startY; y <= bounds.bottom; y += minorGrid) {
        const major =
          Math.round(y / minorGrid) %
          TACTICAL_CHART.majorEvery === 0;
        if (major) continue;

        ctx.beginPath();
        ctx.moveTo(bounds.left, y);
        ctx.lineTo(bounds.right, y);
        ctx.stroke();
      }

      const startMajorX =
        Math.floor(bounds.left / majorGrid) * majorGrid;
      const startMajorY =
        Math.floor(bounds.top / majorGrid) * majorGrid;

      ctx.strokeStyle =
        TACTICAL_CHART.majorGridColor;
      ctx.lineWidth = 1.25 / cameraZoom;

      for (
        let x = startMajorX;
        x <= bounds.right;
        x += majorGrid
      ) {
        ctx.beginPath();
        ctx.moveTo(x, bounds.top);
        ctx.lineTo(x, bounds.bottom);
        ctx.stroke();
      }

      for (
        let y = startMajorY;
        y <= bounds.bottom;
        y += majorGrid
      ) {
        ctx.beginPath();
        ctx.moveTo(bounds.left, y);
        ctx.lineTo(bounds.right, y);
        ctx.stroke();
      }

      // Minor intersection markers.
      // Their screen-space radius is intentionally much smaller than the
      // major marker so the dense grid gains structure without becoming noisy.
      ctx.fillStyle = TACTICAL_CHART.minorNodeColor;
      const minorNodeRadius = 0.48 / cameraZoom;
      const minorNodeSize = minorNodeRadius * 2;

      for (
        let x = startX;
        x <= bounds.right;
        x += minorGrid
      ) {
        const xMajor =
          Math.round(x / minorGrid) %
            TACTICAL_CHART.majorEvery === 0;

        for (
          let y = startY;
          y <= bounds.bottom;
          y += minorGrid
        ) {
          const yMajor =
            Math.round(y / minorGrid) %
              TACTICAL_CHART.majorEvery === 0;

          // Major-major intersections are drawn separately with a brighter
          // glowing node. Every other minor-grid intersection gets a small dot.
          if (xMajor && yMajor) continue;

          ctx.fillRect(
            x - minorNodeRadius,
            y - minorNodeRadius,
            minorNodeSize,
            minorNodeSize
          );
        }
      }

      // Major intersection nodes remain larger and receive a small glow.
      ctx.fillStyle = TACTICAL_CHART.majorNodeColor;
      ctx.shadowColor =
        "rgba(119, 246, 230, .44)";
      ctx.shadowBlur = 5;
      const majorNodeRadius = 1.45 / cameraZoom;

      for (
        let x = startMajorX;
        x <= bounds.right;
        x += majorGrid
      ) {
        for (
          let y = startMajorY;
          y <= bounds.bottom;
          y += majorGrid
        ) {
          ctx.beginPath();
          ctx.arc(
            x,
            y,
            majorNodeRadius,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      ctx.restore();
    },

    drawFrame() {
      const bounds = visibleWorldBounds();
      const minorGrid = TACTICAL_CHART.minorGrid;
      const majorGrid =
        minorGrid * TACTICAL_CHART.majorEvery;

      this.drawCoordinateFrame(
        bounds,
        minorGrid,
        majorGrid
      );
    },
  };

  const MapOverlayRenderer = {
    // Reserved layer for future real stage coast/terrain data.
    // No decorative geography is invented at this stage.
    draw() {},
  };

  const SensorOverlayRenderer = {
    draw() {
      ctx.save();
      beginWorldTransform();

      ctx.strokeStyle =
        "rgba(117,226,255,.10)";
      ctx.lineWidth = 0.85 / cameraZoom;
      ctx.setLineDash([
        5 / cameraZoom,
        9 / cameraZoom,
      ]);
      ctx.beginPath();
      ctx.arc(
        WORLD_CENTER.x,
        WORLD_CENTER.y,
        145,
        0,
        Math.PI * 2
      );
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.restore();
    },
  };

  const RADAR_RANGE_RING_STYLE = Object.freeze({
    strokeStyle: "rgba(109, 255, 151, .68)",
    lineWidthPx: 1.55,
    dashPx: Object.freeze([16, 9]),
    shadowColor: "rgba(93, 255, 139, .24)",
    shadowBlurPx: 4,
  });

  const RADAR_RANGE_LABEL_STYLE = Object.freeze({
    fillStyle: "rgba(2, 14, 18, .90)",
    strokeStyle: "rgba(109, 255, 151, .82)",
    textStyle: "#d8ffe4",
    font: "700 11px system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif",
    heightPx: 21,
    padXPx: 7,
    insetPx: 18,
  });

  function applyRadarRangeRingStyle() {
    ctx.strokeStyle = RADAR_RANGE_RING_STYLE.strokeStyle;
    ctx.lineWidth =
      RADAR_RANGE_RING_STYLE.lineWidthPx / cameraZoom;
    ctx.setLineDash(
      RADAR_RANGE_RING_STYLE.dashPx.map(
        value => value / cameraZoom
      )
    );
    ctx.shadowColor =
      RADAR_RANGE_RING_STYLE.shadowColor;
    ctx.shadowBlur =
      RADAR_RANGE_RING_STYLE.shadowBlurPx / cameraZoom;
  }

  function drawRadarRangeLabel(
    radius,
    label,
    angleDegrees,
    insetPx=RADAR_RANGE_LABEL_STYLE.insetPx
  ) {
    const angle = angleDegrees * Math.PI / 180;
    const insetWorld =
      insetPx /
      Math.max(cameraZoom, 1e-9);
    const anchorRadius =
      Math.max(0, radius - insetWorld);
    const anchor = worldToScreen(new Vec2(
      WORLD_CENTER.x + Math.cos(angle) * anchorRadius,
      WORLD_CENTER.y + Math.sin(angle) * anchorRadius
    ));

    tacticalSurface.setScreenTransform(ctx);
    ctx.save();
    ctx.font = RADAR_RANGE_LABEL_STYLE.font;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const textWidth = ctx.measureText(label).width;
    const width =
      textWidth + RADAR_RANGE_LABEL_STYLE.padXPx * 2;
    const height = RADAR_RANGE_LABEL_STYLE.heightPx;
    const x = anchor.x - width * 0.5;
    const y = anchor.y - height * 0.5;

    ctx.fillStyle = RADAR_RANGE_LABEL_STYLE.fillStyle;
    ctx.strokeStyle = RADAR_RANGE_LABEL_STYLE.strokeStyle;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = RADAR_RANGE_LABEL_STYLE.textStyle;
    ctx.fillText(label, anchor.x, anchor.y + 0.5);
    ctx.restore();
  }

  const TrackingRadarOverlayRenderer = {
    draw(snapshot) {
      // Radar layers keep the established green dashed treatment.
      ctx.save();
      beginWorldTransform();
      applyRadarRangeRingStyle();

      for (const radius of [
        snapshot.rangeLayers.detection,
        snapshot.rangeLayers.engagement,
      ]) {
        ctx.beginPath();
        ctx.arc(
          WORLD_CENTER.x,
          WORLD_CENTER.y,
          radius,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }
      ctx.restore();

      // Close-defense layers read as weapon COVERAGE AREAS rather than lines.
      // They stay near the very back: above the grid, below radar rings/labels,
      // ships, missiles and every tactical overlay.
      const drawDefenseSurface = (radius, fillColor, edgeColor) => {
        ctx.save();
        beginWorldTransform();

        // Broad translucent area.
        ctx.setLineDash([]);
        ctx.shadowColor = fillColor;
        ctx.shadowBlur = 10 / cameraZoom;
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.arc(WORLD_CENTER.x, WORLD_CENTER.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // A very soft perimeter so the area edge can still be read,
        // without turning back into a hard "range line".
        ctx.shadowBlur = 0;
        ctx.strokeStyle = edgeColor;
        ctx.lineWidth = 1.35 / cameraZoom;
        ctx.beginPath();
        ctx.arc(WORLD_CENTER.x, WORLD_CENTER.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      };

      drawDefenseSurface(
        snapshot.rangeLayers.shortRange,
        "rgba(244, 178, 76, .085)",
        "rgba(255, 199, 103, .18)"
      );
      drawDefenseSurface(
        snapshot.rangeLayers.ciws,
        "rgba(184, 143, 255, .075)",
        "rgba(207, 177, 255, .16)"
      );

      // Only the two radar rings use letterbox labels.
      drawRadarRangeLabel(
        snapshot.rangeLayers.detection,
        "2차원 레이더(탐지)",
        -52
      );
      drawRadarRangeLabel(
        snapshot.rangeLayers.engagement,
        "3차원 레이더(유도)",
        -52
      );
    },
  };

  const ShipCollisionDebugRenderer = {
    draw(ship) {
      if (!RENDER_DEBUG.showShipCollision) return;

      ctx.save();
      beginWorldTransform();
      ctx.strokeStyle =
        "rgba(255, 96, 96, .88)";
      ctx.lineWidth = 1 / cameraZoom;
      ctx.setLineDash([
        6 / cameraZoom,
        5 / cameraZoom,
      ]);
      ctx.beginPath();
      ctx.arc(
        ship.x,
        ship.y,
        ship.r,
        0,
        Math.PI * 2
      );
      ctx.stroke();
      ctx.restore();
    },
  };

  const ShipVisualRenderer = {
    measure(ship) {
      const screenPosition =
        worldToScreen(
          new Vec2(ship.x, ship.y)
        );
      const lengthPx =
        shipVisualLengthForZoom(cameraZoom);
      return Object.freeze({
        x: screenPosition.x,
        y: screenPosition.y,
        lengthPx,
      });
    },

    drawSymbol(ship) {
      const metrics = this.measure(ship);
      const screenPosition = new Vec2(metrics.x, metrics.y);
      const lengthPx = metrics.lengthPx;
      const scale =
        lengthPx /
        SHIP_VISUAL.baseLengthPx;

      ctx.save();
      tacticalSurface.setScreenTransform(ctx);
      ctx.translate(
        screenPosition.x,
        screenPosition.y
      );
      ctx.scale(
        SHIP_VISUAL.baseLengthPx * scale,
        SHIP_VISUAL.baseLengthPx * scale
      );

      ctx.shadowColor =
        "rgba(104, 236, 247, .42)";
      ctx.shadowBlur = 5;

      ctx.fillStyle =
        SHIP_VISUAL.hullFill;
      ctx.strokeStyle =
        SHIP_VISUAL.hullStroke;
      ctx.lineWidth =
        1.15 /
        (SHIP_VISUAL.baseLengthPx * scale);

      ctx.fill(SHIP_VECTOR_PATHS.hull);
      ctx.stroke(SHIP_VECTOR_PATHS.hull);

      ctx.shadowBlur = 0;
      ctx.strokeStyle =
        SHIP_VISUAL.detailStroke;
      ctx.lineWidth =
        0.95 /
        (SHIP_VISUAL.baseLengthPx * scale);

      ctx.stroke(
        SHIP_VECTOR_PATHS.superstructure
      );
      ctx.stroke(
        SHIP_VECTOR_PATHS.deck
      );

      ctx.restore();

      return metrics;
    },

    drawLabel(metrics) {
      tacticalSurface.setScreenTransform(ctx);
      ctx.save();

      // The vector hull is only about 30% as wide as it is long.
      // Use its real visual half-width instead of half the ship length;
      // this keeps the identification box close to the icon at every zoom.
      const hullHalfWidth =
        metrics.lengthPx * 0.15;
      const labelY = metrics.y;
      const boxLeft =
        metrics.x +
        hullHalfWidth +
        SHIP_VISUAL.labelGapPx;

      ctx.font =
        "900 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const textWidth =
        ctx.measureText(
          SHIP_VISUAL.name
        ).width;
      const boxWidth = textWidth + 14;
      const boxHeight =
        SHIP_VISUAL.labelHeightPx;
      const boxTop =
        labelY - boxHeight * 0.5;

      // Short identification leader.
      ctx.strokeStyle =
        SHIP_VISUAL.leaderColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(
        metrics.x + hullHalfWidth,
        labelY
      );
      ctx.lineTo(
        boxLeft,
        labelY
      );
      ctx.stroke();

      // High-contrast tactical letterbox.
      ctx.fillStyle =
        SHIP_VISUAL.labelBackground;
      ctx.fillRect(
        boxLeft,
        boxTop,
        boxWidth,
        boxHeight
      );

      ctx.strokeStyle =
        SHIP_VISUAL.labelBorderColor;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(
        boxLeft + 0.75,
        boxTop + 0.75,
        boxWidth - 1.5,
        boxHeight - 1.5
      );

      ctx.fillStyle = "#FFF";
      ctx.shadowColor =
        "rgba(255, 255, 255, .18)";
      ctx.shadowBlur = 2;
      ctx.fillText(
        SHIP_VISUAL.name,
        boxLeft + 7,
        labelY + 0.5
      );

      ctx.restore();
    },

    draw(ship) {
      // Visual size intentionally does NOT reference collision geometry.
      // Collision size remains simulation-only data.
      const metrics =
        this.drawSymbol(ship);
      this.drawLabel(metrics);
    },
  };

  function drawGrid() {
    TacticalChartRenderer.draw();
    MapOverlayRenderer.draw();
    SensorOverlayRenderer.draw();
  }

  function hostileMissilePalette(sensorProfile, damageProfile="NORMAL") {
    // D-09: damage profile overrides ordinary hostile classification colors.
    // Engaged/Pending selection-state colors are handled separately.
    if (damageProfile === "SPECIAL") {
      return {
        fill: "#E4259B",
        stroke: "#FF9DDE",
        exhaust: "rgba(228,37,155,.65)",
        ui: "#E4259B",
      };
    }
    if (sensorProfile === SensorProfile.LOW_ALTITUDE) {
      return {
        fill: "#b32232",
        stroke: "#ff7680",
        exhaust: "rgba(179,34,50,.68)",
        ui: "#d83b48",
      };
    }

    return {
      fill: "#ff7040",
      stroke: "#ffd0aa",
      exhaust: "rgba(255,112,64,.60)",
      ui: "#ff8a58",
    };
  }

  function drawAttackMissile(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.heading);
    const visualScale = ((m.displayRadius ?? 5) / 5) * 3;
    ctx.scale(visualScale, visualScale);

    // SPECIAL damage is magenta above NORMAL-orange / LOW_ALTITUDE-red.
    // SEA_SKIMMING and speed remain independent of the threat color.
    const palette = hostileMissilePalette(m.sensorProfile, m.damageProfile);
    ctx.fillStyle = palette.fill;
    ctx.strokeStyle = palette.stroke;
    ctx.lineWidth = 1.15;

    // Hostile missile icon is intentionally reduced to one directional
    // triangle. Speed-class visual scale and sensor-profile color still apply.
    ctx.beginPath();
    ctx.moveTo(13, 0);
    ctx.lineTo(-11, -6.5);
    ctx.lineTo(-11, 6.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if (m.entityKind === HostileKind.BOMBER) {
      // Bomber uses the largest existing hostile triangle and one red circle.
      ctx.beginPath();
      ctx.fillStyle = "#F81541";
      ctx.arc(-1.2, 0, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }


  function targetUiColor(t) {
    if (t.engaged) return "#66b9ff";
    if (t.pending) return "#ffcf66";
    return hostileMissilePalette(t.sensorProfile, t.damageProfile).ui;
  }

  function drawTrackInfo(t) {
    ctx.save();
    ctx.translate(t.x, t.y);

    // Shared Target HUD scale. No per-frame circle/letterbox distance calculation.
    ctx.scale(
      targetHudScreenScale / cameraZoom,
      targetHudScreenScale / cameraZoom
    );

    const color = targetUiColor(t);
    const targetCode = t.targetLabel || t.id.replace(/^TRACK-/, "T-");
    const label = t.tti == null ? "AIR" : `TTI ${Math.max(0, t.tti).toFixed(1)}s`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Fixed local geometry. Because target marker and letter boxes share the
    // exact same scale, this tangent relationship survives every camera zoom.
    const codeY =
      t.selected
        ? TARGET_HUD.letterboxTopSelected
        : (t.pending || t.engaged)
          ? TARGET_HUD.letterboxTopNormal
          : TARGET_HUD.letterboxTopSelected;

    ctx.font =
      `900 ${TARGET_HUD.targetCodeFontPx}px ` +
      `ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

    const codeWidth = Math.max(
      TARGET_HUD.targetCodeMinWidth,
      ctx.measureText(targetCode).width +
        TARGET_HUD.targetCodePaddingX
    );
    const codeHeight = TARGET_HUD.targetCodeHeight;

    ctx.fillStyle = "rgba(2, 10, 16, .90)";
    ctx.fillRect(-codeWidth / 2, codeY, codeWidth, codeHeight);

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.58;
    ctx.lineWidth = TARGET_HUD.letterboxStrokeWidth;
    ctx.strokeRect(-codeWidth / 2, codeY, codeWidth, codeHeight);
    ctx.globalAlpha = 1;

    ctx.fillStyle = color;
    ctx.fillText(
      targetCode,
      0,
      codeY + codeHeight / 2
    );

    ctx.font =
      `700 ${TARGET_HUD.ttiFontPx}px ` +
      `ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

    const textWidth = ctx.measureText(label).width;
    const boxWidth =
      textWidth + TARGET_HUD.ttiPaddingX;
    const boxHeight = TARGET_HUD.ttiHeight;
    const boxY = codeY + codeHeight;

    ctx.fillStyle = "rgba(2, 10, 16, .90)";
    ctx.fillRect(-boxWidth / 2, boxY, boxWidth, boxHeight);

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.72;
    ctx.lineWidth = TARGET_HUD.letterboxStrokeWidth;
    ctx.strokeRect(-boxWidth / 2, boxY, boxWidth, boxHeight);
    ctx.globalAlpha = 1;

    ctx.fillStyle = color;
    ctx.fillText(
      label,
      0,
      boxY + boxHeight / 2
    );

    ctx.restore();
  }

  function drawTargetOverlay(t) {
    // Only targets that are selected/reserved/engaged receive the reticle.
    if (!t.selected && !t.pending && !t.engaged) return;

    ctx.save();
    ctx.translate(t.x, t.y);

    ctx.scale(
      targetHudScreenScale / cameraZoom,
      targetHudScreenScale / cameraZoom
    );

    const c = targetUiColor(t);
    ctx.strokeStyle = c;
    ctx.fillStyle = c;
    ctx.lineWidth = t.selected
      ? TARGET_HUD.targetStrokeSelected
      : TARGET_HUD.targetStrokeNormal;

    const s = TARGET_HUD.targetSquareHalfSize;
    const crosshairOuter = TARGET_HUD.targetCrosshairOuter;
    const crosshairGap = TARGET_HUD.targetCrosshairGap;

    ctx.strokeRect(-s, -s, s * 2, s * 2);

    ctx.beginPath();
    ctx.moveTo(-crosshairOuter, 0);
    ctx.lineTo(-s - crosshairGap, 0);
    ctx.moveTo(s + crosshairGap, 0);
    ctx.lineTo(crosshairOuter, 0);
    ctx.moveTo(0, -crosshairOuter);
    ctx.lineTo(0, -s - crosshairGap);
    ctx.moveTo(0, s + crosshairGap);
    ctx.lineTo(0, crosshairOuter);
    ctx.stroke();

    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.arc(
      0,
      0,
      TARGET_HUD.targetCircleRadius,
      0,
      Math.PI * 2
    );
    ctx.stroke();
    ctx.setLineDash([]);

    // Center identifier follows the UI symbol families:
    // pure future Queue = numeric 01..04, CH-owned PENDING/active = Latin letter,
    // active FINAL CH = Greek symbol.
    const centerIdentifier =
      t.reservationNumber != null
        ? String(t.reservationNumber).padStart(2, "0")
        : (t.channelShortCode || t.finalChannelShortCode || null);

    if (centerIdentifier != null) {
      const fittedFontPx =
        fittedTargetIdentifierLocalFontPx(centerIdentifier);

      ctx.font =
        `900 ${fittedFontPx}px ` +
        `ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // The identifier background is also constrained inside the 30×30 square.
      ctx.fillStyle = "rgba(2, 9, 15, .84)";
      ctx.fillRect(
        -TARGET_HUD.centerIdentifierBoxWidth / 2,
        -TARGET_HUD.centerIdentifierBoxHeight / 2,
        TARGET_HUD.centerIdentifierBoxWidth,
        TARGET_HUD.centerIdentifierBoxHeight
      );

      ctx.fillStyle = c;
      ctx.fillText(centerIdentifier, 0, 0);
    }

    ctx.restore();
  }

  function drawClosestThreatWarning(t, simulationTime) {
    if (!t.warning) return;

    ctx.save();
    ctx.translate(t.x, t.y);

    ctx.scale(
      targetHudScreenScale / cameraZoom,
      targetHudScreenScale / cameraZoom
    );

    const pulse = 0.5 + 0.5 * Math.sin(simulationTime * Math.PI * 4);
    const warningRadius = 39 + pulse * 6;

    ctx.strokeStyle = `rgba(255, 66, 66, ${0.72 + pulse * 0.24})`;
    ctx.fillStyle = "#ff5252";
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, warningRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = "900 13px system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(18, 3, 5, .90)";
    ctx.fillRect(-29, -58, 58, 18);
    ctx.strokeStyle = "rgba(255, 84, 84, .92)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-29, -58, 58, 18);
    ctx.fillStyle = "#ff6666";
    ctx.fillText("DANGER", 0, -48.5);

    ctx.restore();
  }

  const INTERCEPTOR_VISUAL = Object.freeze({
    baseLengthPx: 15,
    minLengthPx: 9,
    maxLengthPx: 24,
    bodyFill: "rgba(244, 252, 255, .34)",
    bodyStroke: "#f4fcff",
    detailStroke: "rgba(244, 252, 255, .94)",
    glowColor: "rgba(112, 222, 236, .34)",
    labelColor: "#ffffff",
    labelOffsetPx: 12,
  });

  const INTERCEPTOR_TRAIL_VISUAL = Object.freeze({
    color: "rgba(178, 229, 235, .66)",
    lineWidthPx: 1.15,
    dashPx: 7,
    gapPx: 2,
  });

  function interceptorVisualLengthForZoom(zoom) {
    const zoomRatio = zoom / defaultCameraZoomForCurrentPlot();
    return Math.min(
      INTERCEPTOR_VISUAL.maxLengthPx,
      Math.max(
        INTERCEPTOR_VISUAL.minLengthPx,
        INTERCEPTOR_VISUAL.baseLengthPx * zoomRatio
      )
    );
  }

  // WEAPON_4 is used by both the automatic short-range defense and the
  // player-selectable M4. Its tactical body has dedicated pixel dimensions;
  // missile flight, collision geometry, trails and distance labels are shared.
  function shortRangeInterceptorVisualLengthForZoom(zoom) {
    const zoomRatio = zoom / defaultCameraZoomForCurrentPlot();
    return Math.min(16, Math.max(6, 10 * zoomRatio));
  }

  function makeInterceptorVectorPaths() {
    // Normalized top-view interceptor missile.
    // Local +X is the nose direction.
    //
    // The body stays rounded/elongated rather than triangular.
    // Two visually distinct fin pairs are cached separately:
    // - larger mid-body control fins
    // - smaller rear stabilizing fins
    const body = new Path2D();
    body.moveTo(0.52, 0);
    body.bezierCurveTo(
      0.48, -0.035,
      0.43, -0.060,
      0.33, -0.065
    );
    body.lineTo(-0.39, -0.065);
    body.quadraticCurveTo(-0.50, -0.048, -0.52, 0);
    body.quadraticCurveTo(-0.50, 0.048, -0.39, 0.065);
    body.lineTo(0.33, 0.065);
    body.bezierCurveTo(
      0.43, 0.060,
      0.48, 0.035,
      0.52, 0
    );
    body.closePath();

    const midFins = new Path2D();
    midFins.moveTo(0.05, -0.055);
    midFins.lineTo(-0.06, -0.245);
    midFins.lineTo(-0.17, -0.215);
    midFins.lineTo(-0.12, -0.055);
    midFins.closePath();
    midFins.moveTo(0.05, 0.055);
    midFins.lineTo(-0.06, 0.245);
    midFins.lineTo(-0.17, 0.215);
    midFins.lineTo(-0.12, 0.055);
    midFins.closePath();

    const tailFins = new Path2D();
    tailFins.moveTo(-0.31, -0.055);
    tailFins.lineTo(-0.40, -0.155);
    tailFins.lineTo(-0.49, -0.135);
    tailFins.lineTo(-0.44, -0.050);
    tailFins.closePath();
    tailFins.moveTo(-0.31, 0.055);
    tailFins.lineTo(-0.40, 0.155);
    tailFins.lineTo(-0.49, 0.135);
    tailFins.lineTo(-0.44, 0.050);
    tailFins.closePath();

    const detail = new Path2D();
    detail.moveTo(0.37, 0);
    detail.lineTo(-0.43, 0);
    detail.moveTo(-0.43, -0.045);
    detail.lineTo(-0.43, 0.045);

    return Object.freeze({
      body,
      midFins,
      tailFins,
      detail,
    });
  }

  const INTERCEPTOR_VECTOR_PATHS =
    makeInterceptorVectorPaths();

  function buildInterceptorPresentationMetrics(snapshot) {
    return snapshot.interceptors.map(interceptor => {
      const screenPosition = worldToScreen(
        new Vec2(interceptor.x, interceptor.y)
      );

      // Only the WEAPON_4 body silhouette uses the short-range GUI size.
      // Flight trail, distance label and hit radius remain independent.
      const visualLengthPx =
        interceptor.weaponId === WEAPON_IDS.FOUR
          ? shortRangeInterceptorVisualLengthForZoom(cameraZoom)
          : interceptorVisualLengthForZoom(cameraZoom);

      // Trail points are simulation-history samples, not a live straight
      // connection to the ship. This preserves every actual steering change.
      const trailScreenPoints =
        (interceptor.trailPoints || []).map(point =>
          worldToScreen(
            new Vec2(point.x, point.y)
          )
        );

      // Always finish the rendered trail at the exact current interceptor
      // position even when the spatial sampler has not emitted a new point.
      const lastTrailPoint =
        trailScreenPoints.length
          ? trailScreenPoints[trailScreenPoints.length - 1]
          : null;

      if (
        !lastTrailPoint ||
        Math.hypot(
          lastTrailPoint.x - screenPosition.x,
          lastTrailPoint.y - screenPosition.y
        ) > 0.5
      ) {
        trailScreenPoints.push(screenPosition);
      }

      const direction = new Vec2(
        Math.cos(interceptor.heading),
        Math.sin(interceptor.heading)
      );
      const normal = new Vec2(
        -direction.y,
        direction.x
      );

      return Object.freeze({
        interceptor,
        screenPosition,
        trailScreenPoints,
        visualLengthPx,
        direction,
        normal,
      });
    });
  }

  function formatTacticalDistance(distanceValue) {
    if (
      distanceValue == null ||
      !Number.isFinite(distanceValue)
    ) {
      return "";
    }

    // Project display scale:
    // 10 game-distance units = 1 km.
    // This formatter is currently used by the interceptor remaining-distance
    // label only; simulation/world distances themselves are unchanged.
    return `${(distanceValue / 10).toFixed(1)} km`;
  }

  const InterceptorTrailRenderer = {
    drawAll(metricsList) {
      tacticalSurface.setScreenTransform(ctx);
      ctx.save();

      ctx.strokeStyle =
        INTERCEPTOR_TRAIL_VISUAL.color;
      ctx.lineWidth =
        INTERCEPTOR_TRAIL_VISUAL.lineWidthPx;
      ctx.setLineDash([
        INTERCEPTOR_TRAIL_VISUAL.dashPx,
        INTERCEPTOR_TRAIL_VISUAL.gapPx,
      ]);
      ctx.lineCap = "butt";
      ctx.lineJoin = "round";

      for (const metrics of metricsList) {
        const points = metrics.trailScreenPoints;
        if (points.length < 2) continue;

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }

        ctx.stroke();
      }

      ctx.setLineDash([]);
      ctx.restore();
    },
  };

  const InterceptorVisualRenderer = {
    drawOne(metrics) {
      const interceptor = metrics.interceptor;
      const lengthPx = metrics.visualLengthPx;
      ctx.save();
      tacticalSurface.setScreenTransform(ctx);
      ctx.translate(
        metrics.screenPosition.x,
        metrics.screenPosition.y
      );
      ctx.rotate(interceptor.heading);

      // Paths are normalized to about one unit of total length.
      ctx.scale(lengthPx, lengthPx);

      ctx.shadowColor =
        INTERCEPTOR_VISUAL.glowColor;
      ctx.shadowBlur = 4;

      ctx.fillStyle =
        INTERCEPTOR_VISUAL.bodyFill;
      ctx.strokeStyle =
        INTERCEPTOR_VISUAL.bodyStroke;
      ctx.lineWidth =
        1.0 / lengthPx;

      ctx.fill(INTERCEPTOR_VECTOR_PATHS.body);
      ctx.stroke(INTERCEPTOR_VECTOR_PATHS.body);

      ctx.fillStyle =
        "rgba(207, 250, 232, .24)";
      ctx.fill(INTERCEPTOR_VECTOR_PATHS.midFins);
      ctx.fill(INTERCEPTOR_VECTOR_PATHS.tailFins);

      ctx.shadowBlur = 0;
      ctx.strokeStyle =
        INTERCEPTOR_VISUAL.detailStroke;
      ctx.lineWidth =
        0.82 / lengthPx;
      ctx.stroke(INTERCEPTOR_VECTOR_PATHS.midFins);
      ctx.stroke(INTERCEPTOR_VECTOR_PATHS.tailFins);
      ctx.stroke(INTERCEPTOR_VECTOR_PATHS.detail);

      ctx.restore();
    },

    drawAll(metricsList) {
      for (const metrics of metricsList) {
        this.drawOne(metrics);
      }
    },
  };

  const InterceptorLabelRenderer = {
    drawOne(metrics) {
      const interceptor = metrics.interceptor;
      const label =
        formatTacticalDistance(
          interceptor.remainingDistance
        );
      if (!label) return;

      // Place the label to the side of the missile using its heading-normal,
      // so it does not cover the elongated body as the missile turns.
      const sideSign =
        Number(
          interceptor.channelId?.split("-")[1] || 1
        ) % 2 === 0
          ? -1
          : 1;

      const offset =
        INTERCEPTOR_VISUAL.labelOffsetPx * sideSign;

      const labelX =
        metrics.screenPosition.x +
        metrics.normal.x * offset;
      const labelY =
        metrics.screenPosition.y +
        metrics.normal.y * offset;

      ctx.save();
      tacticalSurface.setScreenTransform(ctx);
      ctx.font =
        "700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle =
        INTERCEPTOR_VISUAL.labelColor;
      ctx.shadowColor =
        "rgba(0, 0, 0, .92)";
      ctx.shadowBlur = 3;

      ctx.fillText(
        label,
        labelX,
        labelY
      );
      ctx.restore();
    },

    drawAll(metricsList) {
      for (const metrics of metricsList) {
        this.drawOne(metrics);
      }
    },
  };

  function drawCIWSGunfire(snapshot) {
    if (snapshot.ciwsGun?.phase !== "FIRING" ||
        !snapshot.ciwsGun.targetTrackId) return;
    const target = snapshot.tracks.find(t =>
      t.id === snapshot.ciwsGun.targetTrackId
    );
    if (!target) return;
    // Presentation only: use the published Track, not the enemy truth position.
    ctx.save();
    ctx.strokeStyle = "rgba(207, 177, 255, .8)";
    ctx.lineWidth = 1.5 / cameraZoom;
    ctx.setLineDash([5 / cameraZoom, 6 / cameraZoom]);
    ctx.lineDashOffset = -snapshot.time * 95 / cameraZoom;
    ctx.beginPath();
    ctx.moveTo(snapshot.ship.x, snapshot.ship.y);
    ctx.lineTo(target.x, target.y);
    ctx.stroke();
    ctx.restore();
  }

  function drawEffects(effects) {
    for (const e of effects) {
      ctx.save();
      const alpha = 1 - e.t;

      if (e.type === "selfDestruct") {
        const radius = 10 + e.t * 38;
        const arm = 6 + e.t * 18;

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = "#ff3b4f";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(e.x - arm, e.y - arm);
        ctx.lineTo(e.x + arm, e.y + arm);
        ctx.moveTo(e.x + arm, e.y - arm);
        ctx.lineTo(e.x - arm, e.y + arm);
        ctx.stroke();

        ctx.restore();
        continue;
      }

      const radius = 12 + e.t * (e.type === "shipHit" ? 70 : 44);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = e.type === "shipHit" ? "#ff6b6b" : "#ffcf66";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }


  function drawSensorSweep(c, snapshot, center, radius) {
    if (snapshot.sensorUpdateInterval <= 0) return;

    // One actual visual sweep line.
    // The 15-degree segmentation exists only in Track update logic.
    // Presentation keeps a soft radar afterglow, but never draws extra
    // radial sweep lines that could look like additional rotors.
    const headAngle = snapshot.radarSweepHeadAngle;

    c.save();

    // Soft fan-shaped afterglow behind the single sweep head.
    // Filled wedges are used instead of radial strokes, so the trail reads
    // as illumination rather than multiple radar lines.
    const trailArc = Math.PI * 0.86;
    const trailSlices = 26;

    for (let i = trailSlices; i >= 1; i--) {
      const farT = i / trailSlices;
      const nearT = (i - 1) / trailSlices;
      const startAngle = headAngle - trailArc * farT;
      const endAngle = headAngle - trailArc * nearT;

      const alpha =
        Math.pow(1 - nearT, 1.72) * 0.31;

      c.fillStyle = `rgba(74, 238, 126, ${alpha})`;
      c.beginPath();
      c.moveTo(center, center);
      c.arc(
        center,
        center,
        radius,
        startAngle,
        endAngle,
        false
      );
      c.closePath();
      c.fill();
    }

    // Subtle glow around the head.
    c.shadowColor = "rgba(114, 255, 151, .72)";
    c.shadowBlur = 6;
    c.lineCap = "round";
    c.strokeStyle = "rgba(142, 255, 170, .96)";
    c.lineWidth = 1.7;

    // The only visible radial sweep line.
    c.beginPath();
    c.moveTo(center, center);
    c.lineTo(
      center + Math.cos(headAngle) * radius,
      center + Math.sin(headAngle) * radius
    );
    c.stroke();

    c.restore();
  }


  function drawMinimap(snapshot) {
    const c = minimapCtx;
    const width = minimapSurface.logicalWidth;
    const height = minimapSurface.logicalHeight;
    const centerX = width * 0.5;
    const centerY = height * 0.5;
    const center = centerX;

    // Two distinct radii:
    // 1) GREEN detection ring = position/projection reference.
    // 2) BLUE instrument ring = actual visual clipping boundary.
    const blueClipRadius = 92.5;
    const detectionRingRadius = 84.75;
    const sweepRadius = detectionRingRadius;

    minimapSurface.setScreenTransform(c);
    c.clearRect(0, 0, width, height);

    // Visual clipping follows the blue instrument ring, not the green radar ring.
    c.save();
    c.beginPath();
    c.arc(
      centerX,
      centerY,
      blueClipRadius,
      0,
      Math.PI * 2
    );
    c.clip();

    c.fillStyle = "#072f49";
    c.fillRect(0, 0, width, height);

    const blueDepth = c.createRadialGradient(
      center, center, 0,
      center, center, blueClipRadius
    );
    blueDepth.addColorStop(0, "rgba(14,32,81,.30)");
    blueDepth.addColorStop(.62, "rgba(11,218,248,.07)");
    blueDepth.addColorStop(1, "rgba(0,8,20,.18)");
    c.fillStyle = blueDepth;
    c.fillRect(0, 0, width, height);

    // Minimap rings are radar-only. Close-defense 1200/600 guides remain on
    // the main tactical view and are deliberately omitted here.
    c.strokeStyle = "rgba(68, 193, 232, .10)";
    c.lineWidth = 1;

    c.beginPath();
    c.moveTo(centerX - blueClipRadius, centerY);
    c.lineTo(centerX + blueClipRadius, centerY);
    c.moveTo(centerX, centerY - blueClipRadius);
    c.lineTo(centerX, centerY + blueClipRadius);
    c.stroke();

    // Minimap world scale:
    // outermost thick ring = detection radar range,
    // inner thick ring = engagement/guidance range.
    const minimapWorldRadius = snapshot.rangeLayers.detection;

    // A hostile exactly at detection range has its CENTER on the green ring.
    const worldToMinimap =
      detectionRingRadius / minimapWorldRadius;

    const project = (x, y) => {
      const dx = x - snapshot.ship.x;
      const dy = y - snapshot.ship.y;

      return {
        x: centerX + dx * worldToMinimap,
        y: centerY + dy * worldToMinimap,
      };
    };

    // Closest-threat warning uses the own ship as the fixed origin.
    // The minimap is divided into four 90-degree quadrants by the existing
    // horizontal/vertical center lines. The warning Track only decides WHICH
    // quadrant is active; the warning area's origin never moves to the missile.
    const warningTrack = snapshot.tracks.find(track => track.warning);
    if (warningTrack) {
      const dx = warningTrack.x - snapshot.ship.x;
      const dy = warningTrack.y - snapshot.ship.y;
      const pulse = 0.5 + 0.5 * Math.sin(snapshot.time * Math.PI * 3.2);

      let quadrantStartAngle;
      if (dx >= 0 && dy < 0) {
        // Upper-right
        quadrantStartAngle = -Math.PI / 2;
      } else if (dx < 0 && dy < 0) {
        // Upper-left
        quadrantStartAngle = Math.PI;
      } else if (dx < 0 && dy >= 0) {
        // Lower-left
        quadrantStartAngle = Math.PI / 2;
      } else {
        // Lower-right
        quadrantStartAngle = 0;
      }

      const quadrantEndAngle = quadrantStartAngle + Math.PI / 2;

      c.save();

      // Fill the whole ship-centered quadrant. Keep it translucent enough to
      // preserve Track/radar readability while making the threatened quarter
      // unmistakably different from the other three.
      c.fillStyle = `rgba(255, 70, 62, ${0.13 + pulse * 0.09})`;
      c.beginPath();
      c.moveTo(centerX, centerY);
      c.arc(
        center,
        center,
        blueClipRadius,
        quadrantStartAngle,
        quadrantEndAngle
      );
      c.closePath();
      c.fill();

      // Emphasize only the outer quarter-arc; the two straight boundaries are
      // already represented by the minimap's own horizontal/vertical axes.
      c.strokeStyle = `rgba(255, 146, 132, ${0.40 + pulse * 0.22})`;
      c.lineWidth = 1.6;
      c.beginPath();
      c.arc(
        center,
        center,
        blueClipRadius - 1.5,
        quadrantStartAngle,
        quadrantEndAngle
      );
      c.stroke();

      c.restore();
    }

    // Exactly two radar rings on the minimap: detection 5000 and
    // engagement/guidance 3000. Keep them below sweep and moving objects so
    // hostile/friendly dots remain fully readable when they overlap a ring.
    // The 1200/600 weapon envelopes are omitted.
    c.strokeStyle = "rgba(84, 242, 138, .94)";
    c.lineWidth = 1.5;

    c.beginPath();
    c.arc(
      centerX,
      centerY,
      detectionRingRadius,
      0,
      Math.PI * 2
    );
    c.stroke();

    c.beginPath();
    c.arc(

      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25); };
    const intense = () => RG.live && session.world.attackMissiles.some(m => m.alive);
    function sched() {
      while (nextT < ac.currentTime + 0.3) {
        const s = step % 16, b = Math.floor(step / 16) % 4, ch = CH[b], hot = intense();
        if (s === 0) ch.forEach(m => tone("sawtooth", hz(m - 12), nextT, SP * 16.5, 0.045, 700, 1.3));
        if (s % 2 === 0) tone("sawtooth", hz(BS[b] + (s % 8 === 6 ? 12 : 0)), nextT, SP * 1.8, 0.13, 360);
        if (hot) {
          tone("square", hz(ch[[0, 1, 2, 1][(s >> 1) % 4]] + 12), nextT, SP * 0.9, 0.035, 1900);
          if (s % 8 === 0) kick(nextT); if (s === 4 || s === 12) nz(nextT, 0.14, 0.12, 1800); if (s % 2 === 0) nz(nextT, 0.04, 0.05, 7000);
        }
        nextT += SP; step++;
      }
    }
    function start() {
      if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; ac = new A();
        master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
        noise = ac.createBuffer(1, ac.sampleRate / 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ac.currentTime + 0.1; setInterval(sched, 60); }
      if (ac.state === "suspended") ac.resume();
    }
    const tick = () => { if (ac) master.gain.setTargetAtTime(on && AudioSystem.enabled && !document.hidden ? 0.32 : 0, ac.currentTime, 0.25); };
    return { start, tick, toggle: () => { on = !on; } };
  })();
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, BGM.start, true));
  window.addEventListener("keydown", e => { if (kk(e) === "m" && !e.repeat) BGM.toggle(); });

  // ---- Coach: practice rounds are taught through real play. Each step completes from actual game state ----
  const coachEl = document.createElement("div"); coachEl.id = "rgCoach"; coachEl.hidden = true; gameRoot.appendChild(coachEl);
  const K = k => `<kbd>${k}</kbd>`;
  const COACH = {
    1: [["레이더 탐지", `Track이 뜨면 시작합니다,\n${K("W")} 로 배속할 수 있습니다.`, c => c.st >= 1],
        ["① 클릭 — 표적 예약", "Track을 <b>클릭</b>해 예약하세요.", c => c.st >= 2],
        ["② Q — 무장 등록", `${K("Q")} 로 무장을 <b>등록</b>하세요.`, c => c.st >= 3],
        ["③ A — 발사 승인", `${K("A")} 로 <b>발사를 승인</b>하세요.`, c => c.st >= 4],
        ["다음 표적을 미리", `요격탄이 나는 동안 다음 표적이 뜹니다,\nTTI가 짧은 표적을 <b>미리 예약</b>(클릭 → ${K("Q")})하세요.`, c => c.st >= 5 || c.next],
        ["좋습니다!", "다음 표적도 같은 순서로,\n한 발 쏘는 동안 다음 표적을 예약하세요.", null]],
    2: [["무장 선택", `${K("1")}~${K("4")} 로 무장을 바꿔 보세요,\n4번은 근접 RAM입니다.`, c => c.wSwap],
        ["연속 예약", "표적이 둘 이상이면 연달아 클릭하세요,\n예약 순서가 곧 교전 순서입니다.", c => c.multi],
        ["자동 승인", `${K("C")} 를 켜면 등록한 교전을 <b>자동 승인</b>합니다.`, c => c.cOn],
        ["근접 자동 방어", `${K("V")} 로 CIWS·자동 RAM을 켜고 끕니다,\n한 번 눌러 보세요.`, c => c.vTog],
        ["MP 관리", "<b>청록 링 = MP</b>, 발사마다 줄고 2초마다 회복됩니다,\n다음 표적용 MP를 남겨 두세요.", c => c.mpT >= 10],
        ["업그레이드 현황", `${K("TAB")} 으로 얻은 카드와 능력치를 확인하세요.`, c => c.tabSeen],
        ["훈련 종료", "도착 순서를 TTI로 예측해 미리 예약하세요,\n다음부터는 실전입니다.", null]],
  };
  function advanceCoach() {
    const c = RG.co, steps = COACH[RG.round];
    if (!c || c.finished || !steps || coachEl.hidden) return;
    if (c.idx >= steps.length - 1) { c.finished = true; coachEl.hidden = true; return; }
    c.idx++; c.shown = -1; c.stepT = 0;
  }
  function coachTick() {
    const on = !coachSkipped && RG.co && !RG.co.finished && RG.round <= TUTORIAL_ROUNDS && RG.live && !modal && tabEl.hidden;
    if (!on) { coachEl.hidden = true; return; }
    const w = session.world, c = RG.co;
    const st = w.scoreState.killCount > 0 ? 5 : (w.interceptors.length > 0 || w.pendingEngagements.some(p => p.fireAuthorized)) ? 4 : w.pendingEngagements.length > 0 ? 3 : w.reservationQueue.length > 0 ? 2 : w.tracks.some(t => t.visible) ? 1 : 0;
    c.st = Math.max(c.st, st);
    if (c.st >= 4 && w.reservationQueue.length + w.pendingEngagements.filter(p => !p.fireAuthorized).length >= 1) c.next = true;
    if (session.selectedWeaponId !== c.w0) c.wSwap = true;
    if (w.reservationQueue.length + w.pendingEngagements.length >= 2) c.multi = true;
    if (session.autoFireEnabled) c.cOn = true;
    if (session.closeDefenseAutoEnabled !== c.v0) c.vTog = true;
    if (RG.tabOpened) c.tabSeen = true;
    const steps = COACH[RG.round]; if (!steps) { coachEl.hidden = true; return; }
    c.stepT += 1 / 60;
    if (steps[c.idx] && steps[c.idx][2] && steps[c.idx][2](c)) { c.idx++; c.stepT = 0; }
    if (steps[c.idx - 1] && steps[c.idx] === undefined) c.idx = steps.length - 1;
    const cur = steps[Math.min(c.idx, steps.length - 1)];
    if (RG.round === 2 && c.idx === 4) c.mpT += 1 / 60;
    if (c.shown !== c.idx) {
      c.shown = c.idx;
      coachEl.innerHTML = `<div class="rg-coach-h"><i>훈련</i><span>${steps.map((_, i) => i < c.idx ? "●" : i === c.idx ? "◉" : "○").join(" ")}</span></div>
        <strong>${cur[0]}</strong><p>${lines(cur[1])}</p><small>${K("ENTER")} ${c.idx === steps.length - 1 ? "닫기" : "다음 안내"} · ✕ 안내 건너뛰기</small><button class="rg-x" type="button" aria-label="안내 건너뛰기">✕</button>`;
    }
    coachEl.hidden = false;
  }
  coachEl.addEventListener("click", e => { if (e.target.closest(".rg-x") && RG.co) skipCoach(); });
  (function fxLoop() {                                   // hide the v155 cursor rings while a card/result/TAB panel is open
    gameRoot.classList.toggle("rg-modal-open", !!modal || !tabEl.hidden);
    coachTick(); BGM.tick(); requestAnimationFrame(fxLoop);
  })();
  RG.missMulFor = (tg, dist) => { const c = RG.pkScope === "C"; let m = c ? RG.missMulC : RG.missMul;
    if (tg) { if (tg.baseSpeed >= ENEMY_SPEED_FAST - 0.5) m *= c ? RG.fastMulC : RG.fastMul; if (tg.sensorProfile === SensorProfile.LOW_ALTITUDE || tg.flightProfile === FlightProfile.SEA_SKIMMING) m *= c ? RG.lowMulC : RG.lowMul; }
    if (dist < SHORT_RANGE_DEFENSE_RADIUS) m *= c ? RG.nearMulC : RG.nearMul; return m; };
  RG.speedFor = o => (o && o.autoShortRange) ? RG.speedMulC : RG.speedMul;
  RG.regenMulFor = d => d.hp <= DEFENSE_RESOURCE_PROFILE.maxHp * 0.3 ? RG.crisisMul : 1;
  RG.tryRescue = d => { if (RG.round <= TUTORIAL_ROUNDS) { d.hp = Math.round(DEFENSE_RESOURCE_PROFILE.maxHp * 0.5); return true; } if (RG.rescueLeft > 0) { RG.rescueLeft--; d.hp = Math.max(1, Math.round(DEFENSE_RESOURCE_PROFILE.maxHp * RG.rescuePct / 100)); return true; } return false; };
  RG.maxHp = () => DEFENSE_RESOURCE_PROFILE.maxHp; RG.repairVal = () => RG.repair; RG.isSpike = isSpike; RG.genOrders = genOrders; RG.isSpike = isSpike; RG.pressure = pressure; RG.scoreState = () => session.world.scoreState; RG.startRound = startRound; RG.FAMILIES = FAMILIES; RG.resetRun = resetRun; RG.TUT_ROUNDS = TUTORIAL_ROUNDS;
  RG.session = session; RG.draw = drawOffers; RG.cards_ = CARDS;
  startRound();
  showGuide(["intro"], null, "훈련 시작");

  render(getSnapshot(session.world, session.stageSpec));
  requestAnimationFrame(frame);
