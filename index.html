    if (k === "enter" && RG.co && coachUI.visible() && !RG.co.finished) { e.preventDefault(); e.stopImmediatePropagation(); if (!e.repeat) advanceCoach(); }
  }, true);

  const rb = document.getElementById("restartBtn");               
  rb.title = uiText("upgrade.11997"); rb.textContent = uiText("upgrade.11997.2");
  document.addEventListener("click", e => { if (e.target.closest("#restartBtn")) { e.stopImmediatePropagation(); e.preventDefault(); fullReset(); } }, true);
  const tk = document.querySelector(".tap-key");                  
  tk.style.cursor = "pointer"; tk.title = uiText("control.12000");
  tk.addEventListener("click", () => { if (modal !== "tut") toggleTab(); });
  const BGM = (() => {
    let ac, master, noise, step = 0, nextT = 0, on = true;
    const SP = 60 / 92 / 4, CH = [[57,60,64],[53,57,60],[50,53,57],[52,56,59]], BS = [33,29,26,28], hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const tone = (type, f, t, dur, vol, lp, atk = 0.01) => { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = type; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = lp;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); };
    const nz = (t, dur, vol, hp) => { const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
      s.buffer = noise; fl.type = "highpass"; fl.frequency.value = hp; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur); };
    const kick = t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25); };
    const intense = () => RG.live && session.world.attackMissiles.some(m => m.alive);
    function sched() {
      while (nextT < ac.currentTime + 0.3) {
        const s = step % 16, b = Math.floor(step / 16) % 4, ch = CH[b], hot = intense();
        if (s === 0) ch.forEach(m => tone("sawtooth", hz(m - 12), nextT, SP * 16.5, 0.045, 700, 1.3));
        if (s % 2 === 0) tone("sawtooth", hz(BS[b] + (s % 8 === 6 ? 12 : 0)), nextT, SP * 1.8, 0.13, 360);
        if (hot) {
          tone("square", hz(ch[[0, 1, 2, 1][(s >> 1) % 4]] + 12), nextT, SP * 0.9, 0.035, 1900);
          if (s % 8 === 0) kick(nextT); if (s === 4 || s === 12) nz(nextT, 0.14, 0.12, 1800); if (s % 2 === 0) nz(nextT, 0.04, 0.05, 7000);
        }
        nextT += SP; step++;
      }
    }
    function start() {
      if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; ac = new A();
        master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
        noise = ac.createBuffer(1, ac.sampleRate / 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ac.currentTime + 0.1; setInterval(sched, 60); }
      if (ac.state === "suspended") ac.resume();
    }
    const tick = () => { if (ac) master.gain.setTargetAtTime(on && AudioSystem.enabled && !document.hidden ? 0.32 : 0, ac.currentTime, 0.25); };
    return { start, tick, toggle: () => { on = !on; } };
  })();
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, BGM.start, true));
  window.addEventListener("keydown", e => { if (kk(e) === "m" && !e.repeat) BGM.toggle(); });

  const coachEl = document.createElement("div"); coachEl.id = "rgCoach"; gameRoot.appendChild(coachEl); const coachUI = UI.info(coachEl);
  const K = k => `<kbd>${k}</kbd>`;
  const COACH = {
    1: [[uiText("coach.12045"), uiText("coach.12045.2", K("W")), c => c.st >= 1],
        [uiText("coach.12046"), uiText("coach.12046.2"), c => c.st >= 2],
        [uiText("coach.12047"), uiText("coach.12047.2", K("Q")), c => c.st >= 3],
        [uiText("coach.12048"), uiText("coach.12048.2", K("A")), c => c.st >= 4],
        [uiText("coach.12049"), uiText("coach.12049.2", K("Q")), c => c.st >= 5 || c.next],
        [uiText("coach.12050"), uiText("coach.12050.2"), null]],
    2: [[uiText("coach.12051"), uiText("coach.12051.2", K("1"), K("4")), c => c.wSwap],
        [uiText("coach.12052"), uiText("coach.12052.2"), c => c.multi],
        [uiText("coach.12053"), uiText("coach.12053.2", K("C")), c => c.cOn],
        [uiText("coach.12054"), uiText("coach.12054.2", K("V")), c => c.vTog],
        [uiText("coach.12055"), uiText("coach.12055.2"), c => c.mpT >= 10],
        [uiText("upgrade.11968"), uiText("coach.12056", K("TAB")), c => c.tabSeen],
        [uiText("coach.12057"), uiText("coach.12057.2"), null]],
  };
  let coachSkipped = false;
  function advanceCoach() {
    const c = RG.co, steps = COACH[RG.round];
    if (!c || c.finished || !steps || !coachUI.visible()) return;
    if (c.idx >= steps.length - 1) { c.finished = true; coachUI.hide(); return; }     
    c.idx++; c.shown = -1; c.stepT = 0;
  }
  function coachTick() {
    const on = !coachSkipped && RG.co && !RG.co.finished && RG.round <= TUTORIAL_ROUNDS && RG.live && !modal && !tabOpen;
    if (!on) { coachUI.hide(); return; }
    const w = session.world, c = RG.co;
    const st = w.scoreState.killCount > 0 ? 5 : (w.interceptors.length > 0 || w.pendingEngagements.some(p => p.fireAuthorized)) ? 4 : w.pendingEngagements.length > 0 ? 3 : w.reservationQueue.length > 0 ? 2 : w.tracks.some(t => t.visible) ? 1 : 0;
    c.st = Math.max(c.st, st);
    if (c.st >= 4 && w.reservationQueue.length + w.pendingEngagements.filter(p => !p.fireAuthorized).length >= 1) c.next = true;
    if (session.selectedWeaponId !== c.w0) c.wSwap = true;
    if (w.reservationQueue.length + w.pendingEngagements.length >= 2) c.multi = true;
    if (session.autoFireEnabled) c.cOn = true;
    if (session.closeDefenseAutoEnabled !== c.v0) c.vTog = true;
    if (RG.tabOpened) c.tabSeen = true;
    const steps = COACH[RG.round]; if (!steps) { coachUI.hide(); return; }
    c.stepT += 1 / 60;
    if (steps[c.idx] && steps[c.idx][2] && steps[c.idx][2](c)) { c.idx++; c.stepT = 0; }
    if (steps[c.idx - 1] && steps[c.idx] === undefined) c.idx = steps.length - 1;
    const cur = steps[Math.min(c.idx, steps.length - 1)];
    if (RG.round === 2 && c.idx === 4) c.mpT += 1 / 60;
    if (!coachUI.visible()) c.shown = -1;
    if (c.shown !== c.idx) {
      c.shown = c.idx;
      coachUI.show(cur[0], `${lines(cur[1])}<span class="rg-coach-hint">${K("ENTER")} ${c.idx === steps.length - 1 ? uiText("guide.11942") : uiText("coach.12087")}</span>`, steps.map((_, i) => i < c.idx ? "●" : i === c.idx ? "◉" : "○").join(" "));
    }
  }
  coachEl.addEventListener("click", e => { if (e.target.closest(".ui-x")) { coachSkipped = true; coachUI.hide(); } });   
  (function fxLoop() {                                   
    gameRoot.classList.toggle("rg-modal-open", !!modal || tabOpen);
    coachTick(); BGM.tick(); requestAnimationFrame(fxLoop);
  })();
  RG.missMulFor = (tg, dist) => { const c = RG.pkScope === "C"; let m = c ? RG.missMulC : RG.missMul;
    if (tg) { if (tg.baseSpeed >= ENEMY_SPEED_FAST - 0.5) m *= c ? RG.fastMulC : RG.fastMul; if (tg.sensorProfile === SensorProfile.LOW_ALTITUDE || tg.flightProfile === FlightProfile.SEA_SKIMMING) m *= c ? RG.lowMulC : RG.lowMul; }
    if (dist < SHORT_RANGE_DEFENSE_RADIUS) m *= c ? RG.nearMulC : RG.nearMul; return m; };
  RG.speedFor = o => (o && o.autoShortRange) ? RG.speedMulC : RG.speedMul;
  RG.regenMulFor = d => d.hp <= DEFENSE_RESOURCE_PROFILE.maxHp * 0.3 ? RG.crisisMul : 1;
  RG.tryRescue = d => { if (RG.round <= TUTORIAL_ROUNDS) { d.hp = Math.round(DEFENSE_RESOURCE_PROFILE.maxHp * 0.5); return true; } if (RG.rescueLeft > 0) { RG.rescueLeft--; d.hp = Math.max(1, Math.round(DEFENSE_RESOURCE_PROFILE.maxHp * RG.rescuePct / 100)); return true; } return false; };
  startRound();
  showGuide(["intro"], null, uiText("display.12104"));

  render(getSnapshot(session.world, session.stageSpec));
  requestAnimationFrame(frame);
})();
</script>
