        (EX_INTERCEPTOR_BASE_SPEED * missileMotionMultiplier) /
        ((EX_INTERCEPTOR_BASE_SPEED + publishedTargetSpeed) * missileMotionMultiplier);
      const aimRange = clamp(
        kinematicMeetingRadius + entry.aimBias,
        2400,
        EX_RANGE_PROFILE.engagement - 100
      );
      const guidancePoint =
        world.ship.position.add(
          publishedDirection.mul(aimRange)
        );
      const guidanceDirection =
        guidancePoint.sub(launchPosition).normalized();

      const interceptor = new Missile({
        entityId:
          "INT-" + String(session.idCounter++).padStart(4, "0"),
        role: MissileRole.INTERCEPTOR,
        position: launchPosition,
        speed: EX_INTERCEPTOR_BASE_SPEED,
        hitRadius: 7,
        displayRadius: 3,
        targetEntityId: target.entityId,
        channelId: null,
        guidancePoint,
        guidanceDirection,
        launchGuidancePoint: guidancePoint.clone(),
        launchPlatformEntityId: world.ship.entityId,
        trailPoints: [
          world.ship.position.clone(),
          launchPosition.clone(),
        ],
        guidanceMode: GuidanceMode.SHIP_SUPPORTED,
        guidanceState: GuidanceState.MIDCOURSE,
        hasReceivedTrackGuidance: false,
        lastGuidanceUpdateTime: world.time,
        baseSpeed: EX_INTERCEPTOR_BASE_SPEED,
        currentSpeed: EX_INTERCEPTOR_BASE_SPEED,
        terminalSpeed:
          EX_INTERCEPTOR_BASE_SPEED *
          INTERCEPTOR_TERMINAL_SPEED_MULTIPLIER,
        terminalAcceleration:
          EX_INTERCEPTOR_BASE_SPEED *
          INTERCEPTOR_TERMINAL_ACCELERATION_MULTIPLIER_PER_SECOND,
        terminalHoldDirection:
          session.idCounter % 2 === 0 ? 1 : -1,
      });

      interceptor.exAuto = true;
      interceptor.exLaunchOrder = ++world.exAutoLaunchSequence;
      interceptor.exWave = entry.wave;
      interceptor.exBurst = entry.burst;
      interceptor.exPlannedInterceptRadius = aimRange;

      world.interceptors.push(interceptor);
      world.exAutoLaunchedCount += 1;
      world.exAutoCurrentWave = Math.max(
        world.exAutoCurrentWave,
        entry.wave
      );
      entry.launched = true;
      entry.actualLaunchTime = world.time;
      entry.actualLaunchRange = distance(
        track.displayPosition,
        world.ship.position
      );

      world.events.push({
        type: "MissileLaunched",
        position: interceptor.position.clone(),
        channelId: null,
      });
      return true;
    },

    update(session) {
      const world = session.world;
      this.registerVisibleTracks(session);

      const trackBySourceId = new Map(
        world.tracks
          .filter(track => track.visible)
          .map(track => [track.sourceEntityId, track])
      );
      const attackById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );

      for (let index = 0; index < world.exAutoLaunchQueue.length; ) {
        const entry = world.exAutoLaunchQueue[index];
        if (entry.launched) {
          world.exAutoLaunchQueue.splice(index, 1);
          continue;
        }

        const track = trackBySourceId.get(entry.targetEntityId);
        const target = attackById.get(entry.targetEntityId);
        if (!track || !target) {
          index += 1;
          continue;
        }
        if (world.time + 1e-9 < entry.earliestLaunchTime) {
          index += 1;
          continue;
        }

        // Auto-defense decisions use the published Track position, never a
        // hidden pre-detection Simulation Truth position.
        const publishedRange = distance(
          track.displayPosition,
          world.ship.position
        );
        if (publishedRange > entry.launchRange + 1e-9) {
          index += 1;
          continue;
        }

        // Reaction-delay ranges were chosen so entries normally cross their
        // individual launch radius inside the allowed window. If a sweep step
        // skips a little below the chosen radius, remain valid down to the
        // profile's minimum instead of bunching all launches at one timestamp.
        if (publishedRange < entry.launchRangeMin - 150) {
          entry.launchRange = Math.max(
            entry.launchRangeMin - 150,
            publishedRange
          );
        }

        if (this.launchInterceptor(session, entry, track)) {
          world.exAutoLaunchQueue.splice(index, 1);
          continue;
        }
        index += 1;
      }
    },
  };

  const EXGuidanceSystem = {
    occupiedChannelIds(world) {
      return new Set(
        world.interceptors
          .filter(
            interceptor =>
              interceptor.alive &&
              interceptor.channelId
          )
          .map(interceptor => interceptor.channelId)
      );
    },

    freeChannelIds(world) {
      const occupied = this.occupiedChannelIds(world);
      const free = [];
      for (let n = 1; n <= EX_GENERAL_CHANNEL_COUNT; n++) {
        const id = "CH-" + String(n).padStart(3, "0");
        if (!occupied.has(id)) free.push(id);
      }
      return free;
    },

    update(world) {
      if (world.time + 1e-9 < world.exNextGuidanceUpdate) {
        return;
      }

      world.exNextGuidanceUpdate =
        world.time + GUIDANCE_UPDATE_INTERVAL;

      const attackById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );

      // Existing LOCK ON channels receive idealized truth-position updates
      // after launch. LOW_ALTITUDE launch itself is NOT privileged: v61 holds
      // its auto-fire entry until SensorSystem has actually published the Track.
      for (const interceptor of world.interceptors) {
        if (
          !interceptor.alive ||
          !interceptor.exAuto ||
          !interceptor.channelId ||
          interceptor.guidanceState === GuidanceState.TERMINAL_LOCK
        ) {
          continue;
        }

        const target = attackById.get(
          interceptor.targetEntityId
        );
        if (!target) continue;

        interceptor.guidancePoint =
          target.position.clone();
        interceptor.guidanceDirection =
          target.position
            .sub(interceptor.position)
            .normalized();
        interceptor.guidanceState =
          GuidanceState.TRACK_GUIDANCE;
        interceptor.hasReceivedTrackGuidance = true;
        interceptor.lastGuidanceUpdateTime = world.time;
      }

      // Airborne FLY missiles do not consume a normal CH. Once the target is
      // inside the EX 6000 engagement envelope, available channels are assigned
      // by launch order. There is deliberately no FLY-count limit.
      const candidates = world.interceptors
        .filter(
          interceptor =>
            interceptor.alive &&
            interceptor.exAuto &&
            !interceptor.channelId &&
            !interceptor.finalChannelId &&
            !interceptor.finalChannelRequested &&
            interceptor.guidanceState !== GuidanceState.TERMINAL_LOCK
        )
        .map(interceptor => ({
          interceptor,
          target: attackById.get(
            interceptor.targetEntityId
          ),
        }))
        .filter(({ interceptor, target }) => {
          if (!target) return false;
          return (
            distance(
              target.position,
              world.ship.position
            ) <= EX_RANGE_PROFILE.engagement &&
            distance(
              interceptor.position,
              world.ship.position
            ) <= EX_RANGE_PROFILE.engagement
          );
        })
        .sort(
          (left, right) =>
            (left.interceptor.exLaunchOrder ?? Infinity) -
            (right.interceptor.exLaunchOrder ?? Infinity)
        );

      const freeIds = this.freeChannelIds(world);
      while (candidates.length && freeIds.length) {
        const { interceptor, target } =
          candidates.shift();

        interceptor.channelId = freeIds.shift();
        interceptor.guidancePoint =
          target.position.clone();
        interceptor.guidanceDirection =
          target.position
            .sub(interceptor.position)
            .normalized();
        interceptor.guidanceState =
          GuidanceState.TRACK_GUIDANCE;
        interceptor.hasReceivedTrackGuidance = true;
        interceptor.lastGuidanceUpdateTime = world.time;

        world.events.push({
          type: "NormalGuidanceLock",
          entityId: interceptor.entityId,
          channelId: interceptor.channelId,
          targetEntityId: interceptor.targetEntityId,
        });
      }

      world.lastGuidanceUpdate = world.time;
      world.nextGuidanceUpdate =
        world.exNextGuidanceUpdate;
    },
  };

  const EXEngagementMetricsSystem = {
    update(world, dt) {
      const metrics = world.exMetrics;
      if (!metrics) return;

      const activeGeneral = world.interceptors.filter(
        interceptor => interceptor.alive && interceptor.channelId
      ).length;
      const activeFinal = world.interceptors.filter(
        interceptor => interceptor.alive && interceptor.finalChannelId
      ).length;

      metrics.peakGeneralChannels = Math.max(
        metrics.peakGeneralChannels,
        activeGeneral
      );
      metrics.peakFinalChannels = Math.max(
        metrics.peakFinalChannels,
        activeFinal
      );
      metrics.generalChannelSampleSum += activeGeneral;
      metrics.finalChannelSampleSum += activeFinal;
      metrics.sampleCount += 1;
      if (activeGeneral >= EX_GENERAL_CHANNEL_COUNT * 0.8) {
        metrics.highLoadDuration += dt;
      }

      for (const track of world.tracks) {
        if (!track.visible || !track.trackId) continue;
        if (metrics.seenTrackIds.has(track.trackId)) continue;
        metrics.seenTrackIds.add(track.trackId);
        metrics.detectionTimes.push(track.firstDetectionTime ?? world.time);
      }

      if (world.exAutoInterceptedCount > metrics.lastInterceptedCount) {
        const delta =
          world.exAutoInterceptedCount - metrics.lastInterceptedCount;
        for (let n = 0; n < delta; n++) {
          metrics.interceptTimes.push(world.time);
        }
        metrics.lastInterceptedCount = world.exAutoInterceptedCount;
      }

      const oneSecondAgo = world.time - 1;
      while (
        metrics.detectionTimes.length &&
        metrics.detectionTimes[0] < oneSecondAgo
      ) {
        metrics.detectionTimes.shift();
      }
      while (
        metrics.interceptTimes.length &&
        metrics.interceptTimes[0] < oneSecondAgo
      ) {
        metrics.interceptTimes.shift();
      }
      metrics.currentNewTracksPerSecond = metrics.detectionTimes.length;
      metrics.currentInterceptsPerSecond = metrics.interceptTimes.length;
    },
  };

  const EXMaintenanceSystem = {
    update(world) {
      if (world.time + 1e-9 < world.exNextCleanupTime) {
        return;
      }
      world.exNextCleanupTime = world.time + 2;

      // Remove dead historical objects from the hot simulation arrays.
      // Counters preserve total-test statistics.
      world.attackMissiles =
        world.attackMissiles.filter(missile => missile.alive);
      world.interceptors =
        world.interceptors.filter(missile => missile.alive);

      const liveAttackIds = new Set(
        world.attackMissiles.map(missile => missile.entityId)
      );
      world.tracks = world.tracks.filter(
        track => liveAttackIds.has(track.sourceEntityId)
      );
      world.finalChannelQueue =
        world.finalChannelQueue.filter(entityId =>
          world.interceptors.some(
            missile =>
              missile.entityId === entityId &&
              missile.alive
          )
        );
    },
  };

  const GuidanceSystem = {
    update(world, refreshedTrackIds=new Set()) {
      let guidanceWasUpdated = false;

      for (const interceptor of world.interceptors) {
        if (
          !interceptor.alive ||
          interceptor.guidanceSupportSuspended ||
          (interceptor.guidanceState === GuidanceState.TERMINAL_LOCK && !interceptor.autoShortRange)
        ) {
          continue;
        }
        const target = world.attackMissiles.find(
          missile =>
            missile.entityId === interceptor.targetEntityId &&
            missile.alive
        );
        if (!target) continue;
        if (!world.exMode && interceptor.channelId &&
            world.destroyedNormalChannelIds.has(interceptor.channelId)) {
          EmergencyReassignmentSystem.enqueue(world,interceptor);
          continue;
        }
        if (!world.exMode &&
            interceptor.guidanceMode === GuidanceMode.SHIP_SUPPORTED &&
            !interceptor.channelId && !interceptor.finalChannelId) continue;
        if (interceptor.autoShortRange) {
          // The local close-in fire-control channel owns this steering command.
          // Automatic missiles hold the normal CH through terminal contact.
          interceptor.guidancePoint = target.position.clone();
          interceptor.guidanceDirection = target.position.sub(interceptor.position).normalized();
          interceptor.guidanceState =
            distance(interceptor.position, target.position) <= FINAL_GUIDANCE_ENTRY_RADIUS
              ? GuidanceState.TERMINAL_LOCK : GuidanceState.TRACK_GUIDANCE;
          interceptor.collisionArmed =
            interceptor.guidanceState === GuidanceState.TERMINAL_LOCK;
          interceptor.hasReceivedTrackGuidance = true;
          interceptor.lastGuidanceUpdateTime = world.time;
          continue;
        }

        const targetRangeFromShip =
          distance(target.position, world.ship.position);
        const interceptorRangeFromShip =
          distance(interceptor.position, world.ship.position);

        // Range loss is immediate. New steering, however, is only accepted
        // when the rotating radar has just refreshed this target's Track.
        if (
          (interceptor.guidanceMode === GuidanceMode.SHIP_SUPPORTED ||
            interceptor.weaponId === WEAPON_IDS.TWO) &&
          (
            targetRangeFromShip > trackingRadarRadiusFor(world) ||
            interceptorRangeFromShip > trackingRadarRadiusFor(world)
          )
        ) {
          interceptor.guidanceState = GuidanceState.MIDCOURSE;
          continue;
        }

        const track = world.tracks.find(
          item =>
            item.sourceEntityId === target.entityId &&
            item.visible
        );
        if (
          !track ||
          !refreshedTrackIds.has(track.trackId)
        ) {
          continue;
        }

        // Preserve the exact position where a scan-driven steering
        // command changes the flight vector.
        appendInterceptorTrailPoint(
          interceptor,
          interceptor.position,
          true
        );

        interceptor.guidancePoint =
          track.displayPosition.clone();
        interceptor.guidanceDirection =
          interceptor.guidancePoint
            .sub(interceptor.position)
            .normalized();
        interceptor.guidanceState =
          GuidanceState.TRACK_GUIDANCE;
        interceptor.hasReceivedTrackGuidance = true;
        interceptor.lastGuidanceUpdateTime =
          track.lastUpdateTime ?? world.time;
        guidanceWasUpdated = true;
      }

      if (guidanceWasUpdated) {
        world.lastGuidanceUpdate = world.time;
      }
      world.nextGuidanceUpdate = world.nextSensorUpdate;
    }
  };


  const TrackUpdateSystem = {
    update(world) {
      const sourceById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );
      for (const track of world.tracks) {
        const source = sourceById.get(track.sourceEntityId);

        if (!source) {
          track.visible = false;
          track.selected = false;
          world.reservationQueue = world.reservationQueue.filter(
            p => p.trackId !== track.trackId
          );
          world.pendingEngagements = world.pendingEngagements.filter(
            p => p.trackId !== track.trackId
          );
          world.sequentialLaunchQueue = world.sequentialLaunchQueue.filter(
            p => p.trackId !== track.trackId
          );
          if (world.selectedTrackId === track.trackId) {
            world.selectedTrackId = null;
          }
          continue;
        }

        // Position publication is handled only by SensorSystem pulses.
      }
    }
  };

  const CollisionSystem = {
    update(world) {
      const attackById = new Map(
        world.attackMissiles
          .filter(attack => attack.alive)
          .map(attack => [attack.entityId, attack])
      );

      for (const i of world.interceptors) {
        if (
          !i.alive ||
          !i.collisionArmed ||
          i.guidanceState !== GuidanceState.TERMINAL_LOCK
        ) continue;

        const a = attackById.get(i.targetEntityId);
        if (!a || !a.alive) continue;

        if (i.guidanceMode === GuidanceMode.SHIP_SUPPORTED) {
          const targetInsideTrackingRadar =
            distance(a.position, world.ship.position) <=
            trackingRadarRadiusFor(world);
          const interceptorInsideTrackingRadar =
            distance(i.position, world.ship.position) <=
            trackingRadarRadiusFor(world);
          const ownsAutomaticChannel = i.autoShortRange && i.channelId &&
            world.ciwsChannelClaims.get(i.channelId) === SHORT_RANGE_MISSILE_OWNER;
          if (
            !(i.autoShortRange ? ownsAutomaticChannel : !!i.finalChannelId) ||
            !targetInsideTrackingRadar ||
            !interceptorInsideTrackingRadar
          ) continue;
        }

        const currentNose = interceptorNosePosition(
          i,
          i.guidanceDirection
        );
        const previousNose =
          i.previousNosePosition || currentNose;

        if (
          segmentPointDistance(
            previousNose,
            currentNose,
            a.position
          ) <= INTERCEPTOR_NOSE_HIT_RADIUS + a.hitRadius
        ) {
          // EX preserves its deterministic guaranteed hit and all legacy
          // auto-defense timings. Only player weapons in normal stages roll Pk.
          if (!world.exMode && i.weaponId) {
            const result = PkSystem.decide(world, i, a);
            if (!result.success) {
              selfDestructInterceptor(
                world, i, i.position, "PK_FAILURE", "InterceptorPkFailure",
                {
                  targetEntityId: a.entityId,
                  finalChannelId: i.finalChannelId,
                  probability: result.probability,
                  roll: result.roll,
                }
              );
              continue;
            }
          }
          i.alive = false;
          a.alive = false;
          world.events.push({
            type: "InterceptorHit",
            position: a.position.clone(),
            finalChannelId: i.finalChannelId,
          });
          world.effects.push({
            type: "burst",
            position: a.position.clone(),
            age: 0,
            life: .65,
          });
        }
      }

      for (const a of world.attackMissiles) {
        if (!a.alive) continue;
        if (
          distance(a.position, world.ship.position) <=
          a.hitRadius + world.ship.radius
        ) {
          a.alive = false;
          if (world.exMode) {
            world.events.push({type:"ShipHit",position:world.ship.position.clone()});
            world.effects.push({
              type:"shipHit",position:world.ship.position.clone(),age:0,life:1.0
            });
          } else {
            // No special missiles are spawned by this D-08 patch.
            const result = applyEnemyShipImpact(world, getEnemyDamage("NORMAL"));
            if (result === "HULL") {
              world.effects.push({
                type:"shipHit",position:world.ship.position.clone(),age:0,life:1.0
              });
            }
          }
        }
      }
    }
  };

  const BattleEndSystem = {
    update(world) {
      if (world.battleState !== BattleState.RUNNING) return;
      if (world.exMode
          ? world.events.some(e => e.type === "ShipHit")
          : world.defenseState.hp <= 0) {
        world.battleState = BattleState.FAILURE;
        return;
      }
      const anyAttackAlive = world.attackMissiles.some(m => m.alive);
      const allThreatsSpawned =
        world.spawnedAttackCount >= world.expectedAttackCount &&
        world.spawnQueue.length === 0;

      if (
        allThreatsSpawned &&
        !anyAttackAlive &&
        (!world.exMode || world.events.some(e => e.type === "InterceptorHit"))
      ) {
        world.battleState = BattleState.SUCCESS;
      }
    }
  };

  function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }


  // -------- Tactical camera / coordinate adapter --------
  function cameraPlotViewport() {
    // TACTICAL_CHART is initialized before the first render/input callback.
    // The camera therefore treats only this inner rectangle as its viewport.
    const left = TACTICAL_CHART.coordinateGutterWidth;
    const top = TACTICAL_CHART.coordinateHeaderHeight;

    return {
      left,
      top,
      right: W,
      bottom: H,
      width: W - left,
      height: H - top,
      centerX: (left + W) * 0.5,
      centerY: (top + H) * 0.5,
    };
  }

  function cameraOffset() {
    const viewport = cameraPlotViewport();
    return {
      x:
        viewport.centerX -
        cameraCenter.x * cameraZoom,
      y:
        viewport.centerY -
        cameraCenter.y * cameraZoom,
    };
  }

  function beginWorldTransform() {
    const o = cameraOffset();
    tacticalSurface.setWorldTransform(
      ctx,
      cameraZoom,
      o
    );
  }

  function screenToWorld(p) {
    const o = cameraOffset();
    return new Vec2(
      (p.x - o.x) / cameraZoom,
      (p.y - o.y) / cameraZoom
    );
  }

  function worldToScreen(p) {
    const o = cameraOffset();
    return new Vec2(
      p.x * cameraZoom + o.x,
      p.y * cameraZoom + o.y
    );
  }

  function visibleWorldBounds() {
    const viewport = cameraPlotViewport();
    const halfW =
      viewport.width / (2 * cameraZoom);
    const halfH =
      viewport.height / (2 * cameraZoom);

    return {
      left: cameraCenter.x - halfW,
      right: cameraCenter.x + halfW,
      top: cameraCenter.y - halfH,
      bottom: cameraCenter.y + halfH,
    };
  }

      if (trackRange > warningRadiusFor(world)) continue;

      if (
        trackRange < bestRange - 1e-9 ||
        (
          Math.abs(trackRange - bestRange) <= 1e-9 &&
          (!best || track.trackId.localeCompare(best.track.trackId) < 0)
        )
      ) {
        best = { track, range: trackRange };
        bestRange = trackRange;
      }
    }

    return best;
  }

  const AudioSystem = {
    enabled: true,
    ctx: null,
    decodedBuffers: new Map(),
    decodePromises: new Map(),
    foregroundBus: null,
    warningBus: null,
    radarBus: null,
    radarBackgroundFilter: null,
    missileWarningSource: null,
    missileWarningRequested: false,

    ensure() {
      if (!this.enabled) return null;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!this.ctx) {
        this.ctx = new AudioCtx();

        // Three buses: warning is the sidechain/key signal, combat is ducked
        // moderately, and routine radar feedback is ducked strongly.
        this.foregroundBus = this.ctx.createGain();
        this.foregroundBus.gain.value = 1.0;
        this.foregroundBus.connect(this.ctx.destination);

        this.warningBus = this.ctx.createGain();
        this.warningBus.gain.value = 1.0;
        this.warningBus.connect(this.ctx.destination);

        this.radarBus = this.ctx.createGain();
        this.radarBus.gain.value = 1.0;
        this.radarBus.connect(this.ctx.destination);

        // Remove the sharp upper harmonics that made the periodic radar blip
        // resemble an alert tone. The original asset remains unchanged.
        this.radarBackgroundFilter = this.ctx.createBiquadFilter();
        this.radarBackgroundFilter.type = "lowpass";
        this.radarBackgroundFilter.frequency.value = RADAR_SCAN_LOWPASS_HZ;
        this.radarBackgroundFilter.Q.value = 0.55;
        this.radarBackgroundFilter.connect(this.radarBus);

        this.preloadSelectedSfx();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    },

    tone(startHz, endHz, duration, type="sine", volume=0.05, delay=0) {
      const ac = this.ensure();
      if (!ac) return;
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(1, startHz), t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, endHz), t0 + duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(this.foregroundBus || ac.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    },

    dataUrlToArrayBuffer(dataUrl) {
      const comma = dataUrl.indexOf(",");
      const binary = atob(dataUrl.slice(comma + 1));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    },

    async loadSelectedSfx(name) {
      if (this.decodedBuffers.has(name)) {
        return this.decodedBuffers.get(name);
      }
      if (this.decodePromises.has(name)) {
        return this.decodePromises.get(name);
      }

      const ac = this.ensure();
      const dataUrl = SELECTED_SFX_DATA[name];
      if (!ac || !dataUrl) return null;

      const promise = ac.decodeAudioData(
        this.dataUrlToArrayBuffer(dataUrl).slice(0)
      ).then(buffer => {
        this.decodedBuffers.set(name, buffer);
        this.decodePromises.delete(name);
        return buffer;
      }).catch(() => {
        this.decodePromises.delete(name);
        return null;
      });

      this.decodePromises.set(name, promise);
      return promise;
    },

    preloadSelectedSfx() {
      for (const name of Object.keys(SELECTED_SFX_DATA)) {
        this.loadSelectedSfx(name);
      }
    },

    playSelectedSfx(name, gainScale=1.0) {
      if (!this.enabled) return;
      const ac = this.ensure();
      if (!ac) return;

      const play = buffer => {
        if (!buffer || !this.enabled) return;
        const source = ac.createBufferSource();
        const gain = ac.createGain();
        source.buffer = buffer;
        gain.gain.value = SELECTED_SFX_MASTER_GAIN * gainScale;
        source.connect(gain);
        gain.connect(this.foregroundBus || ac.destination);
        source.start();
      };

      const buffer = this.decodedBuffers.get(name);
      if (buffer) {
        play(buffer);
      } else {
        this.loadSelectedSfx(name).then(play);
      }
    },

    playRadarBackgroundSfx() {
      if (!this.enabled) return;
      const ac = this.ensure();
      if (!ac) return;

      const play = buffer => {
        if (!buffer || !this.enabled) return;
        const source = ac.createBufferSource();
        const gain = ac.createGain();
        source.buffer = buffer;
        gain.gain.value = SELECTED_SFX_MASTER_GAIN * RADAR_SCAN_GAIN_SCALE;
        source.connect(gain);
        gain.connect(this.radarBackgroundFilter || this.radarBus || ac.destination);
        source.start();
      };

      const buffer = this.decodedBuffers.get("RADAR_SCAN_UPDATE");
      if (buffer) {
        play(buffer);
      } else {
        this.loadSelectedSfx("RADAR_SCAN_UPDATE").then(play);
      }
    },

    launch() {
      this.tone(520, 95, 0.26, "sawtooth", 0.035);
      this.tone(920, 260, 0.13, "triangle", 0.025, 0.02);
    },

    interceptSuccess() {
      // New buffer source per hit: overlapping successful intercepts remain
      // audible instead of cutting the previous success tone.
      this.playSelectedSfx("INTERCEPT_SUCCESS");
    },

    interceptFail() {
      this.playSelectedSfx("INTERCEPT_FAIL");
    },

    radarScanUpdate() {
      this.playRadarBackgroundSfx();
    },

    shipHit() {
      this.tone(95, 28, 0.62, "sawtooth", 0.07);
      this.tone(58, 24, 0.75, "square", 0.035, 0.05);
    },

    setWarningDucking(active) {
      const ac = this.ctx;
      if (!ac) return;

      const now = ac.currentTime;
      const duration = active
        ? WARNING_DUCK_ATTACK_SECONDS
        : WARNING_DUCK_RELEASE_SECONDS;
      const combatTarget = active ? WARNING_DUCK_COMBAT_GAIN : 1.0;
      const radarTarget = active ? WARNING_DUCK_RADAR_GAIN : 1.0;

      const ramp = (param, target) => {
        if (!param) return;
        param.cancelScheduledValues(now);
        param.setValueAtTime(Math.max(0.0001, param.value), now);
        param.linearRampToValueAtTime(target, now + duration);
      };

      ramp(this.foregroundBus?.gain, combatTarget);
      ramp(this.radarBus?.gain, radarTarget);
    },

    startMissileWarning() {
      if (!this.enabled || this.missileWarningSource) return;
      this.missileWarningRequested = true;
      const ac = this.ensure();
      if (!ac) return;
      this.setWarningDucking(true);

      const start = buffer => {
        if (
          !buffer ||
          !this.enabled ||
          !this.missileWarningRequested ||
          this.missileWarningSource
        ) {
          return;
        }
        const source = ac.createBufferSource();
        const gain = ac.createGain();
        source.buffer = buffer;
        source.loop = true;
        gain.gain.value = SELECTED_SFX_MASTER_GAIN;
        source.connect(gain);
        gain.connect(this.warningBus || ac.destination);
        source.start();
        this.missileWarningSource = source;
        source.onended = () => {
          if (this.missileWarningSource === source) {
            this.missileWarningSource = null;
          }
        };
      };

      const buffer = this.decodedBuffers.get("MISSILE_APPROACH_WARNING");
      if (buffer) {
        start(buffer);
      } else {
        this.loadSelectedSfx("MISSILE_APPROACH_WARNING").then(start);
      }
    },

    stopMissileWarning() {
      this.missileWarningRequested = false;
      this.setWarningDucking(false);
      if (!this.missileWarningSource) return;
      try {
        this.missileWarningSource.stop();
      } catch (_) {
        // Already stopped.
      }
      this.missileWarningSource = null;
    },

    syncMissileApproachWarning(world, isPaused=false) {
      if (
        !this.enabled ||
        isPaused ||
        world.battleState !== BattleState.RUNNING
      ) {
        this.stopMissileWarning();
        return;
      }

      if (closestVisibleWarningTrack(world)) {
        this.startMissileWarning();
      } else {
        this.stopMissileWarning();
      }
    },

    process(events) {
      if (!this.enabled) return;
      for (const event of events) {
        if (event.type === "MissileLaunched") this.launch();
        if (event.type === "InterceptorHit") this.interceptSuccess();
        if (
          event.type === "InterceptorSelfDestruct" ||
          event.type === "InterceptorPkFailure"
        ) this.interceptFail();
        if (event.type === "RadarScanUpdate") this.radarScanUpdate();
        if (event.type === "ShipHit") this.shipHit();
      }
    },

    toggle() {
      this.enabled = !this.enabled;
      if (this.enabled) {
        this.ensure();
      } else {
        this.stopMissileWarning();
      }
    }
  };

  // -------- Commands --------
  class GameSession {
    constructor(stageSpec) {
      this.stageSpec = stageSpec;
      this.world = stageSpec.createWorld();
      configureDefenseState(this.world,stageSpec);
      this.world.pkStageSeed = stageSpec.stageSeed;
      this.idCounter = 1;
      this.selectedWeaponId = WEAPON_IDS.ONE;
      this.fireCooldownSeconds = 0.5;
      this.fireCooldownRemaining = 0;
      this.shortFireCooldownSeconds = SHORT_RANGE_SHARED_LAUNCH_INTERVAL;
      this.shortFireCooldownRemaining = 0;
      // C automates manual A launch approval only; never Q registration.
      this.autoFireEnabled = false;
      this.closeDefenseAutoEnabled = true;
      this.combatMpCycleTickCount = 0;
      this.isCombatMpCycleTick = false;
      this.mpRetryWaiting = {ciws:null, ram:null, manual:null};
      this.timeScaleIndex = 0;
      this.applyTimeScaleMode();
      this.isPaused = false;
      SensorSystem.update(this.world);
    }

    setStage(stageSpec) {
      this.stageSpec = stageSpec;
      this.world = stageSpec.createWorld();
      configureDefenseState(this.world,stageSpec);
      this.world.pkStageSeed = stageSpec.stageSeed;
      this.applyTimeScaleMode();
      this.idCounter = 1;
      this.selectedWeaponId = WEAPON_IDS.ONE;
      this.fireCooldownRemaining = 0;
      this.shortFireCooldownRemaining = 0;
      this.combatMpCycleTickCount = 0;
      this.isCombatMpCycleTick = false;
      this.mpRetryWaiting = {ciws:null, ram:null, manual:null};
      this.isPaused = false;
      SensorSystem.update(this.world);
    }

    restart() {
      this.world = this.stageSpec.createWorld();
      configureDefenseState(this.world,this.stageSpec);
      this.world.pkStageSeed = this.stageSpec.stageSeed;
      this.applyTimeScaleMode();
      this.idCounter = 1;
      this.selectedWeaponId = WEAPON_IDS.ONE;
      this.fireCooldownRemaining = 0;
      this.shortFireCooldownRemaining = 0;
      this.combatMpCycleTickCount = 0;
      this.isCombatMpCycleTick = false;
      this.mpRetryWaiting = {ciws:null, ram:null, manual:null};
      this.isPaused = false;
      SensorSystem.update(this.world);
    }

    // A shortage is remembered only for the operation that actually failed.
    // Unrelated first launches never inherit another operation's retry delay.
    isMpShortageRetryDeferred(kind, operationId) {
      const waitingId = this.mpRetryWaiting[kind];
      if (waitingId == null) return false;
      if (waitingId !== operationId) {
        this.mpRetryWaiting[kind] = null;
        return false;
      }
      return !this.isCombatMpCycleTick;
    }

    deferMpShortageRetry(kind, operationId) {
      this.mpRetryWaiting[kind] = operationId;
    }

    clearMpShortageRetry(kind) {
      this.mpRetryWaiting[kind] = null;
    }

    selectWeapon(weaponId) {
      if (this.stageSpec.exAutoSimulation || !PK_WEAPON_PROFILES[weaponId]) return false;
      this.selectedWeaponId = weaponId;
      return true;
    }

    togglePause() {
      if (this.world.battleState === BattleState.RUNNING) {
        this.isPaused = !this.isPaused;
      } else {
        this.isPaused = false;
      }
      return this.isPaused;
    }

    toggleAutoFire() {
      this.autoFireEnabled = !this.autoFireEnabled;
      return this.autoFireEnabled;
    }

    // V switches both CIWS gun and automatic RAM firing. Airborne RAM remains
    // a normal guided missile; only new automatic launches are disabled.
    toggleCloseDefenseAuto() {
      if (this.stageSpec.exAutoSimulation) return this.closeDefenseAutoEnabled;
      this.closeDefenseAutoEnabled = !this.closeDefenseAutoEnabled;
      if (!this.closeDefenseAutoEnabled) {
        const gun = this.world.ciwsGunDefense;
        if (gun.claimedChannelId) {
          // Internal owner release works even when V is pressed during pause.
          CIWSChannelSystem.release(this, gun.claimedChannelId, CIWS_GUN_OWNER);
        }
        CIWSGunSystem.clear(this, gun.claimedChannelId);
        ShortRangeDefenseSystem.suspend(this);
      }
      return this.closeDefenseAutoEnabled;
    }

    applyTimeScaleMode() {
      this.timeScale = TIME_SCALE_STEPS[this.timeScaleIndex];
      this.simulationTimeScale = SIMULATION_TIME_MULTIPLIERS[this.timeScaleIndex];
      this.world.missileMotionMultiplier = MISSILE_MOTION_MULTIPLIERS[this.timeScaleIndex];
    }

    cycleTimeScale() {
      this.timeScaleIndex =
        (this.timeScaleIndex + 1) % TIME_SCALE_STEPS.length;
      this.applyTimeScaleMode();
      return this.timeScale;
    }

    isTrackEngaged(track) {
      return this.world.interceptors.some(
        i => i.alive && i.targetEntityId === track.sourceEntityId
      );
    }

    isTrackPending(track) {
      return (
        this.world.reservationQueue.some(
          p => p.sourceEntityId === track.sourceEntityId
        ) ||
        this.world.pendingEngagements.some(
          p => p.sourceEntityId === track.sourceEntityId
        ) ||
        this.world.sequentialLaunchQueue.some(
          p => p.sourceEntityId === track.sourceEntityId
        )
      );
    }

    isTrackCancelablePending(track) {
      return this.world.reservationQueue.some(
        p => p.sourceEntityId === track.sourceEntityId
      );
    }

    unlaunchedPlanningCount() {
      return (
        this.world.reservationQueue.length +
        this.world.pendingEngagements.length +
        this.world.sequentialLaunchQueue.length
      );
    }

    canCreateReservation(track) {
      if (!track || !track.visible) return false;
      if (this.isTrackEngaged(track) || this.isTrackPending(track)) return false;

      // RESERVE QUEUE itself is the player's planning surface and has exactly
      // four slots. Normal CH capacity does NOT increase the number of targets
      // that can be registered by clicking.
      if (
        this.world.reservationQueue.length +
          this.world.pendingEngagements.length >= RESERVATION_QUEUE_WAITING_LIMIT
      ) {
        return false;
      }

      return true;
    }

    occupiedChannelIds() {
      const occupied = new Set(
        this.world.interceptors
          .filter(i => i.alive && i.channelId)
          .map(i => i.channelId)
      );

      for (const pending of this.world.pendingEngagements) {
        if (pending.channelId) occupied.add(pending.channelId);
      }
      for (const committed of this.world.sequentialLaunchQueue) {
        if (committed.channelId) occupied.add(committed.channelId);
      }
      for (const channelId of this.world.ciwsChannelClaims.keys()) {
        occupied.add(channelId);
      }
      return occupied;
    }

    freeChannelId() {
      const occupied = this.occupiedChannelIds();

      for (let n = 1; n <= this.stageSpec.channelCount; n++) {
        const id = "CH-" + String(n).padStart(2, "0");
        if (!occupied.has(id) &&
            isOperationalNormalChannel(this.world,this.stageSpec,id)) return id;
      }
      return null;
    }

    // Return approved-but-not-yet-launched orders to the normal waiting queue.
    // The original launch cadence survives until the emergency clears.
    returnUnlaunchedChannelReservations(channelIds) {
      const w = this.world;
      const remaining = [];
      const returned = [];
      for (const item of w.sequentialLaunchQueue) {
        if (channelIds.has(item.channelId)) {
          const {channelId, ...pending} = item;
          returned.push({...pending, fireAuthorized:true});
        } else {
          remaining.push(item);
        }
      }
      if (returned.length) {
        w.sequentialLaunchQueue = remaining;
        w.pendingEngagements.push(...returned);
        w.pendingEngagements.sort((a,b) => a.reservationOrder - b.reservationOrder);
      }
      return returned.length;
    }

    yieldUnlaunchedChannelsForEmergency() {
      if (!this.world.emergencyReassignmentQueue.length) return 0;
      return this.returnUnlaunchedChannelReservations(
        new Set(this.world.sequentialLaunchQueue.map(item => item.channelId))
      );
    }

    claimCiwsChannel(channelId, ownerId="CIWS") {
      if (this.stageSpec.exAutoSimulation || this.isPaused) return false;
      return CIWSChannelSystem.claim(this, channelId, ownerId);
    }

    releaseCiwsChannel(channelId, ownerId="CIWS") {
      if (this.stageSpec.exAutoSimulation || this.isPaused) return false;
      return CIWSChannelSystem.release(this, channelId, ownerId);
    }

    assignReservationsToFreeChannels() {
      if (this.stageSpec.exAutoSimulation) return 0;
      const w = this.world;
      EmergencyReassignmentSystem.prune(w);
      this.yieldUnlaunchedChannelsForEmergency();
      const occupied = this.occupiedChannelIds();
      EmergencyReassignmentSystem.assignFreeChannels(this, occupied);
      if (w.emergencyReassignmentQueue.length) return 0;
      return this.assignAuthorizedPendingEngagements(occupied);
    }

    assignAuthorizedPendingEngagements(occupied) {
      const w = this.world;
      const readyToLaunch = [];

      // Only A-authorized reservations may claim a channel.
      // Q registration alone must never launch a missile.
      // Reserve each free CH locally as soon as it is selected; otherwise
      // multiple same-tick reservations could claim the same free channel.
      // Physical launches still use the existing 0.2s / 0.6s schedule.
      while (w.pendingEngagements.some(reservation => reservation.fireAuthorized)) {
        let channelId = null;
        for (let n = 1; n <= this.stageSpec.channelCount; n++) {
          const candidate = "CH-" + String(n).padStart(2, "0");
          if (!occupied.has(candidate) &&
              isOperationalNormalChannel(w,this.stageSpec,candidate)) {
            channelId = candidate;
            break;
          }
        }
        if (!channelId) break;

        const launchIndex = w.pendingEngagements.findIndex(
          reservation => reservation.fireAuthorized
        );
        const [reservation] = w.pendingEngagements.splice(launchIndex, 1);
        const track = w.tracks.find(
          t =>
            t.trackId === reservation.trackId &&
            t.visible &&
            t.sourceEntityId === reservation.sourceEntityId
        );
        const sourceAlive = w.attackMissiles.some(
          missile =>
            missile.entityId === reservation.sourceEntityId &&
            missile.alive
        );
        if (!track || !sourceAlive) continue;

        occupied.add(channelId);
        readyToLaunch.push({ ...reservation, channelId });
      }

      if (readyToLaunch.length) {
        this.enqueueSequentialLaunches(readyToLaunch);
      }
      return readyToLaunch.length;
    }

    selectTrack(trackId) {
      if (this.stageSpec.exAutoSimulation) return false;
      if (this.world.battleState !== BattleState.RUNNING) return false;

      const track = this.world.tracks.find(
        t => t.trackId === trackId && t.visible      );
      if (!track) return false;

      // Selection is planning only: click -> RESERVE QUEUE (max 4).
      // Click only reserves; Q freezes weapon choice; A/C authorizes launch.
      // CH is acquired after authorization, when a channel becomes free.
      if (this.stageSpec.usePendingEngagements) {
        if (this.isTrackEngaged(track) || this.isTrackPending(track)) {
          this.world.selectedTrackId = track.trackId;
          return false;
        }

        if (!this.canCreateReservation(track)) {
          return false;
        }

        this.world.reservationQueue.push({
          trackId: track.trackId,
          sourceEntityId: track.sourceEntityId,
          reservationOrder: this.world.nextReservationOrder++,
        });

        this.world.selectedTrackId = track.trackId;
        return true;
      }

      this.world.selectedTrackId = track.trackId;
      for (const t of this.world.tracks) {
        t.selected = (t.trackId === track.trackId);
      }
      return true;
    }

    cancelAllSelections() {
      // Clear only click-planned, not-yet-Q-committed reservations.
      // Q-committed CH waits, sequential launches and active interceptors remain.
      this.world.reservationQueue = [];
      this.world.selectedTrackId = null;

      for (const track of this.world.tracks) {
        track.selected = false;
      }
      return true;
    }

    cancelPending(trackId=null) {
      if (!this.stageSpec.usePendingEngagements) return false;
      const w = this.world;

      const cancelable = [
        ...w.reservationQueue.map((reservation, index) => ({
          collection: "reservationQueue",
          index,
          reservation,
        })),
      ];

      if (!cancelable.length) return false;

      let candidate = null;
      if (trackId == null) {
        candidate = cancelable.reduce((latest, item) =>
          !latest || item.reservation.reservationOrder > latest.reservation.reservationOrder
            ? item
            : latest
        , null);
      } else {
        candidate = cancelable.find(
          item => item.reservation.trackId === trackId
        ) ?? null;
      }

      if (!candidate) return false;

      const [removed] = w[candidate.collection].splice(candidate.index, 1);

      // Cancellation does not execute the Queue. Even if a CH becomes free,
      // remaining reservations stay in RESERVE QUEUE until F/AUTO FIRE.
      if (w.selectedTrackId === removed.trackId) {
        const remaining = [
          ...w.reservationQueue,
        ];
        const latest = remaining.reduce((best, item) =>
          !best || item.reservationOrder > best.reservationOrder ? item : best
        , null);
        w.selectedTrackId = latest?.trackId ?? null;
      }
      return true;
    }

    launchInterceptor(targetEntityId, channelId, launchTrackPosition,
      weaponId=WEAPON_IDS.ONE, options={}) {
      const w = this.world;
      const baseSpeed = INTERCEPTOR_WEAPON_SPEED_PROFILES[weaponId].baseSpeed * (window.__RG ? window.__RG.speedMul : 1);
      const fixedSpeed = weaponId === WEAPON_IDS.FOUR;
      const launchSpeed = fixedSpeed ? baseSpeed :
        INTERCEPTOR_WEAPON_SPEED_PROFILES.COMMON.launchSpeed;
      const launchTarget = w.attackMissiles.find(
        missile => missile.entityId === targetEntityId && missile.alive
      );
      const mpCost = getInterceptorMpLaunchCost(
        weaponId,!!options.autoShortRange
      );
      if (!launchTarget ||
          (!this.stageSpec.exAutoSimulation &&
           !isOperationalNormalChannel(w,this.stageSpec,channelId)) ||
          !hasSufficientCombatMp(w,mpCost)) return false;
      const removalDistances = BoosterSystem.removalDistances(
        distance(launchTarget.position, w.ship.position)
      );
      const launchPosition = w.ship.position.add(new Vec2(0,-24));
      const initialGuidancePoint = launchTrackPosition.clone();
      const initialGuidanceDirection =
        initialGuidancePoint.sub(launchPosition).normalized();

      const interceptor = new Missile({
        entityId: "INT-" + String(this.idCounter++).padStart(3,"0"),
        role: MissileRole.INTERCEPTOR,
        position: launchPosition,
        speed: launchSpeed,
        hitRadius: 7,
        displayRadius: 3,
        targetEntityId,
        channelId,
        guidancePoint: initialGuidancePoint,
        guidanceDirection: initialGuidanceDirection,
        launchGuidancePoint: initialGuidancePoint.clone(),
        launchPlatformEntityId: w.ship.entityId,
        trailPoints: [
          w.ship.position.clone(),
          launchPosition.clone(),
        ],
        guidanceMode: weaponId === WEAPON_IDS.TWO
          ? GuidanceMode.ACTIVE : GuidanceMode.SHIP_SUPPORTED,
        weaponId: weaponId,
        autoShortRange: !!options.autoShortRange,
        guidanceState: GuidanceState.MIDCOURSE,
        hasReceivedTrackGuidance: false,
        lastGuidanceUpdateTime: w.time,
        baseSpeed: baseSpeed,
        currentSpeed: launchSpeed,
        terminalSpeed: fixedSpeed ? baseSpeed :
          launchSpeed * INTERCEPTOR_TERMINAL_SPEED_MULTIPLIER,
        terminalAcceleration: fixedSpeed ? 0 :
          baseSpeed * INTERCEPTOR_TERMINAL_ACCELERATION_MULTIPLIER_PER_SECOND,
        boosterState: fixedSpeed ? null : BoosterState.LAUNCHED,
        traveledDistance: 0,
        booster1RemovalDistance: fixedSpeed ? null : removalDistances.first,
        booster2RemovalDistance: weaponId === WEAPON_IDS.TWO
          ? removalDistances.second : null,
        terminalHoldDirection: (this.idCounter % 2 === 0 ? 1 : -1),
      });

      if (!spendCombatMp(w,mpCost)) return false;
      w.interceptors.push(interceptor);
      w.events.push({
        type:"MissileLaunched",
        position:interceptor.position.clone(),
        channelId,
        weaponId,
        automaticShortRange: !!options.autoShortRange,
      });
      return interceptor;
    }

    enqueueSequentialLaunches(reservations) {
      const w = this.world;
      if (!reservations.length) return 0;
      const hadNormal = w.sequentialLaunchQueue.some(item => item.weaponId !== WEAPON_IDS.FOUR);
      for (const reservation of reservations) w.sequentialLaunchQueue.push({...reservation});
      // M4 entries never start or stall the original M1-M3 burst clock.
      if (!hadNormal && w.sequentialLaunchQueue.some(item => item.weaponId !== WEAPON_IDS.FOUR) &&
          w.nextSequentialLaunchTime == null) {
        w.nextSequentialLaunchTime = w.time;
        w.sequentialLaunchBurstShotCount = 0;
      }
      return reservations.length;
    }

    processSequentialLaunchLane(shortLane) {
      const w = this.world;
      const isInLane = item => (item.weaponId === WEAPON_IDS.FOUR) === shortLane;
      if (!w.sequentialLaunchQueue.some(isInLane)) {
        if (!shortLane) {
          w.nextSequentialLaunchTime = null;
          w.sequentialLaunchBurstShotCount = 0;
        }
        return false;
      }
      if (shortLane) {
        if (w.time + 1e-9 < w.nextShortRangeLaunchAllowedTime) return false;
      } else {
        if (w.nextSequentialLaunchTime == null) w.nextSequentialLaunchTime = w.time;
        if (w.time + 1e-9 < w.nextSequentialLaunchTime) return false;
      }
      while (w.sequentialLaunchQueue.some(isInLane)) {
        const oldest = w.sequentialLaunchQueue.reduce((first, item) =>
          !first || item.reservationOrder < first.reservationOrder ? item : first,
          null
        );
        // Across M1..M4, an older launch order is never bypassed.
        if (!oldest || !isInLane(oldest)) return false;
        const index = w.sequentialLaunchQueue.indexOf(oldest);
        const [reservation] = w.sequentialLaunchQueue.splice(index,1);
        const track = w.tracks.find(t =>
          t.trackId === reservation.trackId && t.visible &&
          t.sourceEntityId === reservation.sourceEntityId
        );
        const sourceAlive = w.attackMissiles.some(m =>
          m.entityId === reservation.sourceEntityId && m.alive
        );
        if (!track || !sourceAlive) continue;
        const channelClaimedByCiws = w.ciwsChannelClaims.has(reservation.channelId);
        const alreadyOccupied = w.interceptors.some(i =>
          i.alive && i.channelId === reservation.channelId
        ) || w.sequentialLaunchQueue.some(item =>
          item.channelId === reservation.channelId
        );
        const validChannel = reservation.channelId && Array.from(
          {length:this.stageSpec.channelCount},(_,n)=>
            "CH-" + String(n+1).padStart(2,"0")
        ).includes(reservation.channelId) &&
          isOperationalNormalChannel(w,this.stageSpec,reservation.channelId);
        if (channelClaimedByCiws || alreadyOccupied || !validChannel) {
          const {channelId,...pending} = reservation;
          w.pendingEngagements.push({...pending,fireAuthorized:true});
          w.pendingEngagements.sort((a,b)=>a.reservationOrder-b.reservationOrder);
          continue;
        }
        // A-authorized orders stay approved; only an actual MP shortage
        // defers their physical launch until the next shared 2-s cycle.
        const mpCost = getInterceptorMpLaunchCost(
          reservation.weaponId || WEAPON_IDS.ONE
        );
        if (!hasSufficientCombatMp(w,mpCost)) {
          w.sequentialLaunchQueue.splice(index,0,reservation);
          this.deferMpShortageRetry("manual", reservation.reservationOrder);
          return false;
        }
        const launched = this.launchInterceptor(
          reservation.sourceEntityId,reservation.channelId,
          track.displayPosition,reservation.weaponId || WEAPON_IDS.ONE
        );
        if (!launched) continue;
        this.clearMpShortageRetry("manual");
        if (shortLane) {
          // Manual M4 and autonomous RAM share the *same* last-launch time.
          w.nextShortRangeLaunchAllowedTime = w.time + SHORT_RANGE_SHARED_LAUNCH_INTERVAL;
        } else {
          const shotsInBurst = w.sequentialLaunchBurstShotCount + 1;
          const hasAnotherNormal = w.sequentialLaunchQueue.some(isInLane);
          if (!hasAnotherNormal) {
            w.nextSequentialLaunchTime = null;
            w.sequentialLaunchBurstShotCount = 0;
          } else if (shotsInBurst >= SEQUENTIAL_LAUNCH_BURST_SIZE) {
            w.sequentialLaunchBurstShotCount = 0;
            w.nextSequentialLaunchTime = w.time + SEQUENTIAL_LAUNCH_INTER_BURST_GAP;
          } else {
            w.sequentialLaunchBurstShotCount = shotsInBurst;
            w.nextSequentialLaunchTime = w.time + SEQUENTIAL_LAUNCH_INTRA_BURST_DELAY;
          }
        }
        return true;
      }
      if (!shortLane) {
        w.nextSequentialLaunchTime = null;
        w.sequentialLaunchBurstShotCount = 0;
      }
      return false;
    }

    processSequentialLaunchQueue() {
      const w = this.world;
      EmergencyReassignmentSystem.prune(w);
      if (w.emergencyReassignmentQueue.length) return false;
      // FIFO across M1..M4. Normal launches are checked each simulation
      // tick and obey their original 0.2/0.6-s and M4 0.5-s cooldowns.
      // Only an order that failed for lack of MP waits for the 2-s cycle.
      let launched = false;
      for (let attempt = 0; attempt < 2; attempt++) {
        const oldest = w.sequentialLaunchQueue.reduce((first, item) =>
          !first || item.reservationOrder < first.reservationOrder ? item : first,
          null
        );
        if (!oldest) {
          this.clearMpShortageRetry("manual");
          break;
        }
        if (this.isMpShortageRetryDeferred("manual", oldest.reservationOrder)) {
          const trackStillValid = w.tracks.some(t =>
            t.trackId === oldest.trackId && t.visible &&
            t.sourceEntityId === oldest.sourceEntityId
          ) && w.attackMissiles.some(m =>
            m.entityId === oldest.sourceEntityId && m.alive
          );
          if (trackStillValid) break;
          this.clearMpShortageRetry("manual");
        }
        const shortLane = oldest.weaponId === WEAPON_IDS.FOUR;
        if (!this.processSequentialLaunchLane(shortLane)) break;
        launched = true;
      }
      return launched;
    }

    registerFireWaiting() {
      const w = this.world;
      if (this.stageSpec.exAutoSimulation || w.battleState !== BattleState.RUNNING) return false;
      const reservations = [...w.reservationQueue].sort(
        (a, b) => a.reservationOrder - b.reservationOrder
      );
      const registered = [];
      for (const reservation of reservations) {
        const track = w.tracks.find(t =>
          t.trackId === reservation.trackId && t.visible &&
          t.sourceEntityId === reservation.sourceEntityId
        );
        const sourceAlive = w.attackMissiles.some(m =>
          m.alive && m.entityId === reservation.sourceEntityId
        );
        if (!track || !sourceAlive) continue;
        registered.push({
          ...reservation,
          weaponId: this.selectedWeaponId,
          fireAuthorized: false,
        });
      }
      w.reservationQueue = [];
      if (!registered.length) return false;
      w.pendingEngagements.push(...registered);
      w.selectedTrackId = null;
      return true;
    }

    // Approvals never spend MP: the physical launch remains the sole spending
    // event. Exclude already approved, unlaunched orders to avoid approving more
    // manual shots than the current MP can fund.
    availableMpForNewApprovals() {
      const defense = this.world.defenseState;
      if (!defense) return Infinity;
      const committed = [
        ...this.world.pendingEngagements.filter(item => item.fireAuthorized),
        ...this.world.sequentialLaunchQueue,
      ];
      const committedCost = committed.reduce((total, item) =>
        total + getInterceptorMpLaunchCost(item.weaponId || WEAPON_IDS.ONE), 0
      );
      return Math.max(0, defense.mp - committedCost);
    }

    hasApproablePending() {
      const available = this.availableMpForNewApprovals();
      return this.world.pendingEngagements.some(item =>
        !item.fireAuthorized &&
        (item.weaponId === WEAPON_IDS.FOUR
          ? this.shortFireCooldownRemaining <= 0.0001
          : this.fireCooldownRemaining <= 0.0001) &&
        available >= getInterceptorMpLaunchCost(item.weaponId || WEAPON_IDS.ONE)
      );
    }

    fireInterceptor() {
      // A/C grants approval only when the corresponding cooldown AND the
      // current MP budget permit it. Q registration remains untouched.
      const w = this.world;
      if (this.stageSpec.exAutoSimulation || w.battleState !== BattleState.RUNNING) return false;
      let generalApproved = false;
      let shortApproved = false;
      let available = this.availableMpForNewApprovals();
      for (const item of w.pendingEngagements) {
        if (item.fireAuthorized) continue;
        if (item.weaponId === WEAPON_IDS.FOUR) {
          if (this.shortFireCooldownRemaining > 0.0001) continue;
        } else if (this.fireCooldownRemaining > 0.0001) {
          continue;
        }
        const cost = getInterceptorMpLaunchCost(item.weaponId || WEAPON_IDS.ONE);
        if (available < cost) continue;
        available -= cost;
        item.fireAuthorized = true;
        if (item.weaponId === WEAPON_IDS.FOUR) shortApproved = true;
        else generalApproved = true;
      }
      if (!generalApproved && !shortApproved) return false;
      if (generalApproved) this.fireCooldownRemaining = this.fireCooldownSeconds;
      if (shortApproved) this.shortFireCooldownRemaining = this.shortFireCooldownSeconds;
      this.assignReservationsToFreeChannels();
      return true;
    }

    update(dt) {
      const w = this.world;
      w.events = [];

      // Full tactical pause: simulation time, cooldown, movement,
      // spawning and TTI progression all stop.
      if (this.isPaused) {
        return;
      }

      this.fireCooldownRemaining = Math.max(
        0,
        this.fireCooldownRemaining - dt
      );
      this.shortFireCooldownRemaining = Math.max(
        0,
        this.shortFireCooldownRemaining - dt
      );

      if (w.battleState !== BattleState.RUNNING) {
        updateEffects(w, dt);
        return;
      }

      w.time += dt;
      spawnDueAttacks(w);

      if (this.stageSpec.exAutoSimulation) {
        EnemyFlightProfileSystem.updateSpeed(w, dt);
        const exAttackSegments =
          MovementSystem.updateAttacks(w, dt);
        EnemyFlightProfileSystem.recordMovement(
          w,
          exAttackSegments
        );

        TrackUpdateSystem.update(w);
        SensorSystem.update(w);
        EXAutoDefenseSystem.update(this);

        EXGuidanceSystem.update(w);
        FinalChannelSystem.update(w);
        MovementSystem.updateInterceptors(w, dt);

        const hitsBefore =
          w.events.filter(event => event.type === "InterceptorHit").length;
        CollisionSystem.update(w);
        const hitsAfter =
          w.events.filter(event => event.type === "InterceptorHit").length;
        w.exAutoInterceptedCount +=
          Math.max(0, hitsAfter - hitsBefore);

        FinalChannelSystem.update(w);
        TrackUpdateSystem.update(w);
        EXEngagementMetricsSystem.update(w, dt);
        BattleEndSystem.update(w);
        updateEffects(w, dt);
        EXMaintenanceSystem.update(w);
        return;
      }

      // MP regeneration and shortage-only retries use the shared 240-tick
      // cycle. All normal launch/acquisition attempts stay on the 120-Hz loop.
      this.isCombatMpCycleTick =
        this.combatMpCycleTickCount % COMBAT_MP_CYCLE_TICKS === 0;
      this.combatMpCycleTickCount++;
      if (this.isCombatMpCycleTick) {
        // The old shortage wait expires before MP is restored and before
        // CIWS > RAM > manual launches consume the renewed balance.
        this.clearMpShortageRetry("ciws");
        this.clearMpShortageRetry("ram");
        this.clearMpShortageRetry("manual");
      }
      updateDefenseMpRecovery(w, this.isCombatMpCycleTick);

      EnemyFlightProfileSystem.updateSpeed(w, dt);
      const attackSegments = MovementSystem.updateAttacks(w, dt);
      EnemyFlightProfileSystem.recordMovement(w, attackSegments);
      // CIWS and RAM may start immediately under their original rules.
      // Shortage-deferred attempts re-enter only on the shared MP cycle.
      CIWSGunSystem.update(this);
      ShortRangeDefenseSystem.update(this);

      // C authorizes A only; it never registers Q reservations.
      if (this.autoFireEnabled && this.hasApproablePending()) {
        this.fireInterceptor();
      }
      this.assignReservationsToFreeChannels();
      this.processSequentialLaunchQueue();

      // Track publication stays tied to the rotating radar.
      TrackUpdateSystem.update(w);
      const refreshedTrackIds = SensorSystem.update(w);

      // A ship-supported steering update is generated by the same sweep
      // event that refreshed the target Track.
      GuidanceSystem.update(w, refreshedTrackIds);
      SeekerSystem.update(w);
      FinalChannelSystem.update(w);
      MovementSystem.updateInterceptors(w, dt);

      CollisionSystem.update(w);
      ChannelDestructionSystem.update(this);
      // End-of-tick reconciliation handles newly destroyed targets only.
      // The normal Seeker sweep still occurs once per simulation tick.
      SeekerSystem.update(w,true);
      FinalChannelSystem.update(w);
      TrackUpdateSystem.update(w);
      EmergencyReassignmentSystem.prune(w);
      // After collisions do housekeeping only, not another launch attempt.
      this.isCombatMpCycleTick = false;
      ShortRangeDefenseSystem.update(this);

      // Uncommitted clicks never take a returned CH automatically.
      // Existing Q-committed channel waits are assigned on the next tick
      // even if AUTO FIRE is disabled.

      BattleEndSystem.update(w);
      updateEffects(w, dt);
    }
  }

  function updateEffects(world, dt){
    for (const e of world.effects) e.age += dt;
    world.effects = world.effects.filter(e => e.age < e.life);
  }

  // -------- Presentation --------
  function getSnapshot(world, stageSpec) {
    const liveInterceptors = world.interceptors.filter(i => i.alive);

    const visibleTrackBySource = new Map(
      world.tracks
        .filter(t => t.visible)
        .map(t => [t.sourceEntityId, t])
    );

    const attackMissiles = world.attackMissiles
      .filter(m => {
        if (!m.alive) return false;
        return visibleTrackBySource.has(m.entityId);
      })
      .map(m => {
        const track = visibleTrackBySource.get(m.entityId);
        const displayPosition = track.displayPosition;

        const heading = Math.atan2(
          world.ship.position.y - displayPosition.y,
          world.ship.position.x - displayPosition.x
        );
        return {
          id: m.entityId,
          x: displayPosition.x,
          y: displayPosition.y,
          heading,
          sensorProfile: m.sensorProfile,
          baseSpeed: m.baseSpeed,
          displayRadius: m.displayRadius,
        };
      });

    const interceptors = liveInterceptors.map(i => {
      const target = world.attackMissiles.find(
        a => a.entityId === i.targetEntityId && a.alive
      );

      let heading = 0;
      let currentObjective = i.guidancePoint;

      if (
        i.guidanceState === GuidanceState.TERMINAL_LOCK &&
        target
      ) {
        heading = Math.atan2(
          target.position.y - i.position.y,
          target.position.x - i.position.x
        );
        currentObjective = target.position;
      } else if (i.guidanceDirection) {
        heading = Math.atan2(
          i.guidanceDirection.y,
          i.guidanceDirection.x
        );
      }

      const remainingDistance =
        currentObjective
          ? distance(i.position, currentObjective)
          : null;

      return {
        id: i.entityId,
        x: i.position.x,
        y: i.position.y,
        heading,
        channelId: i.channelId,
        finalChannelId: i.finalChannelId,
        guidanceMode: i.guidanceMode,
        weaponId: i.weaponId,
        guidanceState: i.guidanceState,
        hasReceivedTrackGuidance: i.hasReceivedTrackGuidance,
        terminalHold: i.terminalHold,
        terminalGuidanceActive: i.terminalGuidanceActive,
        currentSpeed: i.currentSpeed,
        launchPlatformEntityId: i.launchPlatformEntityId,
        remainingDistance,
        trailPoints: (i.trailPoints || []).map(point => ({
          x: point.x,
          y: point.y,
        })),
      };
    });

    const channels = [];
    const ciwsPriorityIds = new Set(ciwsPriorityChannelIds(stageSpec,world));
    for (let n = 1; n <= stageSpec.channelCount; n++) {
      const channelId =
        "CH-" + String(n).padStart(world.exMode ? 3 : 2, "0");
      const destroyed = world.destroyedNormalChannelIds.has(channelId);
      if (destroyed) {
        channels.push({
          id: channelId,
          displayId: normalChannelDisplayId(channelId),
          ciwsPriority: false,
          status: "DESTROY",
          displayStatus: "DESTROY",
          eta: null,
          weaponId: null,
          targetLabel: null,
        });
        continue;
      }
      const interceptor = liveInterceptors.find(i => i.channelId === channelId);
      const pending =
        world.pendingEngagements.find(p => p.channelId === channelId) ||
        world.sequentialLaunchQueue.find(p => p.channelId === channelId);

      let eta = null;
      if (interceptor) {
        const target = world.attackMissiles.find(
          a => a.entityId === interceptor.targetEntityId && a.alive
        );

        if (target) {
          const targetTrack = world.tracks.find(
            track =>
              track.sourceEntityId === target.entityId &&
              track.visible
          );

          if (targetTrack) {
            const publishedTargetPosition = targetTrack.displayPosition;
            const r = publishedTargetPosition.sub(interceptor.position);
            const d = r.len();

            if (d <= 1e-6) {
              eta = 0;
            } else {
              const los = r.normalized();
              const targetDir =
                world.ship.position.sub(publishedTargetPosition).normalized();
              const targetAlongLos =
                targetDir.x * targetTrack.displaySpeed * los.x +
                targetDir.y * targetTrack.displaySpeed * los.y;
              const closingSpeed =
                Math.max(1, (interceptor.currentSpeed - targetAlongLos) * world.missileMotionMultiplier);
              eta = d / closingSpeed;
            }
          }
        }
      }

      const claimOwner = world.ciwsChannelClaims.get(channelId);
      const baseStatus = claimOwner === SHORT_RANGE_MISSILE_OWNER
        ? "SHORT_RANGE" : claimOwner ? "CIWS" :
        interceptor ? "ACTIVE" : (pending ? "PENDING" : "READY");

      let displayStatus = baseStatus;
      if (claimOwner === SHORT_RANGE_MISSILE_OWNER) {
        displayStatus = "RAM";
      } else if (claimOwner === CIWS_GUN_OWNER) {
        displayStatus = "CIWS";
      } else if (interceptor) {
        if (
          interceptor.hasReceivedTrackGuidance ||
          interceptor.guidanceState === GuidanceState.TRACK_GUIDANCE ||
          interceptor.terminalHold
        ) {
          displayStatus = "LOCK ON";
        } else {
          displayStatus = "FLY";
        }
      }

      channels.push({
        id: channelId,
        displayId: normalChannelDisplayId(channelId),
        ciwsPriority: ciwsPriorityIds.has(channelId),
        status: baseStatus,
        displayStatus,
        eta,
        weaponId: interceptor?.weaponId || pending?.weaponId || null,
        targetLabel: (() => {
          const sourceId=interceptor?.targetEntityId || pending?.sourceEntityId;
          const t=world.tracks.find(t=>t.sourceEntityId===sourceId);
          return t?.trackId?.replace(/^TRACK-/,"T-") || null;
        })(),
      });
    }

    const finalChannels = [];
    for (let n = 1; n <= finalChannelCountFor(world); n++) {
      const id = "FINAL-CH-" + String(n).padStart(2, "0");
      const interceptor = liveInterceptors.find(
        missile => missile.finalChannelId === id
      );
      finalChannels.push({
        id,
        displayId: finalChannelDisplayId(id),
        status: interceptor ? "LOCK ON" : "READY",
        displayStatus: interceptor ? "LOCK ON" : "READY",
      });
    }

    // RESERVE QUEUE is the four-slot click-planning gate.
    // Q registers pendingEngagements and freezes their weapon IDs;
    // A/C authorizes CH allocation and physical sequential launch.
    const emergencyReservations = world.emergencyReassignmentQueue
      .map(item => {
        const missile = liveInterceptors.find(i => i.entityId === item.interceptorId);
        const track = missile && world.tracks.find(t => t.sourceEntityId === missile.targetEntityId);
        if (!missile || !track || !missile.guidanceSupportSuspended) return null;
        return {
          interceptorId: missile.entityId,
          trackId: track.trackId,
          sourceEntityId: track.sourceEntityId,
          weaponId: missile.weaponId,
          preemptionOrder: item.preemptionOrder,
          fireCommitted: true,
          reassignmentPending: true,
        };
      }).filter(Boolean);
    const waitingReservations = [
      ...emergencyReservations,
      ...[
        ...world.reservationQueue,
        ...world.pendingEngagements,
      ].sort((a, b) => a.reservationOrder - b.reservationOrder),
    ];

    const reservationNumberBySource = new Map(
      waitingReservations.map((reservation, index) => [
        reservation.sourceEntityId,
        index + 1,
      ])
    );

    const warningInfo = closestVisibleWarningTrack(world);
    const warningTrackId = warningInfo?.track?.trackId ?? null;

    const tracks = world.tracks
      .filter(t => t.visible)
      .map(t => {
        const source = world.attackMissiles.find(
          m => m.entityId === t.sourceEntityId && m.alive
        );
        const tti = source
          ? distance(t.displayPosition, world.ship.position) /
              ((t.displaySpeed ?? source.speed) * world.missileMotionMultiplier)
          : null;

        const queuedReservation =
          world.reservationQueue.find(
            p => p.sourceEntityId === t.sourceEntityId
          );
        const pendingReservation =
          world.pendingEngagements.find(
            p => p.sourceEntityId === t.sourceEntityId
          ) ||
          world.sequentialLaunchQueue.find(
            p => p.sourceEntityId === t.sourceEntityId
          );
        const plannedReservation = queuedReservation || pendingReservation;
        const activeInterceptor = liveInterceptors.find(
          i => i.targetEntityId === t.sourceEntityId
        );
        const channelId =
          activeInterceptor?.channelId ||
          pendingReservation?.channelId ||
          null;
        const finalChannelId = activeInterceptor?.finalChannelId || null;
        const reservationNumber =
          reservationNumberBySource.get(t.sourceEntityId) ?? null;

        return {
          id: t.trackId,
          targetLabel: t.trackId.replace(/^TRACK-/, "T-"),
          sourceEntityId: t.sourceEntityId,
          x: t.displayPosition.x,
          y: t.displayPosition.y,
          selected:
            t.selected ||
            world.selectedTrackId === t.trackId,
          pending: !!plannedReservation,
          queued: !!queuedReservation,
          engaged: !!activeInterceptor,
          reservationNumber,
          channelId,
          channelShortCode: channelId
            ? normalChannelShortCode(channelId)
            : null,
          finalChannelId,
          finalChannelShortCode: finalChannelId
            ? finalChannelShortCode(finalChannelId)
            : null,
          sensorProfile: source?.sensorProfile ?? "normal",
          tti: stageSpec.showTTI ? tti : null,
          warning: t.trackId === warningTrackId,
        };
      });

    const selectedTrack = tracks.find(t => t.id === world.selectedTrackId) || null;
    const freeChannelCount = channels.filter(c => c.status === "READY").length;
    const waitingApproval = world.pendingEngagements.filter(p=>!p.fireAuthorized);
    const possibleApprovalTimers = waitingApproval.map(p=>
      p.weaponId === WEAPON_IDS.FOUR
        ? session.shortFireCooldownRemaining : session.fireCooldownRemaining
    );
    const fireCooldownRemaining = possibleApprovalTimers.length
      ? Math.min(...possibleApprovalTimers)
      : session.selectedWeaponId === WEAPON_IDS.FOUR
        ? session.shortFireCooldownRemaining : session.fireCooldownRemaining;
    const fireCooldownSeconds = possibleApprovalTimers.length &&
      waitingApproval.some(p => p.weaponId !== WEAPON_IDS.FOUR &&
        session.fireCooldownRemaining <= fireCooldownRemaining + 1e-9)
        ? session.fireCooldownSeconds
        : session.selectedWeaponId === WEAPON_IDS.FOUR ||
          waitingApproval.some(p => p.weaponId === WEAPON_IDS.FOUR &&
            session.shortFireCooldownRemaining <= fireCooldownRemaining + 1e-9)
          ? session.shortFireCooldownSeconds : session.fireCooldownSeconds;

    // Before Q, rows preview the selected weapon live. Q freezes weaponId.
    // A/C changes launch authorization, not the registered weapon.
    const reserveDisplay = [
      ...emergencyReservations,

        ...world.pendingEngagements.map(reservation => ({ ...reservation, fireCommitted: !!reservation.fireAuthorized })),
        ...world.sequentialLaunchQueue.map(reservation => ({ ...reservation, fireCommitted: true })),
      ].sort((a,b)=>a.reservationOrder-b.reservationOrder),

    const reservationQueue = reserveDisplay.map((reservation,index)=>{

        trackId:reservation.trackId,
        targetLabel:reservation.trackId.replace(/^TRACK-/,"T-"),
