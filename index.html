<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MISSILE DEFENSE ROGUELITE</title>
<style>
  :root {
    color-scheme: dark;
    
    
    
    
    
    
    
    
    
    

    --game-design-width: 1600px;
    --game-design-height: 900px;
    
    

    /* 1.0 = native 1600x900. Downscale only. */
    --ui-scale: 1;

    /* Readability-aware font tokens. JS updates these on resize. */
    --font-micro: 8px;
    --font-tiny: 9px;
    --font-caption: 10px;
    --font-small: 11px;
    --font-body: 12px;
    --font-brand: 16px;

    /* Keep thin UI lines physically visible after down-scaling. */
    --hairline: 1px;
    --strong-line: 2px;
  }
  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  body {
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .viewport-shell {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /*
   * Fixed logical resolution: 1600x900.
   *
   * The old transform:scale() path rasterized the finished UI and then
   * shrank that raster result. Here the game root is layout-zoomed so
   * text and CSS geometry are painted directly at the final display scale.
   */
  .game-root {
    position: relative;
    flex: 0 0 auto;
    width: var(--game-design-width);
    height: var(--game-design-height);
    overflow: hidden;
    zoom: var(--ui-scale);
    
    
  }

  /* Cursor-following HP/MP visual; decorative and never hit-tested. */
  .pointer-defense-rings {
    position: absolute;
    top: 0;
    left: 0;
    width: 72px;
    height: 72px;
    z-index: 30;
    pointer-events: none;
    visibility: hidden;
    transform: translate(0, 0);
  }
  .pointer-defense-rings svg {
    display: block;
    width: 72px;
    height: 72px;
    overflow: visible;
  }
  .pointer-defense-rings .resource-ring-track {
    fill: none;
    opacity: .22;
  }
  .pointer-defense-rings .resource-ring-value {
    fill: none;
    stroke-linecap: butt;
  }

  .app {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 14px;
    overflow: hidden;
    display: grid;
    
    
  }

  .topbar {
    display: flex;
    align-items: center;
    
    
    
    
    
    
    
  }
  .brand {
    
    letter-spacing: .05em;
    white-space: nowrap;
    
  }
  .stage-menu {
    display: flex;
    align-items: center;
    
    
  }
  .stage-menu button {
    width: auto;
    
    border: 0;
    
    background: transparent;
    
    
    
    letter-spacing: .03em;
  }
  
  .stage-menu button:disabled {
    opacity: .55;
  }

  /*
   * Main game body:
   * - left: tactical area takes every pixel left after the sidebar
   * - right: sidebar is fixed at half of its previous width (389px)
   * The tactical area is intentionally rectangular again.
   */
  .main-layout {
    width: 100%;
    
    min-width: 0;
    min-height: 0;
    display: grid;
    
    overflow: hidden;
  }

  .hud {
    width: 100%;
    
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    
    border-left: var(--hairline) solid var(--line);
    border-bottom: var(--hairline) solid var(--line);
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    
    cursor: crosshair;
  }

  .battle-time {
    position: absolute;
    
    
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    
    
    
    text-shadow: 0 1px 2px #000;
  }
  .battle-time .battle-time-label {
    
    font-size: var(--font-tiny);
    font-weight: 800;
    letter-spacing: .08em;
  }
  .battle-time .battle-time-value {
    color: #f4fbff;
    font-size: var(--font-small);
    font-weight: 900;
  }

  .engagement-board-stack {
    position: absolute;
    
    
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }

  
  .engagement-card-header {
    min-height: 24px;
    
  }
  .engagement-toggle {
    width: 100%;
    min-height: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border: 0;
    background: transparent;
    
    font: inherit;
    font-size: var(--font-tiny);
    font-weight: 900;
    letter-spacing: .08em;
    text-align: left;
    cursor: pointer;
    pointer-events: auto;
  }
  .engagement-toggle:hover,
  .engagement-toggle:focus-visible {
    
    
    outline: none;
  }
  .engagement-toggle-icon {
    display: inline-block;
    width: 11px;
    flex: 0 0 11px;
    text-align: center;
    font-size: var(--font-micro);
    letter-spacing: 0;
  }
  .engagement-card-body[hidden] {
    display: none !important;
  }

  .channel-board {
    position: relative;
    display: grid;
    grid-template-columns: 170px 120px;
    column-gap: 6px;
    padding: 6px 8px 7px;
  }

  .reserve-board {
    padding: 2px 8px 8px;
  }
  .reserve-header,
  .reserve-row {
    display: grid;
    /* Preserve 6px column gaps and the original TARGET / TTI positions.
       Status occupies the former weapon area; weapon follows to its right. */
    grid-template-columns: 42px 50px 60px 34px minmax(0, 1fr) 58px;
    column-gap: 6px;
    align-items: center;
    min-height: 20px;
    line-height: 20px;
    white-space: nowrap;
  }
  .reserve-header {
    color: #668a9a;
    font-size: var(--font-micro);
    font-weight: 900;
    border-bottom: var(--hairline) solid rgba(255, 255, 255, .10);
    margin-bottom: 2px;
  }
  .reserve-row {
    color: #ffcf66;
    font-size: var(--font-small);
    font-weight: 800;
  }
  /* GUI reference threat red; only FIRE-committed waiting rows change color. */
  .reserve-row.reserve-waiting { color: #f81541; }
  .reserve-row > span,
  .reserve-header > span {
    min-width: 0;
    overflow: hidden;
    text-overflow: clip;
  }
  .reserve-row .reserve-tti,
  .reserve-header .reserve-tti {
    grid-column: 6;
    text-align: right;
  }
  .reserve-weapon { font-weight: 900; text-align:center; }
  .reserve-header .reserve-weapon { text-align:center; }
  .reserve-empty {
    min-height: 20px;
    line-height: 20px;
    color: #557480;
    font-size: var(--font-tiny);
    font-weight: 700;
  }

  #channelRows,
  #finalChannelRows {
    display: grid;
    grid-auto-rows: 22px;
    row-gap: 2px;
  }
  #finalChannelRows {
    box-sizing: border-box;
    align-self: stretch;
    padding-left: 8px;
    border-left: var(--hairline) dashed rgba(255, 255, 255, .72);
  }
  .channel-row {
    display: grid;
    /* Compact left HUD columns: ID → phase → ETA.
       Keep the two information gaps visually similar instead of reserving
       large empty fixed columns between short status labels. */
    grid-template-columns: 50px 62px 48px;
    column-gap: 5px;
    align-items: center;
    height: 22px;
    min-height: 22px;
    line-height: 22px;
    white-space: nowrap;
    overflow: hidden;
    font-size: var(--font-small);
    font-weight: 700;
  }
  .channel-row > span {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .channel-row .eta {
    text-align: left;
  }
  /* Reference warning-yellow, only normal CH labels eligible for CIWS. */
  .channel-ciws-priority-name { color: #F9EE65; }
  /* V OFF: only the two surviving close-defense priority CH names return to white. */
  .channel-close-defense-off-name { color: #FFFFFF; }
  .channel-ready { color: var(--ok); }
  .channel-pending { color: #ffcf66; }
  .channel-active { color: #66b9ff; }
  /* Match the existing close-defense coverage areas. Priority CH names remain yellow. */
  .channel-ram { color: #FFC767; }
  .channel-ciws-gun { color: #CFB1FF; }
  /* CH destruction: palette only; row grid, dimensions and FINAL rows stay unchanged. */
  .channel-row.channel-destroyed,
  .channel-row.channel-destroyed > span { color: #F81541; }

  .channel-fly {
    color: #ffffff;
  }
  .channel-lock {
    color: #58d6ff;
  }
  .final-channel-row {
    grid-template-columns: 56px 50px;
    column-gap: 4px;
  }

  .side-hud {
    
    min-width: 0;
    min-height: 0;
    
    
    
    
    
    border-top: 0;
    
  }

  

  

  

  .info-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
    align-content: center;
  }
  .info-block {
    min-width: 0;
  }
  .stacked-stat {
    min-width: 0;
  }
  .stacked-stat .stat-label {
    color: var(--muted);
    font-size: var(--font-tiny);
    font-weight: 700;
    line-height: 1.05;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .stacked-stat .stat-value {
    color: #f1fbff;
    font-size: var(--font-body);
    font-weight: 900;
    line-height: 1.15;
    white-space: nowrap;
  }



  
  
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  .time-scale-main {
    display: block;
    font-size: var(--font-body);
    font-weight: 900;
    line-height: 1;
  }
  .time-scale-steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 12px;
  }
  .speed-triangle {
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 9px solid currentColor;
    opacity: .24;
    filter: saturate(.58) brightness(.82);
  }
  .speed-triangle.level-1 { color: var(--warn); }
  .speed-triangle.level-2 { color: var(--enemy-orange-ui); }
  .speed-triangle.level-3 { color: var(--threat-red-hot); }
  .speed-triangle.active {
    opacity: 1;
    filter: none;
    text-shadow: 0 0 6px currentColor;
  }
  

  
  
  
  .battle-status-slot.clear {
    color: var(--ok);
  }
  
  

  .instructions {
    
    overflow: hidden;
    
    border-top: 0;
    
    
    
    padding: 2px 10px 3px;
    
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    align-content: center;
  }
  .instruction-row {
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    line-height: 14px;
  }
  .instruction-item {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }
  .instruction-item + .instruction-item::before {
    content: "|";
    color: #385968;
    margin-right: 8px;
  }
  .kbd {
    
    border: var(--hairline) solid #3b5664;
    border-bottom-width: var(--strong-line);
    padding: 0 4px;
    
    margin: 0 3px 0 0;
    line-height: 12px;
  }


  /* =====================================================================
     v67 GUI LAYER
     - Gameplay/state code remains authoritative.
     - These rules reorganize presentation only.
     - Font tokens remain the existing readability-aware tokens.
     ===================================================================== */

  :root {
    --game-main-height: 718px;
    --sidebar-width: 430px;

    /* Blue/Cyan structural palette */
    --cyan-structure: #218d94;
    --cyan-soft: #70deec;
    --cyan-glow: #0bdaf8;
    --cyan-peak: #0cfbf9;
    --cyan-peak-alt: #20f3f2;

    --line: #218d94;
    --text: #ddf7ff;
    --muted: #83b8c5;
    --warn: #ffcf66;
    --ok: #7df0a8;

    --friendly-white: #f4fcff;
    --enemy-orange-ui: #ff8a58;
    --threat-red-hot: #f81541;
  }

  .game-root {
    background: #051827;
    box-shadow:
      0 0 0 var(--hairline) rgba(37,195,203,.36);
  }

  .app {
    grid-template-rows:
      44px
      var(--game-main-height)
      76px
      34px;
    background:
      radial-gradient(circle at 46% 16%,
        rgba(11,218,248,.16) 0,
        rgba(25,56,226,.09) 26%,
        transparent 52%),
      radial-gradient(circle at 88% 8%,
        rgba(18,25,225,.25) 0,
        rgba(14,32,81,.12) 30%,
        transparent 54%),
      linear-gradient(180deg,
        #0e2051 0%,
        #082b47 22%,
        #06243d 58%,
        #051827 100%);
  }

  /* Layer 4 */
  .topbar {
    position: relative;
    transform: translateY(-4px);
    height: 44px;
    min-height: 44px;
    gap: 22px;
    padding: 0 14px 0 18px;
    border: var(--strong-line) solid rgba(11,218,248,.92);
    border-bottom-color: rgba(12,251,249,.98);
    border-radius: 0;
    background:
      linear-gradient(90deg,
        rgba(11,218,248,.05),
        transparent 12%,
        transparent 82%,
        rgba(18,25,225,.08)),
      linear-gradient(180deg,
        rgba(8,43,71,.97),
        rgba(5,26,45,.97));
    clip-path: none;
    box-shadow:
      inset 0 -8px 22px rgba(11,218,248,.05),
      inset 0 0 0 1px rgba(37,195,203,.17),
      0 0 8px rgba(11,218,248,.28),
      0 0 22px rgba(18,25,225,.18);
  }

  .topbar::before {
    content: "";
    width: 74px;
    height: 20px;
    flex: 0 0 74px;
    opacity: .86;
    background:
      linear-gradient(120deg,
        transparent 0 12%,
        rgba(11,218,248,.80) 12% 17%,
        transparent 17% 29%,
        rgba(25,56,226,.74) 29% 38%,
        transparent 38% 46%,
        rgba(11,218,248,.58) 46% 53%,
        transparent 53%);
    filter: drop-shadow(0 0 5px rgba(11,218,248,.18));
  }

  .brand {
    margin-left: -74px;
    padding-left: 98px;
    min-width: 390px;
    font-size: var(--font-brand);
    font-weight: 900;
    color: var(--friendly-white);
    text-shadow: 0 0 8px rgba(112,222,236,.16);
  }

  .stage-menu {
    height: 100%;
    gap: 18px;
    flex-wrap: nowrap;
    flex: 1 1 auto;
  }

  .stage-menu button {
    position: relative;
    height: 100%;
    padding: 0 5px;
    color: #8cb8c7;
    font-size: var(--font-body);
    font-weight: 800;
    border-bottom: 0;
  }

  .stage-menu button.active {
    color: var(--cyan-peak);
    border-bottom-color: transparent;
    text-shadow: 0 0 9px rgba(12,251,249,.58);
  }

  .stage-menu button.active::after {
    content: "";
    position: absolute;
    left: 5px;
    right: 5px;
    bottom: 2px;
    height: 2px;
    background: var(--cyan-glow);
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  .device-clock {
    margin-left: auto;
    padding-left: 16px;
    min-width: 144px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    border-left: 1px solid rgba(112,222,236,.24);
    color: #7cb3c5;
    font-size: var(--font-caption);
    white-space: nowrap;
  }

  .device-clock strong {
    color: var(--friendly-white);
    font-size: var(--font-body);
    letter-spacing: .05em;
  }

  /* Layer 3 */
  .main-layout {
    height: var(--game-main-height);
    grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
    column-gap: 10px;
  }

  .hud {
    height: var(--game-main-height);
    position: relative;
    border: var(--strong-line) solid rgba(11,218,248,.90);
    background:
      radial-gradient(circle at 54% 38%,
        rgba(32,243,242,.08),
        transparent 54%),
      radial-gradient(circle at 68% 24%,
        rgba(18,25,225,.13),
        transparent 42%),
      linear-gradient(180deg,
        rgba(14,32,81,.36),
        rgba(9,49,82,.92) 26%,
        rgba(7,38,66,.96));
    clip-path: none;
    box-shadow:
      inset 0 0 0 1px rgba(37,195,203,.20),
      inset 0 0 28px rgba(11,218,248,.045),
      0 0 8px rgba(11,218,248,.28),
      0 0 22px rgba(18,25,225,.16);
  }

  #game {
    background: #0a365a;
  }

  .battle-time {
    top: 39px;
    right: 12px;
    padding: 5px 8px;
    color: var(--friendly-white);
    border: 1px solid rgba(112,222,236,.46);
    background: rgba(3,22,38,.84);
    box-shadow: inset 0 0 10px rgba(11,218,248,.035);
    clip-path: none;
  }

  .battle-time .battle-time-label {
    color: #83b8c5;
  }

  .engagement-board-stack {
    top: 38px;
    left: 44px;
    gap: 6px;
  }

  .engagement-card {
    width: 312px;
    border: 2px solid rgba(37,195,203,.72);
    border-radius: 0;
    background:
      linear-gradient(90deg, rgba(11,218,248,.05), transparent 48%),
      linear-gradient(180deg, rgba(14,32,81,.38), rgba(8,40,61,.72) 34%, rgba(5,31,50,.79));
    box-shadow:
      inset 0 0 16px rgba(11,218,248,.04),
      inset 0 0 0 1px rgba(112,222,236,.07),
      0 0 7px rgba(11,218,248,.14);
    clip-path: none;
    overflow: visible;
  }


  .engagement-card-header {
    border-bottom: 1px solid rgba(112,222,236,.13);
    background: linear-gradient(90deg, rgba(25,56,226,.06), transparent 48%);
  }

  .engagement-toggle {
    color: #cbe9f1;
  }

  .engagement-toggle:hover,
  .engagement-toggle:focus-visible {
    color: var(--cyan-peak);
    background: rgba(11,218,248,.045);
  }

  #finalChannelRows {
    border-left-color: rgba(244,252,255,.58);
  }

  /* Right-side internal hierarchy stays inside Layer 3. */
  .side-hud {
    width: var(--sidebar-width);
    height: var(--game-main-height);
    display: grid;
    grid-template-rows:
      190px
      8px
      66px
      8px
      132px
      8px
      306px;
    overflow: visible;
    border: 0;
    background: transparent;
    --ui-guide-left: 16px;
    --ui-guide-right: 16px;

    /* Visible alignment guides derived from the radar ㄱ decoration.
       Keep the radar decoration itself unchanged; other right-side modules
       align their visible edges to these guides. */
    --ui-visual-guide-left: 28px;
    --ui-visual-guide-right: 28px;
    --ui-guide-header-left: 26px;
    --ui-guide-header-right: 28px;
  }

  .right-gap {
    min-width: 0;
    min-height: 0;
  }

  /* All four Layer-3 right panels use one shared frame and glow structure. */
  .hud-card-shell {
    min-width: 0;
    min-height: 0;
    filter:
      drop-shadow(0 0 7px rgba(11,218,248,.24))
      drop-shadow(0 0 18px rgba(18,25,225,.14));
  }

  .hud-card {
    width: 100%;
    height: 100%;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(18,25,225,.13), transparent 42%),
      linear-gradient(180deg, rgba(14,32,81,.45), rgba(8,40,61,.72) 32%, rgba(5,31,50,.79));
    border: 2px solid rgba(11,218,248,.90);
    box-shadow:
      inset 0 0 0 1px rgba(37,195,203,.18),
      inset 0 0 22px rgba(11,218,248,.045);
    clip-path: polygon(
      9px 0,
      calc(100% - 9px) 0,
      100% 9px,
      100% calc(100% - 9px),
      calc(100% - 9px) 100%,
      9px 100%,
      0 calc(100% - 9px),
      0 9px
    );
  }

  .hud-card::before {
    content: "";
    position: absolute;
    inset: 4px;
    pointer-events: none;
    z-index: 10;
    border: 1px solid rgba(37,195,203,.20);
  }

  .hud-card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 11;
    background:
      linear-gradient(90deg, rgba(12,251,249,.96) 0 34px, transparent 34px) left top / 68px 2px no-repeat,
      linear-gradient(180deg, rgba(12,251,249,.96) 0 24px, transparent 24px) left top / 2px 48px no-repeat,
      linear-gradient(270deg, rgba(12,251,249,.96) 0 28px, transparent 28px) right bottom / 56px 2px no-repeat;
    filter: drop-shadow(0 0 4px rgba(12,251,249,.36));
  }

  .card-header {
    position: relative;
    z-index: 5;
    height: 38px;
    min-height: 38px;
    padding: 0 var(--ui-guide-header-right) 0 var(--ui-guide-header-left);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(112,222,236,.16);
    background: linear-gradient(90deg, rgba(11,218,248,.04), transparent 52%);
    color: var(--friendly-white);
    font-size: var(--font-body);
    font-weight: 900;
  }

  .card-header-title {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .header-glyph {
    width: 11px;
    height: 11px;
    position: relative;
    flex: 0 0 11px;
  }

  .header-glyph::before,
  .header-glyph::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    background: var(--cyan-peak);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 7px rgba(12,251,249,.52);
  }

  .header-glyph::before { width: 9px; height: 1px; }
  .header-glyph::after { width: 1px; height: 9px; }

  /* Communication Log — A안.
     The title has its own thin fixed header; the content area never grows the
     parent Layer-3 height. Placeholder text only: no gameplay dialogue state is invented. */
  .dialogue-card {
    padding: 0;
    display: grid;
    grid-template-rows: 38px minmax(0, 1fr);
  }

  .communication-header {
    height: 38px;
    min-height: 38px;
    padding: 0 var(--ui-guide-header-right) 0 var(--ui-guide-header-left);
    font-size: var(--font-small);
  }

  .dialogue-box {
    min-width: 0;
    min-height: 0;
    /* The title row gains 8px; reduce only this vertical margin by 8px so
       the portrait/dialogue content height does not change. */
    margin: 3px var(--ui-guide-right) 6px var(--ui-guide-left);
    display: grid;
    grid-template-columns: 136px minmax(0, 1fr);
    column-gap: 12px;
    align-items: center;
    border: 0;
    background:
      linear-gradient(90deg, rgba(18,25,225,.055), transparent 42%),
      rgba(5,31,50,.16);
    box-shadow: none;
    /* With the unchanged 16px outer margin, 11px inner padding places
       the portrait left edge and dialogue-panel right edge on the radar ㄱ guides. */
    padding: 8px 11px;
  }

  /* Circular portrait — reference-driven optical device.
     v91 rebuilds the portrait visual from scratch while preserving only the
     established dialogue-grid position and overall portrait footprint. */
  .character-face {
    position: relative;
    height: calc(100% + 6px);
    aspect-ratio: 1 / 1;
    width: auto;
    max-width: 100%;    justify-self: start;
    align-self: center;
    margin-block: -3px;
    box-sizing: border-box;
    border: 0;
    border-radius: 50%;
    padding: 0;
    background: transparent;
    box-shadow: none;
    overflow: visible;
  }

  .portrait-device {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    pointer-events: none;
  }






  .portrait-device .diagline,
  .portrait-device .kinkline {
    fill: none;
    stroke: #c6d2d1;
    stroke-width: .68;
    opacity: .82;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .portrait-device .platefill {
    opacity: .86;
  }

  .portrait-device .plategloss-bright {
    opacity: .065;
  }

  .portrait-device .plategloss-dark {
    opacity: .048;
  }

  .portrait-content {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 59.5%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    box-shadow: none;
    overflow: hidden;
    color: #f0feff;
    font-size: var(--font-small);
    font-weight: 800;
    letter-spacing: .02em;
    text-shadow:
      0 0 3px rgba(216,249,253,.44),
      0 0 7px rgba(74,191,220,.16);
  }

  /* The weak pale outline belongs only to the dialogue region. */
  .dialogue-text-panel {
    min-width: 0;
    height: 100%;
    box-sizing: border-box;
    border: 1px solid rgba(221,247,255,.16);
    background:
      linear-gradient(180deg, rgba(11,218,248,.018), transparent 42%),
      rgba(4,25,43,.16);
    clip-path: none;
  }

  .dialogue-text {
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    box-sizing: border-box;
    padding: 11px 10px 8px;
    color: var(--text);
    font-size: var(--font-body);
    font-weight: 800;
    line-height: 1.55;
    letter-spacing: .03em;
    text-align: left;
  }

  .weapon-card {
    padding: 4px var(--ui-visual-guide-right) 4px var(--ui-visual-guide-left);
    display: flex;
    align-items: center;
  }

  .weapon-strip {
    width: 100%;
    height: 100%;
    display: grid;
    /* 70 + (42 × 6) + (8 × 6) = 370px: exactly the width between
       the two radar ㄱ visual guides inside the current 430px sidebar. */
    grid-template-columns: 70px repeat(6, 42px);
    gap: 8px;
    align-items: center;
    justify-content: start;
  }

  .tap-key {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid rgba(112,222,236,.56);
    background: linear-gradient(180deg, rgba(12,64,92,.76), rgba(5,34,56,.76));
    color: var(--friendly-white);
    font-size: var(--font-small);
    font-weight: 900;
    letter-spacing: .08em;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }

  .tap-switch-icon {
    position: relative;
    width: 15px;
    height: 13px;
    flex: 0 0 15px;
    opacity: .88;
    filter: drop-shadow(0 0 3px rgba(11,218,248,.22));
  }

  .tap-switch-icon::before,
  .tap-switch-icon::after {
    content: "";
    position: absolute;
    left: 1px;
    width: 11px;
    height: 4px;
    border-color: var(--cyan-soft);
    border-style: solid;
  }

  .tap-switch-icon::before {
    top: 1px;
    border-width: 1px 1px 0 0;
    transform: skewX(18deg);
  }

  .tap-switch-icon::after {
    right: 1px;
    left: auto;
    bottom: 1px;
    border-width: 0 0 1px 1px;
    transform: skewX(18deg);
  }

  .tap-switch-icon .arrow-top,
  .tap-switch-icon .arrow-bottom {
    position: absolute;
    width: 0;
    height: 0;
  }

  .tap-switch-icon .arrow-top {
    right: 0;
    top: -1px;
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;
    border-left: 5px solid var(--cyan-soft);
  }

  .tap-switch-icon .arrow-bottom {
    left: 0;
    bottom: -1px;
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;
    border-right: 5px solid var(--cyan-soft);
  }

  .weapon-slot {
    width: 42px;
    height: 46px;
    border: 1px solid rgba(37,195,203,.50);
    background:
      radial-gradient(circle at 50% 45%, rgba(11,218,248,.045), transparent 62%),
      rgba(5,31,50,.54);
    box-shadow: inset 0 0 0 1px rgba(112,222,236,.05);
    clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  }

  .weapon-choice {
    color: var(--friendly-white);
    font-size: var(--font-small);
    font-weight: 900;
    cursor: pointer;
    text-align: center;
  }
  .weapon-choice:focus-visible {
    outline: 1px solid var(--cyan-peak);
    outline-offset: -3px;
  }
  .weapon-choice.selected {
    border-color: var(--cyan-peak);
    color: var(--cyan-peak);
    background: linear-gradient(180deg, rgba(12,64,92,.9), rgba(5,34,56,.9));
    box-shadow: inset 0 0 0 1px rgba(112,222,236,.20), 0 0 8px rgba(11,218,248,.16);
  }
  .battle-status-slot {
    color: var(--friendly-white);
    font-size: var(--font-small);
    font-weight: 900;
    line-height: 1;
    letter-spacing: .03em;
    min-width: 122px;
    text-align: right;
    display: inline-block;
  }

  /* BATTLE MODE shares the same right-alignment line as the first-column
     values (선택된 목표 / 탐지 목표), rather than the card's outer right edge. */
  .current-status-card .battle-status-slot {
    position: absolute;
    top: 50%;
    right: calc(50% + 9px);
    transform: translateY(-50%);
    min-width: 0;
    width: auto;
  }

  .current-status-card .info-grid {
    height: calc(100% - 38px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 0 18px;
    padding: 12px var(--ui-visual-guide-right) 10px var(--ui-visual-guide-left);
    align-content: stretch;
  }

  .current-status-card .stacked-stat {
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    align-items: center;
    padding-left: 11px;
    border-left: 2px solid rgba(11,218,248,.78);
    border-bottom: 1px solid rgba(112,222,236,.09);
  }

  .current-status-card .stacked-stat:nth-child(3),
  .current-status-card .stacked-stat:nth-child(4) {
    border-bottom: 0;
  }

  .current-status-card .stacked-stat .stat-label {
    margin: 0;
    color: #8fbac7;
    font-size: var(--font-tiny);
    font-weight: 800;
  }

  .current-status-card .stacked-stat .stat-value {
    color: var(--friendly-white);
    font-size: var(--font-body);
    font-weight: 900;
  }

  /* Radar card: decorative layers are separate from the live game minimap canvas. */
  .sweep-badge {
    color: #8effaa;
    background: rgba(0,25,12,.78);
    border: 1px solid rgba(84,242,138,.60);
    padding: 3px 6px;
    font-size: var(--font-micro);
    font-weight: 900;
    line-height: 1;
    box-shadow: inset 0 0 8px rgba(16,224,94,.05);
  }

  .radar-tech-decoration {
    position: absolute;
    left: var(--ui-guide-left);
    top: 31.5px;
    width: calc(100% - (var(--ui-guide-left) + var(--ui-guide-right)));
    height: calc(100% - 39.5px);
    z-index: 2;
    pointer-events: none;
    overflow: visible;
  }

  .radar-tech-decoration .glow {
    fill: none;
    stroke: rgba(18,25,225,.70);
    stroke-width: 4;
    vector-effect: non-scaling-stroke;
    filter: blur(4px);
    opacity: .58;
  }

  .radar-tech-decoration .core {
    fill: none;
    stroke: rgba(11,218,248,.76);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 3px rgba(12,251,249,.26));
  }

  .radar-tech-decoration .fine {
    fill: none;
    stroke: rgba(37,195,203,.40);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  .radar-stage {
    position: relative;
    height: calc(100% - 38px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    padding: 1px var(--ui-guide-right) 0 var(--ui-guide-left);
    box-sizing: border-box;
  }

  /* One explicit radar master coordinate space.
     Every circular layer is positioned from this same 207×207 box. */
  .minimap-shell {
    width: 207px;
    height: 207px;
    flex: 0 0 207px;
    position: relative;
    overflow: visible;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    transform: scale(.93);
    transform-origin: 50% 0;
  }

  #minimap {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 187px;
    height: 187px;
    display: block;
    border-radius: 50%;
  }

  .radar-scale-overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 207px;
    height: 207px;
    z-index: 6;
    pointer-events: none;
    overflow: visible;
  }

  .radar-scale-overlay .axis-main {
    stroke: rgba(80,206,238,.40);
    stroke-width: .88;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 2px rgba(11,218,248,.16));
  }

  .radar-scale-overlay .axis-secondary {
    stroke: rgba(68,193,232,.27);
    stroke-width: .78;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 1.6px rgba(25,56,226,.14));
  }

  .radar-scale-overlay .tick-minor {
    stroke: rgba(244,252,255,.76);
    stroke-width: .78;
    stroke-linecap: butt;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 1.2px rgba(112,222,236,.14));
  }

  .radar-scale-overlay .tick-medium {
    stroke: rgba(244,252,255,.90);
    stroke-width: .94;
    stroke-linecap: butt;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 1.5px rgba(112,222,236,.17));
  }

  .radar-scale-overlay .tick-major {
    stroke: rgba(244,252,255,.98);
    stroke-width: 1.10;
    stroke-linecap: butt;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 1.8px rgba(112,222,236,.20));
  }

  .radar-scale-overlay .azimuth-label {
    fill: rgba(244,252,255,.96);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Malgun Gothic", monospace;
    font-size: var(--font-tiny);
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: middle;
    paint-order: stroke fill;
    stroke: rgba(0,0,0,.42);
    stroke-width: .55;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 2px rgba(112,222,236,.18));
  }

  .radar-bezel {
    position: absolute;
    z-index: 5;
    left: 11px;
    top: 11px;
    width: 185px;
    height: 185px;
    border-radius: 50%;
    border: 2px solid rgba(11,218,248,.90);
    box-shadow:
      0 0 8px rgba(11,218,248,.44),
      0 0 16px rgba(18,25,225,.31),
      inset 0 0 0 1px rgba(112,222,236,.14);
    pointer-events: none;
  }

  .radar-bezel::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(37,195,203,.40);
    box-shadow: inset 0 0 8px rgba(11,218,248,.06);
  }

  .radar-bezel::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1px solid rgba(25,56,226,.28);
  }

  /* Layer 2: keep one horizontal row even if more controls are added later. */
  .bottom-controls {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-auto-flow: column;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-columns: minmax(0,1fr);
    gap: 10px;
    padding: 8px 0 6px;
    overflow: hidden;
  }

  .bottom-controls .control-btn {
    width: 100%;
    min-width: 0;
    min-height: 62px;
    height: 62px;
    position: relative;
    border: 2px solid #13cbe8;
    border-radius: 0;
    color: #f3f6f7;
    background:
      linear-gradient(90deg, rgba(32,243,242,.045), transparent 48%),
      linear-gradient(180deg, #082d49, #062238);
    font: inherit;
    font-size: var(--font-body);
    font-weight: 900;
    letter-spacing: .02em;
    padding: 7px 12px;
    cursor: pointer;
    text-align: center;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    box-shadow:
      inset 0 0 14px rgba(32,243,242,.035),
      inset 0 0 0 1px rgba(37,195,203,.10),
      0 0 7px rgba(19,203,232,.14),
      0 0 16px rgba(18,25,225,.08);
  }

  .bottom-controls .control-btn:disabled {
    cursor: not-allowed;
  }

  /* Q/A can be unavailable without a prohibition cursor. Preserve disabled logic. */
  .bottom-controls #fireBtn:disabled,
  .bottom-controls #readyBtn:disabled,
  .bottom-controls #ciwsAutoBtn:disabled {
    cursor: default;
  }

  .bottom-controls .control-btn:hover:not(:disabled) {
    border-color: #20f3f2;
    color: #ffffff;
  }

  /* FIRE keeps one red visual family in every state.
     AUTO FIRE ON uses the same high-emphasis treatment as a pressed FIRE button. */
  .bottom-controls .control-btn.fire {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-color: #d2344f;
    color: #f29aa4;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(183,42,67,.22) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #3a101a, #240a12);
    box-shadow:
      inset 0 0 14px rgba(248,21,65,.045),
      inset 0 0 0 1px rgba(183,42,67,.10),
      0 0 6px rgba(248,21,65,.10);
  }

  .bottom-controls .control-btn.fire .fire-main {
    display: block;
    line-height: 1.05;
  }

  .bottom-controls .control-btn.fire .fire-auto-mode {
    display: block;
    color: rgba(242,154,164,.90);
    font-size: var(--font-tiny);
    font-weight: 900;
    letter-spacing: .04em;
    line-height: 1;
  }

  .bottom-controls .control-btn.fire .fire-cooldown {
    display: block;
    color: rgba(217,139,148,.72);
    font-size: var(--font-micro);
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1;
  }

  .bottom-controls .control-btn.fire:disabled {
    opacity: 1;
    border-color: #b72a43;
    color: #d98b94;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(142,38,58,.18) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #35141e, #220c14);
    box-shadow:
      inset 0 0 12px rgba(183,42,67,.035),
      inset 0 0 0 1px rgba(142,38,58,.08),
      0 0 4px rgba(183,42,67,.07);
  }

  .bottom-controls .control-btn.fire:disabled .fire-auto-mode {
    color: rgba(217,139,148,.82);
  }

  .bottom-controls .control-btn.fire:disabled .fire-cooldown {
    color: rgba(217,139,148,.62);
  }

  .bottom-controls .control-btn.fire:hover:not(:disabled) {
    border-color: #ff3152;
    color: #ffc0c7;
  }

  .bottom-controls .control-btn.fire:active,
  .bottom-controls .control-btn.fire.auto-fire-on {
    opacity: 1;
    border-color: #f81541;
    color: #ffc0c7;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(248,21,65,.32) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #4a121f, #2b0913);
    box-shadow:
      inset 0 0 16px rgba(248,21,65,.11),
      inset 0 0 0 1px rgba(255,49,82,.14),
      0 0 8px rgba(248,21,65,.24),
      0 0 16px rgba(248,21,65,.10);
  }

  .bottom-controls .control-btn.fire.auto-fire-on .fire-auto-mode,
  .bottom-controls .control-btn.fire:active .fire-auto-mode {
    color: #ffc0c7;
  }

  .bottom-controls .control-btn.fire.auto-fire-on .fire-cooldown,
  .bottom-controls .control-btn.fire:active .fire-cooldown {
    color: rgba(255,192,199,.80);
  }

  .bottom-controls .control-btn.fire.auto-fire-on:hover:not(:disabled) {
    border-color: #ff3152;
    color: #ffd0d5;
  }

  .bottom-controls .control-btn.fire.auto-fire-on:disabled {
    opacity: 1;
  }

  .bottom-controls .control-btn.time-scale {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-color: #c99e32;
    color: #f2d77f;
    background:
      linear-gradient(90deg, rgba(242,215,127,.035), transparent 48%),
      linear-gradient(180deg, #342a11, #211a0c);
    box-shadow:
      inset 0 0 14px rgba(230,187,82,.035),
      inset 0 0 0 1px rgba(201,158,50,.10),
      0 0 6px rgba(201,158,50,.10);
  }

  .bottom-controls .control-btn.time-scale:hover:not(:disabled) {
    border-color: #e6bb52;
    color: #ffe7a0;
  }

  /* READY uses the time-scale yellow palette with FIRE's lower hatch motif. */
  .bottom-controls .control-btn.ready {
    display: flex;
    align-items: center;
    justify-content: center;
    border-color: #c99e32;
    color: #f2d77f;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(201,158,50,.22) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #342a11, #211a0c);
    box-shadow:
      inset 0 0 14px rgba(230,187,82,.035),
      inset 0 0 0 1px rgba(201,158,50,.10),
      0 0 6px rgba(201,158,50,.10);
  }

  .bottom-controls .control-btn.ready:disabled {
    opacity: 1;
    border-color: #9c7d34;
    color: #b6a068;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(156,125,52,.18) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #302813, #201a0f);
  }

  .bottom-controls .control-btn.ready:hover:not(:disabled),
  .bottom-controls .control-btn.ready:active {
    border-color: #e6bb52;
    color: #ffe7a0;
  }

  /* Same muted yellow family as READY:disabled, but V must remain clickable. */
  .bottom-controls #ciwsAutoBtn.is-off,
  .bottom-controls #ciwsAutoBtn.is-off:hover:not(:disabled),
  .bottom-controls #ciwsAutoBtn.is-off:active {
    border-color: #9c7d34;
    color: #b6a068;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(156,125,52,.18) 0 2px,
        transparent 2px 9px
      ) left bottom / 100% 11px no-repeat,
      linear-gradient(180deg, #302813, #201a0f);
  }

  

  /* Binary state controls stay in the blue/cyan family, but active/inactive
     states must be readable at a glance just like FIRE's red state family. */
  .bottom-controls .control-btn.state-toggle {
    border-color: #145d65;
    color: #9bc1cd;
    background:
      linear-gradient(90deg, rgba(37,195,203,.022), transparent 48%),
      linear-gradient(180deg, #09283f, #061d30);
    box-shadow:
      inset 0 0 10px rgba(37,195,203,.02),
      inset 0 0 0 1px rgba(33,141,148,.08),
      0 0 4px rgba(20,93,101,.08);
  }

  .bottom-controls .control-btn.state-toggle.is-active {
    border-color: var(--cyan-peak-alt);
    color: var(--friendly-white);
    background:
      linear-gradient(90deg, rgba(32,243,242,.10), transparent 52%),
      linear-gradient(180deg, #0b3b58, #06273e);

      inset 0 0 16px rgba(32,243,242,.08),

                stroke="#25C3CB" stroke-width="4.5"></circle>
        <circle id="pointerMpRing" class="resource-ring-value" cx="36" cy="36" r="29"
                stroke="#25C3CB" stroke-width="4.5"
                transform="rotate(-90 36 36)"></circle>
        <circle class="resource-ring-track" cx="36" cy="36" r="20"
                stroke="#10E05E" stroke-width="4.5"></circle>
        <circle id="pointerHpRing" class="resource-ring-value" cx="36" cy="36" r="20"

</div>
<script>
(() => {
  "use strict";

  // v89: aligns the right-side UI to the tactical-radar ㄱ visual guides, aligns BATTLE MODE with the first status-value column, and unifies card-title vertical spacing.
  // Interceptor remaining-distance UI still uses the project scale (10 game units = 1 km) with one decimal place.
  const FIXED_VIEWPORT = Object.freeze({
    width: 1600,
    height: 900,
  });

  const FONT_SCALE_SPECS = Object.freeze({
    "--font-micro":   { base: 8,  minPhysical: 7 },
    "--font-tiny":    { base: 9,  minPhysical: 8 },
    "--font-caption": { base: 10, minPhysical: 8 },
    "--font-small":   { base: 11, minPhysical: 9 },
    "--font-body":    { base: 12, minPhysical: 9 },
    "--font-brand":   { base: 16, minPhysical: 11 },
  });

  class ViewportLayoutController {
    constructor(shell, gameRoot, designSize) {
      this.shell = shell;
      this.gameRoot = gameRoot;
      this.designSize = designSize;

      this.lastViewportWidth = -1;
      this.lastViewportHeight = -1;
      this.pendingResizeFrame = null;
      this.listeners = new Set();

      this.handleResize = this.handleResize.bind(this);
    }

    static calculateScale(viewportWidth, viewportHeight, designSize) {
      return Math.min(
        1,
        viewportWidth / designSize.width,
        viewportHeight / designSize.height
      );
    }

    addLayoutListener(listener) {
      this.listeners.add(listener);
      return () => this.listeners.delete(listener);
    }

    applyReadabilityTokens(scale) {
      for (const [name, spec] of Object.entries(FONT_SCALE_SPECS)) {
        const logicalFontSize = Math.max(
          spec.base,
          spec.minPhysical / Math.max(scale, 1e-6)
        );

        this.gameRoot.style.setProperty(
          name,
          `${logicalFontSize.toFixed(3)}px`
        );
      }

      const hairlineLogical =
        Math.max(1, 1 / Math.max(scale, 1e-6));
      const strongLogical =
        Math.max(2, 2 / Math.max(scale, 1e-6));

      this.gameRoot.style.setProperty(
        "--hairline",
        `${hairlineLogical.toFixed(3)}px`
      );
      this.gameRoot.style.setProperty(
        "--strong-line",
        `${strongLogical.toFixed(3)}px`
      );
    }

    applyLayout(force=false) {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      if (
        !force &&
        viewportWidth === this.lastViewportWidth &&
        viewportHeight === this.lastViewportHeight
      ) {
        return;
      }

      const scale = ViewportLayoutController.calculateScale(
        viewportWidth,
        viewportHeight,
        this.designSize
      );

      this.lastViewportWidth = viewportWidth;
      this.lastViewportHeight = viewportHeight;

      this.gameRoot.style.setProperty(
        "--ui-scale",
        scale.toFixed(6)
      );
      this.applyReadabilityTokens(scale);

      const layout = Object.freeze({
        scale,
        viewportWidth,
        viewportHeight,
        displayWidth: this.designSize.width * scale,
        displayHeight: this.designSize.height * scale,
        devicePixelRatio:
          Math.max(1, window.devicePixelRatio || 1),
      });

      for (const listener of this.listeners) {
        listener(layout);
      }
    }

    handleResize() {
      if (this.pendingResizeFrame !== null) return;

      this.pendingResizeFrame = requestAnimationFrame(() => {
        this.pendingResizeFrame = null;
        this.applyLayout();
      });
    }

    attach() {
      window.addEventListener(
        "resize",
        this.handleResize,
        { passive: true }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          this.handleResize,
          { passive: true }
        );
      }
    }
  }

  const viewportShell = document.getElementById("viewportShell");
  const gameRoot = document.getElementById("gameRoot");
  const pointerDefenseRings = document.getElementById("pointerDefenseRings");
  const pointerMpRing = document.getElementById("pointerMpRing");
  const pointerHpRing = document.getElementById("pointerHpRing");
  const canvas = document.getElementById("game");
  const minimapCanvas = document.getElementById("minimap");

  class HiDPICanvasSurface {
    constructor(canvasElement) {
      this.canvas = canvasElement;
      this.logicalWidth = 1;
      this.logicalHeight = 1;
      this.pixelScaleX = 1;
      this.pixelScaleY = 1;
    }

    initializeLogicalSize() {
      this.logicalWidth =
        Math.max(1, this.canvas.clientWidth);
      this.logicalHeight =
        Math.max(1, this.canvas.clientHeight);
    }

    resizeBackingStore(layout) {
      const rect = this.canvas.getBoundingClientRect();
      const dpr = layout.devicePixelRatio;

      const backingWidth = Math.max(
        1,
        Math.round(rect.width * dpr)
      );
      const backingHeight = Math.max(
        1,
        Math.round(rect.height * dpr)
      );

      if (
        this.canvas.width !== backingWidth ||
        this.canvas.height !== backingHeight
      ) {
        this.canvas.width = backingWidth;
        this.canvas.height = backingHeight;
      }

      this.pixelScaleX =
        backingWidth / this.logicalWidth;
      this.pixelScaleY =
        backingHeight / this.logicalHeight;
    }

    setScreenTransform(context) {
      context.setTransform(
        this.pixelScaleX, 0,
        0, this.pixelScaleY,
        0, 0
      );
    }

    setWorldTransform(context, zoom, offset) {
      context.setTransform(
        this.pixelScaleX * zoom, 0,
        0, this.pixelScaleY * zoom,
        this.pixelScaleX * offset.x,
        this.pixelScaleY * offset.y
      );
    }
  }

  const tacticalSurface = new HiDPICanvasSurface(canvas);
  const minimapSurface = new HiDPICanvasSurface(minimapCanvas);

  // Capture stable design-layout coordinates before down-scaling.
  tacticalSurface.initializeLogicalSize();
  minimapSurface.initializeLogicalSize();

  const viewportController = new ViewportLayoutController(
    viewportShell,
    gameRoot,
    FIXED_VIEWPORT
  );

  viewportController.addLayoutListener((layout) => {
    tacticalSurface.resizeBackingStore(layout);
    minimapSurface.resizeBackingStore(layout);
  });

  // One initial pass. After that, only resize events update layout/backing.
  viewportController.applyLayout(true);
  viewportController.attach();

  const ctx = canvas.getContext("2d");
  const minimapCtx = minimapCanvas.getContext("2d");
  const selectedEl = document.getElementById("selected");
  const interceptFailuresEl = document.getElementById("interceptFailures");
  const detectionTargetsEl = document.getElementById("detectionTargets");
  const trackingTargetsEl = document.getElementById("trackingTargets");
  const battleTimeEl = document.getElementById("battleTime");
  const minimapNextUpdateEl = document.getElementById("minimapNextUpdate");
  const battleStatusSlotEl = document.getElementById("battleStatusSlot");
  const fireBtn = document.getElementById("fireBtn");
  const readyBtn = document.getElementById("readyBtn");
  const ciwsAutoBtn = document.getElementById("ciwsAutoBtn");
  const fireAutoModeLabel = document.getElementById("fireAutoModeLabel");
  const fireCooldownLabel = document.getElementById("fireCooldownLabel");
  const restartBtn = document.getElementById("restartBtn");
  const soundBtn = document.getElementById("soundBtn");
  const soundLabelEl = document.getElementById("soundLabel");
  const deviceClockEl = document.getElementById("deviceClockValue");
  const radarScaleOverlayEl = document.getElementById("radarScaleOverlay");
  const radarAxisLinesEl = document.getElementById("radarAxisLines");
  const radarTickLinesEl = document.getElementById("radarTickLines");
  const radarAzimuthLabelsEl = document.getElementById("radarAzimuthLabels");
  const timeScaleBtn = document.getElementById("timeScaleBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const timeScaleLabel = document.getElementById("timeScaleLabel");
  const timeScaleTriangles = [...document.querySelectorAll(".speed-triangle")];
  const channelRowsEl = document.getElementById("channelRows");
  const finalChannelRowsEl = document.getElementById("finalChannelRows");
  const reserveRowsEl = document.getElementById("reserveRows");
  const currentEngagementToggleEl = document.getElementById("currentEngagementToggle");
  const currentEngagementBodyEl = document.getElementById("currentEngagementBody");
  const reserveQueueToggleEl = document.getElementById("reserveQueueToggle");
  const reserveQueueBodyEl = document.getElementById("reserveQueueBody");
  const stageButtons = [...document.querySelectorAll(".stage-menu button[data-stage]")];
  const instructionsEl = document.getElementById("instructions");

  const W = tacticalSurface.logicalWidth;
  const H = tacticalSurface.logicalHeight;
  const FIXED_DT = 1 / 120;
  // MP regeneration and retries after an actual MP shortage share the 2-s clock.
  // Normal, already-funded launch attempts retain each weapon's own cadence.
  const COMBAT_MP_CYCLE_TICKS = 240;
  const MAX_FRAME_DT = 0.05;

  // W-button labels remain 1x / 2x / 4x. Only 2x boosts missile motion
  // without accelerating world time; 4x reuses the original full 4x loop.
  const TIME_SCALE_STEPS = Object.freeze([1, 2, 4]);
  const SIMULATION_TIME_MULTIPLIERS = Object.freeze([1, 1, 4]);
  const MISSILE_MOTION_MULTIPLIERS = Object.freeze([1, 2, 1]);

  // One shared class of normal-stage speeds, including STAGE 06.
  // STAGE EX intentionally retains a separate stress-test speed profile.
  const ENEMY_SPEED_SLOW = 40;
  const ENEMY_SPEED_NORMAL = 55;
  const ENEMY_SPEED_FAST = 75;

  // Sequential interceptor launch timing.
  // Two missiles form one launch burst. Missiles inside a burst are
  // separated by 0.2 s; the next burst starts 0.6 s after the second shot.
  const SEQUENTIAL_LAUNCH_BURST_SIZE = 2;
  const SEQUENTIAL_LAUNCH_INTRA_BURST_DELAY = 0.2;
  const SEQUENTIAL_LAUNCH_INTER_BURST_GAP = 0.6;

  // Reservation Queue: at most four targets may wait outside normal CH.
  const RESERVATION_QUEUE_WAITING_LIMIT = 4;
  const CIWS_PRIORITY_CHANNEL_COUNT = 2;
  // D-07 missile subsystem; the gun subsystem is not activated by this build.
  const SHORT_RANGE_MISSILE_OWNER = "SHORT_RANGE_MISSILE";
  const SHORT_RANGE_MISSILE_ENGAGEMENT_RADIUS = 1200;
  const SHORT_RANGE_MISSILE_LAUNCH_DELAY = 1.0;
  const SHORT_RANGE_MISSILE_PK_DISTANCE_FLOOR = 600;
  // A shared *physical launch* clock for M4 and automatic RAM only.
  const SHORT_RANGE_SHARED_LAUNCH_INTERVAL = 0.5;
  const CIWS_GUN_OWNER = "CIWS_GUN";
  const CIWS_GUN_BURST_SECONDS = 1.5;
  const CIWS_GUN_REPEAT_DELAY_SECONDS = 0.4;
  const CIWS_GUN_RETARGET_SECONDS = 1.0;
  const CIWS_GUN_PK_TICK_SECONDS = 0.25;
  const CIWS_GUN_PK_REFERENCE_SECONDS = 2.0;
  const CIWS_GUN_PK_REFERENCE_PROBABILITY = 0.15;

  // Display identifiers deliberately use different symbol families:
  // reservation order = numeric, normal CH = Latin letters, FINAL CH = Greek.
  const FINAL_CHANNEL_DISPLAY_SYMBOLS = Object.freeze([
    "α", "β", "γ", "δ", "ε", "ζ", "η", "θ"
  ]);

  function alphabeticChannelCode(oneBasedIndex) {
    let n = Math.max(1, Math.floor(oneBasedIndex));
    let result = "";
    while (n > 0) {
      n -= 1;
      result = String.fromCharCode(65 + (n % 26)) + result;
      n = Math.floor(n / 26);
    }
    return result;
  }

  function normalChannelDisplayId(channelId) {
    const index = Number(String(channelId).split("-")[1]);
    return Number.isFinite(index)
      ? `CH-${alphabeticChannelCode(index)}`
      : String(channelId);
  }

  function normalChannelShortCode(channelId) {
    const index = Number(String(channelId).split("-")[1]);
    return Number.isFinite(index)
      ? alphabeticChannelCode(index)
      : "?";
  }

  // The final two normal-stage channels are eligible for CIWS priority.
  // Compute from the current Stage count so later CH increases need no ID edits.
  function ciwsPriorityChannelIds(stageSpec, world) {
    if (stageSpec.exAutoSimulation) return [];
    return getOperationalChannelIds(world,stageSpec)
      .slice(-CIWS_PRIORITY_CHANNEL_COUNT);
  }

  function finalChannelDisplayId(channelId) {
    const index = Number(String(channelId).split("-").at(-1));
    const symbol = FINAL_CHANNEL_DISPLAY_SYMBOLS[index - 1] ?? String(index);
    return `FINAL-${symbol}`;
  }

  function finalChannelShortCode(channelId) {
    const index = Number(String(channelId).split("-").at(-1));
    return FINAL_CHANNEL_DISPLAY_SYMBOLS[index - 1] ?? String(index);
  }

  // Simulation/world coordinates are independent from the wider render surface.
  // This preserves the established own-ship/world center.
  const WORLD_CENTER = Object.freeze({ x: 480, y: 270 });

  // Presentation camera only.
  // cameraCenter is a WORLD coordinate and remains the own-ship/world center.
  // Its SCREEN anchor is the center of the usable tactical PLOT AREA, not the
  // full canvas: the coordinate header/gutter introduced in v64 are excluded.
  // This keeps F/default view visually centered and prevents the top radar ring
  // from being hidden underneath the coordinate header.
  // Mouse-wheel zoom changes presentation only; gameplay coordinates/ranges stay fixed.
  const DEFAULT_CAMERA_CENTER = Object.freeze({ x: 480, y: 270 });
  // Presentation default is derived from the current tactical PLOT AREA.
  // Definition: the complete 5000-unit detection circle must be visible.
  // A 10px safety margin per side reproduces the old v66 framing intent
  // without making a hard-coded zoom number the source of truth.
  const OVERVIEW_RADAR_MARGIN_PX = 10;
  const FALLBACK_CAMERA_ZOOM = 0.0670;
  const MAX_CAMERA_ZOOM = 0.746;
  let cameraCenter = {
    x: DEFAULT_CAMERA_CENTER.x,
    y: DEFAULT_CAMERA_CENTER.y,
  };

  // Gameplay range layers. World coordinates remain independent from camera zoom.
  const DETECTION_RADAR_RADIUS = 5000;
  const TRACKING_RADAR_RADIUS = 3000;
  const LOW_ALTITUDE_DETECTION_RADIUS = 2400;
  const SEA_SKIM_TRIGGER_RADIUS = 2700;
  const SEA_SKIM_FULL_ACCEL_RADIUS = 2600;
  const SHORT_RANGE_DEFENSE_RADIUS = 1200;
  // The M4/automatic close-in missile failsafe ends at this displayed range.
  const SHORT_RANGE_MISSILE_SELF_DESTRUCT_RADIUS = SHORT_RANGE_DEFENSE_RADIUS;
  // M3 failsafe range is independent from the enemy SEA_SKIMMING acceleration distance.
  const MID_RANGE_MISSILE_SELF_DESTRUCT_RADIUS = 2600;
  const MISSILE_APPROACH_WARNING_RADIUS = 1000;
  const CIWS_DEFENSE_RADIUS = 800;
  const MISSILE_APPROACH_WARNING_ENABLED = true;

  // Basic ship-supported interceptor guidance.
  const GUIDANCE_UPDATE_INTERVAL = 0.5;
  const RADAR_SWEEP_STEP_DEGREES = 15;
  const RADAR_SWEEP_STEP_RADIANS =
    RADAR_SWEEP_STEP_DEGREES * Math.PI / 180;
  const RADAR_SWEEP_SECTOR_COUNT =
    Math.round(360 / RADAR_SWEEP_STEP_DEGREES);
  // The same north-up reference is used for Track sectors and GUI rotation.
  const RADAR_SWEEP_START_ANGLE = -Math.PI / 2;
  const TERMINAL_CAPTURE_RADIUS = 120;
  const FINAL_CHANNEL_COUNT = 2;
  const FINAL_GUIDANCE_ENTRY_RADIUS = 200;
  const INTERCEPTOR_TERMINAL_SPEED_MULTIPLIER = 1.5;
  const INTERCEPTOR_TERMINAL_ACCELERATION_MULTIPLIER_PER_SECOND = 0.75;
  const INTERCEPTOR_HOLD_RADIUS = 130;
  const INTERCEPTOR_HOLD_CORRECTION_GAIN = 1.25;
  const INTERCEPTOR_NOSE_OFFSET = 4;
  const INTERCEPTOR_NOSE_HIT_RADIUS = 2;
  const INTERCEPTOR_SELF_DESTRUCT_RADIUS =
    TRACKING_RADAR_RADIUS + 300;
  const MISSION_POINT_TOLERANCE = 6;

  // ------------------------------------------------------------------------
  // STAGE EX — isolated automatic stress-simulation profile.
  // Main-game stages never read these values unless world.exMode === true.
  // ------------------------------------------------------------------------
  // EX-only interceptor speed is separate from normal-stage weapon profiles.
  const EX_INTERCEPTOR_BASE_SPEED = 100;
  // EX enemy classes remain independent of regular-stage class values.
  const EX_ENEMY_SPEED_SLOW = 35;
  const EX_ENEMY_SPEED_NORMAL = 60;
  const EX_ENEMY_SPEED_FAST = 100;
  const EX_GENERAL_CHANNEL_COUNT = 100;
  const EX_FINAL_CHANNEL_COUNT = 20;
  const EX_WAVE_COUNT = 5;
  const EX_THREATS_PER_WAVE = 200;

  const EX_RANGE_PROFILE = Object.freeze({
    detection: DETECTION_RADAR_RADIUS * 2,              // 10000
    engagement: TRACKING_RADAR_RADIUS * 2,              // 6000
    lowAltitudeDetection: LOW_ALTITUDE_DETECTION_RADIUS * 2, // 4800
    seaSkimTrigger: SEA_SKIM_TRIGGER_RADIUS * 2,        // 5400
    seaSkimFull: SEA_SKIM_FULL_ACCEL_RADIUS * 2,        // 5200
    shortRange: SHORT_RANGE_DEFENSE_RADIUS * 2,         // 2400
    warning: MISSILE_APPROACH_WARNING_RADIUS * 2,       // 2000
    ciws: 1200,                                            // EX unchanged
    finalEntry: FINAL_GUIDANCE_ENTRY_RADIUS,            // keep 200
    interceptorSelfDestruct: TRACKING_RADAR_RADIUS * 2 + 300, // 6300
  });

  function detectionRadarRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.detection : DETECTION_RADAR_RADIUS;
  }

  function trackingRadarRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.engagement : TRACKING_RADAR_RADIUS;
  }

  function lowAltitudeDetectionRadiusFor(world) {
    return world?.exMode
      ? EX_RANGE_PROFILE.lowAltitudeDetection
      : LOW_ALTITUDE_DETECTION_RADIUS;
  }

  function seaSkimTriggerRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.seaSkimTrigger : SEA_SKIM_TRIGGER_RADIUS;
  }

  function seaSkimFullRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.seaSkimFull : SEA_SKIM_FULL_ACCEL_RADIUS;
  }

  function shortRangeRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.shortRange : SHORT_RANGE_DEFENSE_RADIUS;
  }

  function warningRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.warning : MISSILE_APPROACH_WARNING_RADIUS;
  }

  function ciwsRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.ciws : CIWS_DEFENSE_RADIUS;
  }

  function finalGuidanceEntryRadiusFor(world) {
    return world?.exMode ? EX_RANGE_PROFILE.finalEntry : FINAL_GUIDANCE_ENTRY_RADIUS;
  }

  function interceptorSelfDestructRadiusFor(world) {
    return world?.exMode
      ? EX_RANGE_PROFILE.interceptorSelfDestruct
      : INTERCEPTOR_SELF_DESTRUCT_RADIUS;
  }

  function finalChannelCountFor(world) {
    return world?.exMode ? EX_FINAL_CHANNEL_COUNT : FINAL_CHANNEL_COUNT;
  }

  // Presentation-history sampling for the actual flown interceptor path.
  // Spatial sampling avoids frame-rate-dependent point counts.
  const INTERCEPTOR_TRAIL_SAMPLE_DISTANCE = 12;
  const INTERCEPTOR_TRAIL_MAX_POINTS = 512;

  function defaultCameraZoomForCurrentPlot() {
    const viewport = cameraPlotViewport();
    const limitingDiameterPx =
      Math.min(viewport.width, viewport.height);
    const usableDiameterPx =
      Math.max(
        1,
        limitingDiameterPx - OVERVIEW_RADAR_MARGIN_PX * 2
      );

    return usableDiameterPx / (DETECTION_RADAR_RADIUS * 2);
  }

  function overviewZoomForStage(stageSpec) {
    const baseOverviewZoom =
      defaultCameraZoomForCurrentPlot();

    return stageSpec?.isEX
      ? baseOverviewZoom * 0.5
      : baseOverviewZoom;
  }

  function minimumCameraZoomForStage(stageSpec) {
    return overviewZoomForStage(stageSpec);
  }

  // Temporary initialization only; after TACTICAL_CHART is initialized below,
  // cameraZoom is immediately replaced by overviewZoomForStage().
  let cameraZoom = FALLBACK_CAMERA_ZOOM;

  const TARGET_HUD = Object.freeze({
    baseScale: 0.5,
    zoomResponseStrength: 1 / 9,

    // Reticle geometry is one coherent local coordinate system.
    targetSquareHalfSize: 15,
    targetCrosshairOuter: 24,
    targetCrosshairGap: 3,
    targetCircleRadius: 30,

    targetStrokeSelected: 3,
    targetStrokeNormal: 2,
    letterboxStrokeWidth: 1,

    // With one shared scale, these fixed local coordinates stay tangent at all zooms.
    letterboxTopSelected: 32,
    letterboxTopNormal: 31.5,

    // Letter-box effective base-view screen sizes stay 10px / 12px.
    targetCodeFontPx: 20,
    ttiFontPx: 24,

    targetCodeMinWidth: 76,
    targetCodePaddingX: 24,
    targetCodeHeight: 28,

    ttiPaddingX: 32,
    ttiHeight: 40,

    // Center identifier readability:
    // - grows together with the square from the shared 0.5 HUD scale,
    // - must stay inside the square,
    // - never exceeds 18 screen px.
    centerIdentifierBaseScreenPx: 11,
    centerIdentifierMaxScreenPx: 18,
    centerIdentifierBoxWidth: 28,
    centerIdentifierBoxHeight: 26,
    centerIdentifierTextMaxWidth: 24,
    centerIdentifierTextMaxHeight: 22,
  });

  let targetHudScreenScale = TARGET_HUD.baseScale;
  const targetIdentifierFontCache = new Map();

  function updateTargetHudScreenScale() {
    const defaultZoom = defaultCameraZoomForCurrentPlot();
    const zoomRatio =
      defaultZoom > 1e-9 ? cameraZoom / defaultZoom : 1;

    const zoomFactor =
      zoomRatio <= 1
        ? 1
        : 1 +
          (zoomRatio - 1) *
          TARGET_HUD.zoomResponseStrength;

    targetHudScreenScale =
      TARGET_HUD.baseScale * zoomFactor;

    // Identifier fitting depends on screen-scale/cap, so refresh only when
    // camera zoom actually changes.
    targetIdentifierFontCache.clear();
  }

  function fittedTargetIdentifierLocalFontPx(identifier) {
    const cacheKey = String(identifier);
    const cached = targetIdentifierFontCache.get(cacheKey);
    if (cached != null) return cached;

    const zoomFactor =
      targetHudScreenScale / TARGET_HUD.baseScale;

    const desiredScreenPx = Math.min(
      TARGET_HUD.centerIdentifierMaxScreenPx,
      TARGET_HUD.centerIdentifierBaseScreenPx * zoomFactor
    );

    let high = Math.max(
      1,
      desiredScreenPx / Math.max(targetHudScreenScale, 1e-9)
    );
    let low = 1;

    // Binary-fit the actual glyph metrics into the square's inner text area.
    // This handles "01", Latin letters and Greek identifiers without letting
    // any of them escape the square.
    for (let i = 0; i < 10; i++) {
      const mid = (low + high) * 0.5;
      ctx.font =
        `900 ${mid}px ` +
        `ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

      const metrics = ctx.measureText(cacheKey);

  const PkSystem = {
    smoothDistanceCoefficient(pkEvaluationDistance, startDistance, endDistance, startCoefficient, endCoefficient) {
      const distanceTransitionProgress = clamp((pkEvaluationDistance - startDistance) / (endDistance - startDistance), 0, 1);
      const smoothedDistanceProgress = distanceTransitionProgress * distanceTransitionProgress * (3 - 2 * distanceTransitionProgress);
      return startCoefficient + (endCoefficient - startCoefficient) * smoothedDistanceProgress;

    enemyBaseSpeedPkCoefficient(targetBaseSpeed, coefficients, missileMotionMultiplier=1) {

        Math.pow(scaledReferenceEnemySpeed / scaledEnemyBaseSpeed, coefficients.enemyBaseSpeedPkExponent),
        coefficients.minEnemySpeedPkCoefficient, coefficients.maxEnemySpeedPkCoefficient

    linearDistancePkCoefficient(pkEvaluationDistance, coefficients) {
      return coefficients.distancePkMinimum + (1 - coefficients.distancePkMinimum) *
        clamp(pkEvaluationDistance / coefficients.distancePkNoPenaltyRange, 0, 1);
    },
    seaSkimmingDistanceCoefficient(pkEvaluationDistance, coefficients) {
      if (pkEvaluationDistance >= 3000) return coefficients.seaSkimmingCoefficientAt3000;
      if (pkEvaluationDistance >= 2700) {
        return this.smoothDistanceCoefficient(pkEvaluationDistance, 2700, 3000,
          coefficients.seaSkimmingCoefficientAt2700, coefficients.seaSkimmingCoefficientAt3000);
      }
      if (pkEvaluationDistance >= coefficients.seaSkimmingPkDipDistance) {
        return this.smoothDistanceCoefficient(pkEvaluationDistance, coefficients.seaSkimmingPkDipDistance, 2700,
          coefficients.seaSkimmingCoefficientAtDip, coefficients.seaSkimmingCoefficientAt2700);
      }
      if (pkEvaluationDistance >= 2600) {
        return this.smoothDistanceCoefficient(pkEvaluationDistance, 2600, coefficients.seaSkimmingPkDipDistance,
          coefficients.seaSkimmingCoefficientAt2600, coefficients.seaSkimmingCoefficientAtDip);
      }
      if (pkEvaluationDistance > 1200) {
        return coefficients.seaSkimmingCoefficientAt1200 +
          (coefficients.seaSkimmingCoefficientAt2600 - coefficients.seaSkimmingCoefficientAt1200) *
          Math.pow((pkEvaluationDistance - 1200) / 1400, coefficients.seaSkimmingInnerDistanceExponent);
      }
      // The SEA_SKIMMING Pk reference curve continues below 1200; near-range penalty is separate.
      return coefficients.seaSkimmingCoefficientAt1200 *
        this.linearDistancePkCoefficient(pkEvaluationDistance, coefficients) /
        this.linearDistancePkCoefficient(1200, coefficients);
    },
    lowAltitudeReferencePkRatio(pkEvaluationDistance, sensorProfile, coefficients) {
      if (sensorProfile !== SensorProfile.LOW_ALTITUDE) return 1;
      const distancePkCoefficientAt2400 = this.linearDistancePkCoefficient(2400, coefficients);
      const lowAltitudeAdjustedDistancePkCoefficient = distancePkCoefficientAt2400 +
        coefficients.lowAltitudeDistanceChangeWeight *
        (this.linearDistancePkCoefficient(pkEvaluationDistance, coefficients) - distancePkCoefficientAt2400);

    nearRangePenaltyCoefficient(pkEvaluationDistance, weaponProfile) {

        Math.pow(clamp(pkEvaluationDistance / nearPenaltyTargetDistance, 0, 1),
          weaponProfile.nearRangeExponent);

        pkEvaluationDistance, PK_TARGET_CONDITION_REFERENCE_CURVES

        pkEvaluationDistance, PK_TARGET_CONDITION_REFERENCE_CURVES

        pkEvaluationDistance, SensorProfile.LOW_ALTITUDE, PK_TARGET_CONDITION_REFERENCE_CURVES

        (lowAltitudePkReferenceRatio - 1);

        profile.seekerPkMultiplier *
        this.enemyBaseSpeedPkCoefficient(target.baseSpeed, profile, missileMotionMultiplier) *
        weaponDistancePkCoefficient * seaSkimmingPkCorrection * lowAltitudePkCorrection *
        this.nearRangePenaltyCoefficient(pkEvaluationDistance, profile);
      const basePk = clamp(unclampedPk, profile.minProbability, profile.maxProbability);
      const missMul = window.__RG ? window.__RG.missMulFor(target, pkEvaluationDistance) : 1;

      // multiple Tracks are first detected on the same radar sweep tick.
      this.trackId = trackId;
      this.sourceEntityId = sourceEntityId;
      this.displayPosition = displayPosition;
      this.displaySpeed = displaySpeed;
      this.visible = visible;
      this.spawnSequence = spawnSequence;
      this.firstDetectionTime = null;
      this.selected = false;
      this.lastUpdateTime = null;
    }
  }
