  function enemySpawnPosition(shipPosition, bearingDegrees, preferredDistance=0) {
    const requiredDistance = Math.max(
      MIN_ENEMY_SPAWN_DISTANCE,
      DETECTION_RADAR_RADIUS + ENEMY_SPAWN_RADAR_MARGIN,
      preferredDistance
    );

    const radians = bearingDegrees * Math.PI / 180;
    return shipPosition.add(new Vec2(
      Math.cos(radians) * requiredDistance,
      Math.sin(radians) * requiredDistance
    ));
  }


  function fnv1a32(text) {
    let value = 2166136261 >>> 0;
    const bytes = new TextEncoder().encode(text);

    for (const byte of bytes) {
      value ^= byte;
      value = Math.imul(value, 16777619) >>> 0;
    }

    return value >>> 0;
  }

  function deterministicUnit(stageSeed, streamName, index) {
    let value = (
      (stageSeed >>> 0) ^
      fnv1a32(streamName) ^
      Math.imul(index >>> 0, 0x9E3779B9)
    ) >>> 0;

    value ^= value >>> 16;
    value = Math.imul(value, 0x7FEB352D) >>> 0;
    value ^= value >>> 15;
    value = Math.imul(value, 0x846CA68B) >>> 0;
    value ^= value >>> 16;

    return (value >>> 0) / 4294967296;
  }

  function randomSpawnBearingDegrees(stageSeed, index) {
    return (
      deterministicUnit(stageSeed, "spawn_bearing", index) *
      360
    );
  }


  function chooseFlightProfile(
    stageSeed,
    index,
    seaSkimmingChance,
    sensorProfile
  ) {
    if (sensorProfile === SensorProfile.LOW_ALTITUDE) {
      return FlightProfile.DIRECT;
    }

    return (
      deterministicUnit(
        stageSeed,
        "flight_profile",
        index
      ) < seaSkimmingChance
        ? FlightProfile.SEA_SKIMMING
        : FlightProfile.DIRECT
    );
  }

  function buildSpawnInstruction(stage, {
    time,
    index,
    extra,
    speed=ENEMY_SPEED_NORMAL,
    sensorProfile=SensorProfile.NORMAL,
    flightProfileOverride=null,
  }) {
    const flightProfile = flightProfileOverride ?? chooseFlightProfile(
      stage.stageSeed,
      index,
      stage.seaSkimmingChance ?? 0,
      sensorProfile
    );

    return {
      time,
      index,
      extra,
      speed,
      sensorProfile,
      bearing: randomSpawnBearingDegrees(
        stage.stageSeed,
        index
      ),
      flightProfile,
      // Kept as null for constructor compatibility; SEA_SKIMMING now uses
      // the fixed 2700->2600 distance band instead of a randomized TTI threshold.
      seaSkimTriggerTti: null,
    };
  }


  // ------------------------------------------------------------------------
  // Shared stage attack-authoring core.
  // Every stage, including STAGE EX, describes hostile pressure with the same
  // hierarchy: Stage -> Wave -> Burst -> Missile. The compiler only translates
  // authored timing into the existing spawnQueue format; combat systems below
  // this boundary are unchanged.
  //
  // enabled can be switched independently at every hierarchy level.
  // Physical spawn time =
  //   Wave.startTime + Burst.offset + Missile.offset.
  // Missile.compileOrder is optional and exists only to preserve legacy authored
  // queue order when logical Wave membership differs from historical flat data.
  // ------------------------------------------------------------------------

  function attackPlanNodeEnabled(node) {
    return node?.enabled !== false;
  }

  function validateStageAttackPlan(stage, attackPlan=stage.attackPlan) {
    if (!attackPlan || !attackPlanNodeEnabled(attackPlan)) return true;
    if (!Array.isArray(attackPlan.waves)) {
      throw new Error(`[${stage.stageId}] attackPlan.waves must be an array`);
    }

    const missileIndices = new Set();
    const validSensors = new Set(Object.values(SensorProfile));
    const validFlights = new Set(Object.values(FlightProfile));

    for (const [waveIndex, wave] of attackPlan.waves.entries()) {
      if (!Number.isFinite(wave.startTime ?? 0)) {
        throw new Error(`[${stage.stageId}] Wave ${wave.id ?? waveIndex + 1} has invalid startTime`);
      }
      if (!Array.isArray(wave.bursts)) {
        throw new Error(`[${stage.stageId}] Wave ${wave.id ?? waveIndex + 1} bursts must be an array`);
      }

      for (const [burstIndex, burst] of wave.bursts.entries()) {
        if (!Number.isFinite(burst.offset ?? 0)) {
          throw new Error(`[${stage.stageId}] Burst ${burst.id ?? burstIndex + 1} has invalid offset`);
        }
        if (!Array.isArray(burst.missiles)) {
          throw new Error(`[${stage.stageId}] Burst ${burst.id ?? burstIndex + 1} missiles must be an array`);
        }

        for (const missile of burst.missiles) {
          if (!Number.isInteger(missile.index) || missile.index <= 0) {
            throw new Error(`[${stage.stageId}] invalid missile index`);
          }
          if (missileIndices.has(missile.index)) {
            throw new Error(`[${stage.stageId}] duplicate missile index ${missile.index}`);
          }
          missileIndices.add(missile.index);

          if (!Number.isFinite(missile.offset ?? 0)) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid offset`);
          }
          if (!Number.isFinite(missile.extra) || missile.extra < 0) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid extra distance`);
          }
          if (missile.speed != null && !Number.isFinite(missile.speed)) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid speed`);
          }
          if (
            missile.sensorProfile != null &&
            !validSensors.has(missile.sensorProfile)
          ) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid sensorProfile`);
          }
          if (
            missile.flightProfileOverride != null &&
            !validFlights.has(missile.flightProfileOverride)
          ) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid flightProfileOverride`);
          }
        }
      }
    }

    return true;
  }

  function compileStageAttackPlan(
    stage,
    attackPlan=stage.attackPlan,
    { sortByTime=false }={}
  ) {
    if (!attackPlan || !attackPlanNodeEnabled(attackPlan)) return [];
    validateStageAttackPlan(stage, attackPlan);

    const compiled = [];
    let naturalOrder = 0;
    for (const wave of attackPlan.waves) {
      if (!attackPlanNodeEnabled(wave)) continue;
      const waveStart = wave.startTime ?? 0;

      for (const burst of wave.bursts) {
        if (!attackPlanNodeEnabled(burst)) continue;
        const burstOffset = burst.offset ?? 0;

        for (const missile of burst.missiles) {
          naturalOrder += 1;
          if (!attackPlanNodeEnabled(missile)) continue;

          const time =
            waveStart +
            burstOffset +
            (missile.offset ?? 0);

          if (time < -1e-9) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has negative spawn time`);
          }

          const order = buildSpawnInstruction(stage, {
            time: Math.max(0, time),
            index: missile.index,
            extra: missile.extra,
            speed: missile.speed ?? ENEMY_SPEED_NORMAL,
            sensorProfile:
              missile.sensorProfile ?? SensorProfile.NORMAL,
            flightProfileOverride:
              missile.flightProfileOverride ?? null,
          });

          compiled.push({
            order,
            compileOrder: missile.compileOrder ?? naturalOrder,
          });
        }
      }
    }

    compiled.sort((left, right) => {
      if (sortByTime) {
        const timeDelta = left.order.time - right.order.time;
        if (Math.abs(timeDelta) > 1e-12) return timeDelta;
      }
      return left.compileOrder - right.compileOrder;
    });

    return compiled.map(item => item.order);
  }

  // -------- Shared player feature set --------
  // Player-side functionality is global, not a per-stage unlock.
  // New player functions must be added here so every registered stage
  // receives them automatically.
  const PLAYER_FEATURES = Object.freeze({
    showTTI: true,
    useAssistSelection: true,
    usePendingEngagements: true,
    useReservationQueue: true,
  });

  function registerStages(...stages) {
    return Object.freeze(Object.fromEntries(
      stages.map(stage => [
        stage.stageId,
        Object.freeze({ ...stage, ...PLAYER_FEATURES })
      ])
    ));
  }

  // -------- Stage composition --------

  // Unified physical spawn: time and radius are authored Stage data.
  // Speed belongs to missile movement, never Spawn-time calculation.
  function spawnAttackOrder(world, order) {
    const position = enemySpawnPosition(
      world.ship.position,
      order.bearing,
      MIN_ENEMY_SPAWN_DISTANCE + order.extra
    );
    addAttack(
      world,
      order.index,
      position,
      order.speed ?? ENEMY_SPEED_NORMAL,
      order.sensorProfile ?? SensorProfile.NORMAL,
      order.flightProfile ?? FlightProfile.DIRECT,
      order.seaSkimTriggerTti ?? null,
      order.bearing
    );
  }

  function spawnDueAttacks(world) {
    if (!world.spawnQueue.length) return;
    // EX only optimizes the 1000-order sorted queue. Spawn rules are shared.
    if (world.exMode) {
      while (world.spawnQueue.length && world.spawnQueue[0].time <= world.time + 1e-9) {
        spawnAttackOrder(world, world.spawnQueue.shift());
      }
      return;
    }
    const remaining = [];
    for (const order of world.spawnQueue) {
      if (order.time <= world.time + 1e-9) {
        spawnAttackOrder(world, order);
      } else {
        remaining.push(order);
      }
    }
    world.spawnQueue = remaining;
  }

  function attackMissileDisplayRadiusForBaseSpeed(baseSpeed) {
    // Visual size is a speed-class cue, not collision geometry.
    // Slow = 1x, Normal = 2x, Fast = 3x. Sea-skimming acceleration
    // never changes the base-class display size.
    if (baseSpeed >= ENEMY_SPEED_FAST - 0.5) return 15.0;
    if (baseSpeed >= ENEMY_SPEED_NORMAL - 0.5) return 10.0;
    return 5.0;
  }

  function addAttack(
    world,
    index,
    position,
    speed=ENEMY_SPEED_NORMAL,
    sensorProfile=SensorProfile.NORMAL,
    flightProfile=FlightProfile.DIRECT,
    seaSkimTriggerTti=null,
    spawnBearingDegrees=null
  ) {
    const entityId = "ASM-" + String(index).padStart(3, "0");
    // Actual spawn order is kept only for simultaneous-detection tie breaking.
    // It is deliberately NOT exposed as the player's T-xx Track number.
    const spawnSequence = world.spawnedAttackCount + 1;

    const attack = new Missile({
      entityId,
      role: MissileRole.ATTACK,
      position,
      speed,
      baseSpeed: speed,
      currentSpeed: speed,
      terminalSpeed:
        speed * SEA_SKIM_TERMINAL_SPEED_MULTIPLIER,
      terminalAcceleration: null,
      hitRadius: 8,
      displayRadius: attackMissileDisplayRadiusForBaseSpeed(speed),
      targetEntityId: world.ship.entityId,
      sensorProfile,
      flightProfile,
      flightPhase:
        flightProfile === FlightProfile.SEA_SKIMMING
          ? FlightPhase.CRUISE_HIGH
          : FlightPhase.DIRECT,
      seaSkimTriggerTti,
      spawnBearingDegrees,
    });

    world.attackMissiles.push(attack);
    world.tracks.push(new Track({
      trackId: null,
      sourceEntityId: entityId,
      displayPosition: position.clone(),
      displaySpeed: speed,
      spawnSequence,
      // Every hostile starts unpublished. The rotating radar may publish
      // NORMAL threats only after they are physically inside the 5000-range
      // detection envelope, and LOW_ALTITUDE threats only inside their own
      // 2400-range gate. This prevents off-radar truth graphics from leaking
      // to the player in every stage.
      visible: false,
    }));
    world.spawnedAttackCount += 1;
  }


  // --------------------------------------------------------------------------
  // STAGE EX
  // Automatic 1000-threat stress simulation.
  //
  // Hierarchy used by this project:
  //   Wave       = large pressure-pattern group; Waves MAY overlap.
  //   Burst      = short concentrated group inside a Wave.
  //   Missile    = one independent simulation entity inside a Burst.
  //
  // EX uses 5 logical Waves × 200 missiles. These are NOT five separated
  // rounds; adjacent Waves overlap so all 1000 threats form one continuous
  // pressure curve.
  //
  // Important isolation rule:
  // - STAGE 01~05 keep the current v58/v59 "CH before launch" model.
  // - STAGE EX alone restores the previously removed experimental order:
  //     automatic queue -> unlimited FLY (no normal CH) -> later normal CH.

    // Average of two independent deterministic uniforms:
    // values cluster toward 0.5 instead of the edges.
    return (
      deterministicUnit(stageSeed, streamName + "_a", index) +
      deterministicUnit(stageSeed, streamName + "_b", index)
    ) * 0.5;
  }

  // EX Wave/Burst membership and automatic defense stay independent of physical spawn timing.
  // EX auto-fire timetable values are pre-calibrated outside runtime logic.
  // Actual non-LOW InterceptorHit bands validated for this table:
  //   SLOW / NORMAL / SEA(NORMAL) : 5400..6000 engagement-band hits
  //   FAST / SEA(FAST)            : 4400..4750 speed-exception hits
  // LOW_ALTITUDE remains a separate close-range exception.
  const EX_AUTO_DEFENSE_PROFILE = Object.freeze({
    reactionDelayMin: 0.25,
    reactionDelayMax: 1.75,
    slowLaunchRangeMin: 7300,
    slowLaunchRangeMax: 8000,
    normalLaunchRangeMin: 8650,
    normalLaunchRangeMax: 9450,
    fastLaunchRangeMin: 8800,
    fastLaunchRangeMax: 9500,
    seaSkimLaunchRangeMin: 9200,
    seaSkimLaunchRangeMax: 9400,
    lowLaunchRangeMin: 3200,
    lowLaunchRangeMax: 4100,
    aimBiasMin: 150,
    aimBiasMax: 350,
  });

  function exBurstComposition(waveIndex, burstIndex) {
    // Special profiles are deliberately exceptional instead of being stamped
    // into every Burst. Most threats are NORMAL-sensor DIRECT missiles.
    const items = [];
    const specialKey = (waveIndex * 10 + burstIndex) % 10;
    const lowCount = (specialKey === 3 || specialKey === 8) ? 3 : 0;
    const seaCount = (specialKey === 1 || specialKey === 6) ? 4 : 0;
    const directCount = 20 - lowCount - seaCount;

    for (let n = 0; n < lowCount; n++) {
      items.push({
        speed: EX_ENEMY_SPEED_SLOW,
        sensorProfile: SensorProfile.LOW_ALTITUDE,
        flightProfile: FlightProfile.DIRECT,
      });
    }

    for (let n = 0; n < seaCount; n++) {
      items.push({
        speed: n % 2 === 0 ? EX_ENEMY_SPEED_NORMAL : EX_ENEMY_SPEED_FAST,
        sensorProfile: SensorProfile.NORMAL,
        flightProfile: FlightProfile.SEA_SKIMMING,
      });
    }

    for (let n = 0; n < directCount; n++) {
      const selector = (n + burstIndex + waveIndex) % 8;
      const speed =
        selector <= 1
          ? EX_ENEMY_SPEED_SLOW
          : selector >= 6
            ? EX_ENEMY_SPEED_FAST
            : EX_ENEMY_SPEED_NORMAL;
      items.push({
        speed,
        sensorProfile: SensorProfile.NORMAL,
        flightProfile: FlightProfile.DIRECT,
      });
    }

    return items;
  }

  function buildStageEXAttackPlan(stage) {
    let targetIndex = 1;
    const waves = [];

    for (let wave = 0; wave < EX_WAVE_COUNT; wave++) {
      const bursts = [];

      for (let burst = 0; burst < 10; burst++) {
        const composition = exBurstComposition(wave, burst)
          .map((profile, index) => ({
            profile,
            key: deterministicUnit(
              stage.stageSeed + wave * 1009 + burst * 97,
              "ex_burst_shuffle",
              index + 1
            ),
          }))
          .sort((left, right) => left.key - right.key)
          .map(item => item.profile);

        const missiles = [];
        for (let slot = 0; slot < 20; slot++, targetIndex++) {
          const profile = composition[slot];
          const [fixedSpawnTime, fixedSpawnRadius, legacySpawnOrder] = EX_FIXED_SPAWN_TABLE[targetIndex - 1];

          missiles.push({
            enabled: true,
            index: targetIndex,
            compileOrder: legacySpawnOrder,
            offset: fixedSpawnTime,
            extra: fixedSpawnRadius - MIN_ENEMY_SPAWN_DISTANCE,
            speed: profile.speed,
            sensorProfile: profile.sensorProfile,
            flightProfileOverride: profile.flightProfile,
          });
        }

        const burstStart = Math.min(...missiles.map(missile => missile.offset));
        for (const missile of missiles) missile.offset -= burstStart;
        bursts.push({
          id: `B${String(burst + 1).padStart(2, "0")}`,
          enabled: true,
          offset: burstStart,
          missiles,
        });
      }

      const waveStart = Math.min(...bursts.map(burst => burst.offset));
      for (const burst of bursts) burst.offset -= waveStart;
      waves.push({
        id: `W${String(wave + 1).padStart(2, "0")}`,
        enabled: true,
        startTime: waveStart,
        bursts,
      });
    }

    return {
      enabled: true,
      waves,
    };
  }

  function exAutoDefenseSpecFor(stage, target, targetIndex) {
    const weightedDelay = exWeightedUnit(
      stage.stageSeed,
      "ex_auto_reaction_delay",
      targetIndex
    );
    const weightedLaunchRange = exWeightedUnit(
      stage.stageSeed,
      "ex_auto_launch_range",
      targetIndex
    );
    const weightedAimRange = exWeightedUnit(
      stage.stageSeed,
      "ex_auto_aim_range",
      targetIndex
    );

    let launchMin;
    let launchMax;

    if (target.sensorProfile === SensorProfile.LOW_ALTITUDE) {
      launchMin = EX_AUTO_DEFENSE_PROFILE.lowLaunchRangeMin;
      launchMax = EX_AUTO_DEFENSE_PROFILE.lowLaunchRangeMax;
    } else if (target.flightProfile === FlightProfile.SEA_SKIMMING) {
      launchMin = EX_AUTO_DEFENSE_PROFILE.seaSkimLaunchRangeMin;
      launchMax = EX_AUTO_DEFENSE_PROFILE.seaSkimLaunchRangeMax;
    } else if (target.baseSpeed >= EX_ENEMY_SPEED_FAST - 0.5) {
      launchMin = EX_AUTO_DEFENSE_PROFILE.fastLaunchRangeMin;
      launchMax = EX_AUTO_DEFENSE_PROFILE.fastLaunchRangeMax;
    } else if (target.baseSpeed <= EX_ENEMY_SPEED_SLOW + 0.5) {
      launchMin = EX_AUTO_DEFENSE_PROFILE.slowLaunchRangeMin;
      launchMax = EX_AUTO_DEFENSE_PROFILE.slowLaunchRangeMax;
    } else {
      launchMin = EX_AUTO_DEFENSE_PROFILE.normalLaunchRangeMin;
      launchMax = EX_AUTO_DEFENSE_PROFILE.normalLaunchRangeMax;
    }

    return {
      reactionDelay:
        EX_AUTO_DEFENSE_PROFILE.reactionDelayMin +
        weightedDelay *
          (
            EX_AUTO_DEFENSE_PROFILE.reactionDelayMax -
            EX_AUTO_DEFENSE_PROFILE.reactionDelayMin
          ),
      launchRange:
        launchMin + weightedLaunchRange * (launchMax - launchMin),
      launchRangeMin: launchMin,
      launchRangeMax: launchMax,
      aimBias:
        EX_AUTO_DEFENSE_PROFILE.aimBiasMin +
        weightedAimRange *
          (
            EX_AUTO_DEFENSE_PROFILE.aimBiasMax -
            EX_AUTO_DEFENSE_PROFILE.aimBiasMin
          ),
    };
  }

  function appendInterceptorTrailPoint(
    missile,
    position,
    force=false
  ) {
    if (!missile.trailPoints) {
      missile.trailPoints = [];
    }

    const points = missile.trailPoints;
    const lastPoint = points.length
      ? points[points.length - 1]
      : null;

    if (
      !force &&
      lastPoint &&
      distance(lastPoint, position) <
        INTERCEPTOR_TRAIL_SAMPLE_DISTANCE
    ) {
      return;
    }

    if (
      lastPoint &&
      distance(lastPoint, position) <= 1e-6
    ) {
      return;
    }

    points.push(position.clone());

    // Path lengths in the current combat envelope normally remain far below
    // this limit. If it is exceeded, decimate old interior samples while
    // preserving launch origin, current shape and latest point.
    if (points.length > INTERCEPTOR_TRAIL_MAX_POINTS) {
      const compacted = [points[0]];
      for (let i = 2; i < points.length - 1; i += 2) {
        compacted.push(points[i]);
      }
      compacted.push(points[points.length - 1]);
      missile.trailPoints = compacted;
    }
  }

  function selfDestructInterceptor(

  function clamp(value, low, high) {

  function dot(a, b) {
    return a.x * b.x + a.y * b.y;
  }

  function segmentPointDistance(a, b, point) {
    const segment = b.sub(a);
    const lengthSq = dot(segment, segment);
    if (lengthSq <= 1e-12) return distance(a, point);
    const t = clamp(dot(point.sub(a), segment) / lengthSq, 0, 1);
    const closest = a.add(segment.mul(t));
    return distance(closest, point);
  }

  const EnemyFlightProfileSystem = {

          missile.flightPhase !== FlightPhase.DESCENT_ACCEL

        if (currentRange <= seaSkimFullRadiusFor(world)) {
          missile.currentSpeed = missile.terminalSpeed;
          missile.flightPhase = FlightPhase.TERMINAL_LOW;
          continue;

        const accelBand =
          seaSkimTriggerRadiusFor(world) - seaSkimFullRadiusFor(world);
        const progress = clamp(
          (seaSkimTriggerRadiusFor(world) - currentRange) / accelBand,
          0,
          1
        );

        // Spatial ramp:
        // 2700 -> base speed
        // 2600 -> full terminal speed
        missile.currentSpeed =
          missile.baseSpeed +
          (missile.terminalSpeed - missile.baseSpeed) * progress;
      }
    },

    recordMovement(world, movementSegments) {
      for (const segment of movementSegments) {

        const currentRange =

  };

  // Booster phase controls ordinary player-interceptor movement and eligibility
  // for terminal guidance. It does not change the guidance or collision rules.
  const BoosterSystem = {
    removalDistances(targetRangeAtLaunch) {
      const referenceRange = Math.min(
        Math.max(0, targetRangeAtLaunch),
        BOOSTER_REFERENCE_TARGET_DISTANCE
      );
      return {
        first: Math.max(BOOSTER_1_MIN_REMOVAL_DISTANCE, referenceRange / 3),
        second: Math.max(BOOSTER_2_MIN_REMOVAL_DISTANCE, referenceRange * 2 / 3),
      };
    },
    removedCount(state) {
      if (state === BoosterState.BOOSTER_2_REMOVED) return 2;
      if (state === BoosterState.BOOSTER_1_REMOVED) return 1;
      return 0;
    },
    updateState(missile) {
      if (
        missile.boosterState === BoosterState.LAUNCHED &&
        missile.traveledDistance + 1e-9 >= missile.booster1RemovalDistance
      ) {
        missile.boosterState = BoosterState.BOOSTER_1_REMOVED;
      }
      if (
        missile.weaponId === WEAPON_IDS.TWO &&
        missile.boosterState === BoosterState.BOOSTER_1_REMOVED &&
        missile.traveledDistance + 1e-9 >= missile.booster2RemovalDistance
      ) {
        missile.boosterState = BoosterState.BOOSTER_2_REMOVED;
      }
    },
    speedAt(missile, traveledDistance=missile.traveledDistance) {
      const progress = clamp(traveledDistance / BOOSTER_ACCELERATION_DISTANCE, 0, 1);
      const launchSpeed = INTERCEPTOR_WEAPON_SPEED_PROFILES.COMMON.launchSpeed;
      const acceleratedSpeed = launchSpeed + (missile.baseSpeed - launchSpeed) * progress;
      const boosterLoss = INTERCEPTOR_WEAPON_SPEED_PROFILES[missile.weaponId]
        ?.boosterSpeedReduction ?? BOOSTER_SPEED_REDUCTION;
      return acceleratedSpeed - this.removedCount(missile.boosterState) * boosterLoss;
    },
    // Integrate movement up to each distance boundary, then apply the booster
    // state. A large fixed timestep or speed multiplier cannot skip a boundary.
    advanceDistance(missile, dt, motionMultiplier) {
      if (dt <= 0 || motionMultiplier <= 0) return 0;
      const startDistance = missile.traveledDistance;
      let remainingTime = dt;
      const launchSpeed = INTERCEPTOR_WEAPON_SPEED_PROFILES.COMMON.launchSpeed;
      const slope = (missile.baseSpeed - launchSpeed) / BOOSTER_ACCELERATION_DISTANCE;
      for (let segments = 0; segments < 5 && remainingTime > 1e-12; segments++) {
        this.updateState(missile);
        const traveled = missile.traveledDistance;
        const nextBoundary = Math.min(
          traveled < BOOSTER_ACCELERATION_DISTANCE - 1e-9
            ? BOOSTER_ACCELERATION_DISTANCE : Infinity,
          missile.boosterState === BoosterState.LAUNCHED
            ? missile.booster1RemovalDistance : Infinity,
          missile.weaponId === WEAPON_IDS.TWO &&
            missile.boosterState === BoosterState.BOOSTER_1_REMOVED
            ? missile.booster2RemovalDistance : Infinity
        );
        const accelerating = traveled < BOOSTER_ACCELERATION_DISTANCE - 1e-9;
        const speed = this.speedAt(missile);
        const timeToBoundary = !Number.isFinite(nextBoundary) ? Infinity :
          accelerating && slope > 0
            ? Math.log((launchSpeed + slope * nextBoundary) /
                (launchSpeed + slope * traveled)) / (slope * motionMultiplier)
            : (nextBoundary - traveled) / (speed * motionMultiplier);

        if (remainingTime + 1e-12 >= timeToBoundary) {
          missile.traveledDistance = nextBoundary;
          remainingTime = Math.max(0, remainingTime - timeToBoundary);
          this.updateState(missile);
        } else {
          if (accelerating && slope > 0) {
            const nextSpeed = (launchSpeed + slope * traveled) *
              Math.exp(slope * motionMultiplier * remainingTime);
            missile.traveledDistance = (nextSpeed - launchSpeed) / slope;
          } else {
            missile.traveledDistance += speed * motionMultiplier * remainingTime;
          }
          remainingTime = 0;
        }
      }
      this.updateState(missile);
      missile.currentSpeed = this.speedAt(missile);
      return missile.traveledDistance - startDistance;
    },
  };

  // The Seeker is geometric; randomness chooses WHICH detected contact to
  // lock, not whether a contact can be detected. Its RNG stream is separate
  // from both enemy spawning and collision Pk.
  const SeekerSystem = {
    isWeaponTwo(missile) {
      return missile.weaponId === WEAPON_IDS.TWO &&
        missile.guidanceMode === GuidanceMode.ACTIVE;
    },
    candidates(world, interceptor) {
      if (
        !interceptor.seekerInitialLock &&
        interceptor.boosterState !== BoosterState.BOOSTER_2_REMOVED
      ) return [];
      // guidanceDirection is the actual movement heading used by MovementSystem,
      // not a separately calculated bearing to the originally assigned target.
      const forward = interceptor.guidanceDirection?.normalized();
      if (!forward || forward.len() < 1e-9) return [];
      const limit = Math.cos(ACTIVE_SEEKER.halfAngleRadians);
      return world.attackMissiles.filter(target => {
        if (!target.alive) return false;
        const delta = target.position.sub(interceptor.position);
        const radius = delta.len();
        return radius <= ACTIVE_SEEKER.searchRadius &&
          (radius <= 1e-9 || dot(forward, delta.mul(1/radius)) >= limit);
      }).sort((a,b) =>
        distance(a.position,interceptor.position) -
        distance(b.position,interceptor.position) ||
        a.entityId.localeCompare(b.entityId)
      );
    },
    lock(world, interceptor, target, reacquired=false) {
      interceptor.targetEntityId = target.entityId;
      interceptor.orphanDestination = null;
      interceptor.seekerSearching = false;
      if (!reacquired && interceptor.guidanceSupportSuspended) {
        EmergencyReassignmentSystem.remove(world, interceptor.entityId);
      }
      if (reacquired) {
        interceptor.seekerReacquireUsed = true;
        interceptor.guidancePoint = target.position.clone();
        interceptor.guidanceDirection = target.position.sub(interceptor.position).normalized();
        interceptor.collisionArmed = true;
        world.events.push({type:"SeekerReacquired",entityId:interceptor.entityId,targetEntityId:target.entityId});
      } else {
        interceptor.seekerInitialLock = true;
        FinalChannelSystem.activateTerminal(world,interceptor,target,null);
      }
    },
    initialChoice(world, interceptor, candidates) {
      const original = candidates.find(t => t.entityId === interceptor.targetEntityId);
      const other = candidates.filter(t => t !== original).slice(0,2);
      const list = original ? [original,...other] : candidates.slice(0,2);
      if (list.length === 1) return list[0];
      const roll = deterministicUnit(world.pkStageSeed,"seeker_initial_choice",fnv1a32(interceptor.entityId));
      if (list.length === 2) return list[roll < .5 ? 0 : 1];
      return list[roll < .5 ? 0 : roll < .75 ? 1 : 2];
    },
    loseTarget(world, interceptor, destination, reason) {
      if (interceptor.orphanDestination) return;
      interceptor.orphanDestination = destination.clone();
      interceptor.guidancePoint = destination.clone();
      interceptor.guidanceDirection = destination.sub(interceptor.position).normalized();
      interceptor.guidanceState = GuidanceState.MIDCOURSE;
      interceptor.terminalHold = false;
      interceptor.terminalGuidanceActive = false;
      interceptor.collisionArmed = false;
      interceptor.finalChannelRequested = false;
      interceptor.finalChannelId = null;
      interceptor.channelId = null;
      if (interceptor.guidanceSupportSuspended) {
        EmergencyReassignmentSystem.remove(world, interceptor.entityId);
      }
      FinalChannelSystem.removeFromQueue(world,interceptor.entityId);
      world.events.push({type:"InterceptorTargetLost",entityId:interceptor.entityId,reason});
    },
    update(world, targetLossOnly=false) {
      if (world.exMode) return;
      const aliveById = new Map(world.attackMissiles.filter(t=>t.alive).map(t=>[t.entityId,t]));
      for (const missile of world.interceptors) {
        if (!missile.alive) continue;
        if (this.isWeaponTwo(missile) && !missile.seekerInitialLock &&
            missile.boosterState !== BoosterState.BOOSTER_2_REMOVED) {
          missile.seekerSearching = false;
        }
        const target=aliveById.get(missile.targetEntityId);
        if (missile.autoShortRange && !target) {
          selfDestructInterceptor(world, missile, missile.position,
            "SHORT_RANGE_TARGET_REMOVED");
          continue;
        }
        if (missile.weaponId === WEAPON_IDS.ONE ||
            missile.weaponId === WEAPON_IDS.THREE ||
            missile.weaponId === WEAPON_IDS.FOUR) {
          // A ship-supported shot flies to its last *published radar Track*
          // after another interceptor destroys the intended target.
          if (!target && !missile.orphanDestination) {
            const track = world.tracks.find(t=>t.sourceEntityId===missile.targetEntityId);
            const point=track?.displayPosition || missile.guidancePoint || missile.position;
            this.loseTarget(world,missile,point,"TARGET_ALREADY_DESTROYED");
          }
          continue;
        }
        if (!this.isWeaponTwo(missile)) continue;
        if (missile.orphanDestination) {
          if (targetLossOnly) continue;
          // Before first lock a missing original may still be reacquired
          // until reaching the last guidance point or the 3500 failsafe.
          if (!missile.seekerInitialLock) {
            const options=this.candidates(world,missile);
            if (options.length) this.lock(world,missile,this.initialChoice(world,missile,options));
          }
          continue;
        }
        if (missile.seekerInitialLock) {
          if (!target) {
            const last=missile.guidancePoint || missile.position;
            if (!missile.seekerReacquireUsed) {
              const options=this.candidates(world,missile);
              const nearest=options[0];
              missile.seekerReacquireUsed=true;
              if (nearest) {
                this.lock(world,missile,nearest,true);
                continue;
              }
            }
            this.loseTarget(world,missile,last,"SEEKER_TARGET_REMOVED");
          }
          continue;
        }
        if (!target) {
          missile.seekerSearching =
            missile.boosterState === BoosterState.BOOSTER_2_REMOVED;
          const last=missile.guidancePoint || missile.position;
          const options=this.candidates(world,missile);
          if (options.length) this.lock(world,missile,this.initialChoice(world,missile,options));
          else this.loseTarget(world,missile,last,"ORIGINAL_TARGET_REMOVED");
          continue;
        }
        if (targetLossOnly) continue;
        // First Lock begins when a hostile missile enters the forward seeker
        // cone, regardless of its distance to the originally assigned target.
        missile.seekerSearching =
          missile.boosterState === BoosterState.BOOSTER_2_REMOVED;
        const options=this.candidates(world,missile);
        if (options.length) this.lock(world,missile,this.initialChoice(world,missile,options));
      }
    },
  };

  const FinalChannelSystem = {
    target(world, interceptor, attackById=null) {
      if (attackById) {
        return attackById.get(interceptor.targetEntityId) || null;
      }
      return world.attackMissiles.find(
        missile =>
          missile.entityId === interceptor.targetEntityId &&
          missile.alive
      ) || null;
    },

    occupiedIds(world) {
      return new Set(
        world.interceptors
          .filter(missile => missile.alive && missile.finalChannelId)
          .map(missile => missile.finalChannelId)
      );
    },

    freeIds(world) {
      const occupied = this.occupiedIds(world);
      const ids = [];
      for (let n = 1; n <= finalChannelCountFor(world); n++) {
        const id = "FINAL-CH-" + String(n).padStart(2, "0");
        if (!occupied.has(id)) ids.push(id);
      }
      return ids;
    },

    removeFromQueue(world, entityId) {
      world.finalChannelQueue = world.finalChannelQueue.filter(
        queued => queued !== entityId
      );
    },

    activateTerminal(world, interceptor, target, finalChannelId=null) {
      if (interceptor.guidanceSupportSuspended) {
        EmergencyReassignmentSystem.remove(world, interceptor.entityId);
      }
      interceptor.finalChannelId = finalChannelId;
      interceptor.finalChannelRequested = false;
      interceptor.terminalHold = false;
      interceptor.terminalGuidanceActive = true;
      interceptor.guidanceState = GuidanceState.TERMINAL_LOCK;
      interceptor.channelId = null;
      interceptor.collisionArmed = true;
      interceptor.guidancePoint = target.position.clone();
      interceptor.guidanceDirection =
        target.position.sub(interceptor.position).normalized();
      const fixedSpeed = interceptor.weaponId === WEAPON_IDS.FOUR;
      interceptor.terminalSpeed = fixedSpeed
        ? interceptor.baseSpeed
        : (world.exMode ? interceptor.baseSpeed :
          INTERCEPTOR_WEAPON_SPEED_PROFILES.COMMON.launchSpeed) *
          INTERCEPTOR_TERMINAL_SPEED_MULTIPLIER;
      interceptor.terminalAcceleration = fixedSpeed ? 0 :
        interceptor.baseSpeed *
        INTERCEPTOR_TERMINAL_ACCELERATION_MULTIPLIER_PER_SECOND;
      interceptor.previousNosePosition =
        interceptorNosePosition(interceptor, interceptor.guidanceDirection);

      world.events.push({
        type: "FinalGuidanceLock",
        entityId: interceptor.entityId,
        finalChannelId,
      });
    },

    update(world) {
      const attackById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );
      const interceptorById = new Map(
        world.interceptors.map(
          missile => [missile.entityId, missile]
        )
      );

      // Purge invalid reservations first so channels returned by a kill are
      // available to the next FIFO reservation in the same simulation step.
      world.finalChannelQueue = world.finalChannelQueue.filter(entityId => {
        const interceptor = interceptorById.get(entityId);
        if (interceptor && !interceptor.alive) {
          return false;
        }
        if (
          !interceptor ||
          interceptor.orphanDestination ||
          !interceptor.finalChannelRequested ||
          interceptor.finalChannelId
        ) return false;
        const target = this.target(world, interceptor, attackById);
        if (!target) {
          interceptor.alive = false;
          return false;
        }
        return true;
      });

      for (const interceptor of world.interceptors) {
        if (!interceptor.alive || interceptor.orphanDestination ||
            interceptor.guidanceSupportSuspended || interceptor.autoShortRange) continue;
        const target = this.target(world, interceptor, attackById);
        if (!target) {
          if (!world.exMode && interceptor.weaponId) continue;
          this.removeFromQueue(world, interceptor.entityId);
          interceptor.alive = false;
          continue;
        }

        const targetRange = distance(target.position, world.ship.position);
        const interceptorRange =
          distance(interceptor.position, world.ship.position);
        const hasShipCoverage =
          targetRange <= trackingRadarRadiusFor(world) &&
          interceptorRange <= trackingRadarRadiusFor(world);

        if (
          interceptor.guidanceMode === GuidanceMode.SHIP_SUPPORTED &&
          (interceptor.finalChannelRequested || interceptor.finalChannelId) &&
          !hasShipCoverage
        ) {
          this.removeFromQueue(world, interceptor.entityId);
          selfDestructInterceptor(
            world,
            interceptor,
            interceptor.position,
            "FINAL_GUIDANCE_OUT_OF_RANGE"
          );
          continue;
        }

        if (interceptor.guidanceState === GuidanceState.TERMINAL_LOCK) {
          continue;
        }

        const distanceToTarget = distance(
          interceptor.position,
          target.position
        );
        if (distanceToTarget > finalGuidanceEntryRadiusFor(world)) continue;

        if (interceptor.guidanceMode === GuidanceMode.ACTIVE) {
          // Weapon 2 acquires through the forward-facing Seeker (radius 220, +/-20 degrees);
          // it does not bypass the cone or weighted initial Lock selection.
          continue;
        }

        if (
          interceptor.guidanceMode !== GuidanceMode.SHIP_SUPPORTED ||
          (!world.exMode &&
            (interceptor.weaponId === WEAPON_IDS.ONE ||
              interceptor.weaponId === WEAPON_IDS.THREE) &&
            interceptor.boosterState !== BoosterState.BOOSTER_1_REMOVED) ||
          !hasShipCoverage ||
          interceptor.finalChannelRequested ||
          interceptor.finalChannelId
        ) continue;

        interceptor.finalChannelRequested = true;
        interceptor.finalChannelRequestTime = world.time;
        interceptor.terminalHold = true;
        interceptor.collisionArmed = false;
        if (!world.finalChannelQueue.includes(interceptor.entityId)) {
          world.finalChannelQueue.push(interceptor.entityId);
        }
        world.events.push({
          type: "FinalGuidanceRequested",
          entityId: interceptor.entityId,
          channelId: interceptor.channelId,
        });
      }

      world.finalChannelQueue.sort((leftId, rightId) => {
        const left = interceptorById.get(leftId);
        const right = interceptorById.get(rightId);
        const leftTime = left?.finalChannelRequestTime ?? Infinity;
        const rightTime = right?.finalChannelRequestTime ?? Infinity;
        if (leftTime !== rightTime) return leftTime - rightTime;
        return leftId.localeCompare(rightId);
      });

      const freeIds = this.freeIds(world);
      while (freeIds.length && world.finalChannelQueue.length) {
        const entityId = world.finalChannelQueue.shift();
        const interceptor = interceptorById.get(entityId);
        if (interceptor && !interceptor.alive) {
          return false;
        }
        if (
          !interceptor ||
          interceptor.orphanDestination ||
          !interceptor.finalChannelRequested ||
          interceptor.finalChannelId
        ) continue;

        const target = this.target(world, interceptor, attackById);
        if (!target) {
          interceptor.alive = false;
          continue;
        }

        const targetRange = distance(target.position, world.ship.position);
        const interceptorRange =
          distance(interceptor.position, world.ship.position);
        if (
          targetRange > trackingRadarRadiusFor(world) ||
          interceptorRange > trackingRadarRadiusFor(world)
        ) {
          selfDestructInterceptor(
            world,
            interceptor,
            interceptor.position,
            "FINAL_GUIDANCE_OUT_OF_RANGE"
          );
          continue;
        }

        this.activateTerminal(
          world,
          interceptor,
          target,
          freeIds.shift()
        );
      }
    },
  };

  // A pending emergency item represents an already-launched Missile.
  // It uses any first-available NORMAL channel, not the channel it lost.
  const EmergencyReassignmentSystem = {
    enqueue(world, interceptor) {
      if (!interceptor.alive || !interceptor.channelId ||
          (interceptor.guidanceState === GuidanceState.TERMINAL_LOCK &&
           !interceptor.autoShortRange) ||
          world.emergencyReassignmentQueue.some(item => item.interceptorId === interceptor.entityId)) {
        return false;
      }
      const lastPoint = (interceptor.guidancePoint || interceptor.position).clone();
      interceptor.suspendedGuidancePoint = lastPoint;
      interceptor.guidancePoint = lastPoint.clone();
      const lastDirection = lastPoint.sub(interceptor.position).normalized();
      if (lastDirection.len() > 1e-9) interceptor.guidanceDirection = lastDirection;
      interceptor.guidanceSupportSuspended = true;
      interceptor.channelId = null;
      // A midcourse M1 awaiting FINAL cannot own both emergency and FINAL queues.
      if (interceptor.finalChannelRequested) {
        FinalChannelSystem.removeFromQueue(world, interceptor.entityId);
        interceptor.finalChannelRequested = false;
        interceptor.finalChannelRequestTime = null;
        interceptor.terminalHold = false;
        interceptor.collisionArmed = false;
      }
      world.emergencyReassignmentQueue.push({
        interceptorId: interceptor.entityId,
        preemptionOrder: world.nextEmergencyReassignmentOrder++,
        preemptedAt: world.time,
      });
      return true;
    },
    remove(world, interceptorId) {
      world.emergencyReassignmentQueue = world.emergencyReassignmentQueue.filter(
        item => item.interceptorId !== interceptorId
      );
      const interceptor = world.interceptors.find(i => i.entityId === interceptorId);
      if (interceptor) {
        interceptor.guidanceSupportSuspended = false;
        interceptor.suspendedGuidancePoint = null;
      }
    },
    prune(world) {
      world.emergencyReassignmentQueue = world.emergencyReassignmentQueue.filter(item => {
        const interceptor = world.interceptors.find(i => i.entityId === item.interceptorId);
        if (!interceptor || !interceptor.alive || !interceptor.guidanceSupportSuspended ||
            interceptor.channelId || interceptor.seekerInitialLock ||
            (interceptor.guidanceState === GuidanceState.TERMINAL_LOCK &&
             !interceptor.autoShortRange) ||
            interceptor.orphanDestination) {
          if (interceptor) {
            interceptor.guidanceSupportSuspended = false;
            interceptor.suspendedGuidancePoint = null;
          }
          return false;
        }
        return true;
      });
    },
    assignFreeChannels(session, occupied) {
      const world = session.world;
      this.prune(world);
      let assigned = 0;
      while (world.emergencyReassignmentQueue.length) {
        let channelId = null;
        const item = world.emergencyReassignmentQueue[0];
        const missile = world.interceptors.find(i => i.entityId === item.interceptorId);
        if (!missile || !missile.alive || !missile.guidanceSupportSuspended) {
          world.emergencyReassignmentQueue.shift();
          continue;
        }
        if (missile.autoShortRange) {
          const ramId = ShortRangeDefenseSystem.channelId(session);
          if (!ramId ||
              (world.ciwsChannelClaims.has(ramId) &&
               world.ciwsChannelClaims.get(ramId) !== SHORT_RANGE_MISSILE_OWNER)) break;
          if (!session.claimCiwsChannel(ramId,SHORT_RANGE_MISSILE_OWNER)) break;
          channelId = ramId;
          world.shortRangeMissileDefense.claimedChannelId = ramId;
        } else {
          channelId = getOperationalChannelIds(world,session.stageSpec)
            .find(candidate => !occupied.has(candidate)) || null;
          if (!channelId) break;
        }
        world.emergencyReassignmentQueue.shift();
        missile.channelId = channelId;
        missile.guidanceSupportSuspended = false;
        missile.suspendedGuidancePoint = null;
        occupied.add(channelId);
        assigned++;
        world.events.push({type:"EmergencyChannelReassigned",entityId:missile.entityId,channelId});
      }
      return assigned;
    },
  };

  // CIWS uses the last two normal CH as shared resources. D-07's combat logic
  // calls claim/release; this system only implements channel ownership.
  const CIWSChannelSystem = {
    canClaim(session, channelId) {
      return ciwsPriorityChannelIds(session.stageSpec,session.world).includes(channelId);
    },
    claim(session, channelId, ciwsOwnerId="CIWS") {
      if (!this.canClaim(session, channelId) ||
          session.world.battleState !== BattleState.RUNNING) return false;
      const world = session.world;
      if (world.ciwsChannelClaims.has(channelId)) {
        return world.ciwsChannelClaims.get(channelId) === ciwsOwnerId;
      }
      // Commit the CIWS claim before another normal CH allocation can run.
      world.ciwsChannelClaims.set(channelId, ciwsOwnerId);
      for (const missile of world.interceptors) {
        if (missile.alive && missile.channelId === channelId) {
          EmergencyReassignmentSystem.enqueue(world, missile);
        }
      }
      // Physical launch has NOT happened yet: return the approved order to
      // pendingEngagements without fabricating an emergency airborne missile.
      session.returnUnlaunchedChannelReservations(new Set([channelId]));
      world.events.push({type:"CIWSChannelClaimed",channelId,ciwsOwnerId});
      return true;
    },
    release(session, channelId, ciwsOwnerId="CIWS") {
      const world = session.world;
      if (world.ciwsChannelClaims.get(channelId) !== ciwsOwnerId) return false;
      world.ciwsChannelClaims.delete(channelId);
      world.events.push({type:"CIWSChannelReleased",channelId,ciwsOwnerId});
      return true;
    },
  };

  // D-07 close-in missile fire control. Owns one dynamic normal CH and
  // rechecks threats before returning it to emergency/normal FIFO allocation.
  // It never invokes the manual Q/A sequence or the FINAL channel.
  const ShortRangeDefenseSystem = {
    suspend(session) {
      const world = session.world;
      const state = world.shortRangeMissileDefense;
      const airborne = world.interceptors.some(i =>
        i.alive && i.entityId === state.interceptorId
      );
      // A missile already in flight keeps its legitimate CH ownership.
      if (airborne) return;
      if (state.claimedChannelId) {
        CIWSChannelSystem.release(
          session, state.claimedChannelId, SHORT_RANGE_MISSILE_OWNER
        );
      }
      state.claimedChannelId = null;
      state.interceptorId = null;
      state.targetEntityId = null;
      state.launchReadyAt = null;
    },
    channelId(session) {
      return ciwsPriorityChannelIds(session.stageSpec,session.world)[0] || null;
    },
    threats(world) {
      return world.attackMissiles.filter(missile =>
        missile.alive && distance(missile.position, world.ship.position) <=
          SHORT_RANGE_MISSILE_ENGAGEMENT_RADIUS
      ).sort((a,b) =>
        distance(a.position, world.ship.position) -
        distance(b.position, world.ship.position) ||
        a.entityId.localeCompare(b.entityId)
      );
    },
    update(session) {
      if (session.stageSpec.exAutoSimulation) return;
      const world = session.world;
      const state = world.shortRangeMissileDefense;
      if (!session.closeDefenseAutoEnabled) {
        session.clearMpShortageRetry("ram");
        this.suspend(session);
        return;
      }
      const channelId = this.channelId(session);
      if (!channelId) return;
      const airborne = world.interceptors.find(i =>
        i.alive && i.entityId === state.interceptorId
      );
      if (airborne) return;
      if (state.claimedChannelId && state.claimedChannelId !== channelId) {
        session.releaseCiwsChannel(state.claimedChannelId, SHORT_RANGE_MISSILE_OWNER);
        state.claimedChannelId = null;
        state.targetEntityId = null;
        state.launchReadyAt = null;
      }
      if (state.interceptorId) {
        state.interceptorId = null;
        state.targetEntityId = null;
        state.launchReadyAt = null;
      }
      const threats = this.threats(world);
      if (!threats.length) {
        session.clearMpShortageRetry("ram");
        state.targetEntityId = null;
        state.launchReadyAt = null;
        if (state.claimedChannelId) {
          session.releaseCiwsChannel(state.claimedChannelId, SHORT_RANGE_MISSILE_OWNER);
          state.claimedChannelId = null;
        }
        return;
      }
      // Normal RAM target acquisition, 1-s preparation and the shared M4/RAM
      // launch cooldown run every simulation tick. Only an MP-shortage failure
      // waits for the next shared 2-s retry window.
      const retryTarget = threats.find(t => t.entityId === state.targetEntityId) || threats[0];
      if (session.isMpShortageRetryDeferred("ram", retryTarget.entityId)) return;
      if (!hasSufficientCombatMp(world, AUTO_RAM_MP_LAUNCH_COST)) {
        session.deferMpShortageRetry("ram", retryTarget.entityId);
        if (state.claimedChannelId) {
          session.releaseCiwsChannel(state.claimedChannelId, SHORT_RANGE_MISSILE_OWNER);
        }
        state.claimedChannelId = null;
        // Keep the selected target and the original 1-s readiness time.
        // MP shortage alone defers the next attempt; an existing readiness
        // time is preserved instead of being restarted.
        return;
      }
      session.clearMpShortageRetry("ram");
      if (!session.claimCiwsChannel(channelId, SHORT_RANGE_MISSILE_OWNER)) return;
      state.claimedChannelId = channelId;
      const current = threats.find(t => t.entityId === state.targetEntityId);
      if (!current) {
        state.targetEntityId = threats[0].entityId;
        state.launchReadyAt = world.time + SHORT_RANGE_MISSILE_LAUNCH_DELAY;
        return;
      }
      if (state.launchReadyAt == null || world.time + 1e-9 < state.launchReadyAt) return;
      if (world.time + 1e-9 < world.nextShortRangeLaunchAllowedTime) return;
      const target = this.threats(world).find(t => t.entityId === state.targetEntityId);
      if (!target) {
        state.targetEntityId = null;
        state.launchReadyAt = null;
        return;
      }
      const launched = session.launchInterceptor(
        target.entityId, channelId, target.position.clone(),
        WEAPON_IDS.FOUR, {autoShortRange:true}
      );
      if (launched) {
        world.nextShortRangeLaunchAllowedTime = world.time + SHORT_RANGE_SHARED_LAUNCH_INTERVAL;
        state.interceptorId = launched.entityId;
        state.launchReadyAt = null;
        world.events.push({
          type: "ShortRangeMissileLaunched",
          entityId: launched.entityId,
          targetEntityId: target.entityId,
          channelId,
        });
      }
    },
  };

  // D-07 continuous-fire CIWS gun. The shared CIWS channel manager owns its CH.
  // Gun checks use 0.25 simulation seconds; hostile movement and collisions
  // retain the main 120-Hz fixed simulation loop. No individual bullet entities.
  const CIWSGunSystem = {
    channelId(session) {
      return ciwsPriorityChannelIds(session.stageSpec,session.world)[1] || null;
    },
    threats(world) {
      return world.attackMissiles.filter(m =>
        m.alive && distance(m.position, world.ship.position) <= ciwsRadiusFor(world)
      ).sort((a,b) =>
        distance(a.position, world.ship.position) -
        distance(b.position, world.ship.position) ||
        a.entityId.localeCompare(b.entityId)
      );
    },
    clear(session, channelId) {
      const state = session.world.ciwsGunDefense;
      state.phase = "IDLE";
      state.targetEntityId = null;
      state.targetChangedAt = null;
      state.phaseEndsAt = null;
      state.nextPkCheckAt = null;
      state.burstEndsAt = null;
      state.pkDrawIndex = 0;
      session.releaseCiwsChannel(channelId, CIWS_GUN_OWNER);
      state.claimedChannelId = null;
    },
    beginBurst(session, world, state) {
      // CIWS start-of-fire cost is paid once per burst, not per 0.25-s Pk draw.
      if (!spendCombatMp(world,CIWS_GUN_MP_BURST_COST)) {
        this.clear(session,state.claimedChannelId);
        return false;
      }
      state.phase = "FIRING";
      state.phaseEndsAt = null;
      state.burstEndsAt = world.time + CIWS_GUN_BURST_SECONDS;
      state.nextPkCheckAt = world.time + CIWS_GUN_PK_TICK_SECONDS;
      world.events.push({type:"CIWSGunFireStarted",targetEntityId:state.targetEntityId});
      return true;
    },
    acquireNewTarget(session, world, state, next, initial) {
      state.targetEntityId = next.entityId;
      state.pkDrawIndex = 0;
      if (initial) {
        this.beginBurst(session,world,state);
      } else {
        state.phase = "RETARGET_DELAY";
        state.targetChangedAt = world.time;
        state.phaseEndsAt = world.time + CIWS_GUN_RETARGET_SECONDS;
        state.nextPkCheckAt = null;
        state.burstEndsAt = null;
      }
    },
    update(session) {
      if (session.stageSpec.exAutoSimulation) return;
      if (!session.closeDefenseAutoEnabled) {
        session.clearMpShortageRetry("ciws");
        const state = session.world.ciwsGunDefense;
        if (state.phase !== "IDLE" || state.claimedChannelId) {
          this.clear(session, state.claimedChannelId);
        }
        return;
      }
      const world = session.world;
      if (world.battleState !== BattleState.RUNNING) return;
      const state = world.ciwsGunDefense;
      const channelId = this.channelId(session);
      if (!channelId) return;
      if (state.claimedChannelId && state.claimedChannelId !== channelId) {
        this.clear(session,state.claimedChannelId);
      }
      const threats = this.threats(world);
      if (!threats.length) {
        session.clearMpShortageRetry("ciws");
        if (state.claimedChannelId || state.phase !== "IDLE") {
          this.clear(session,state.claimedChannelId || channelId);
        }
        return;
      }
      // Pk draws of a funded burst stay on the original 0.25-s cadence.
      // A new burst starts as soon as its normal retarget/repeat delay ends.
      // Only a burst that could not start due to insufficient MP is deferred.
      const currentTarget = threats.find(t => t.entityId === state.targetEntityId);
      const retryTargetId = (currentTarget || threats[0]).entityId;
      const burstDue = state.phase !== "FIRING" && (
        (state.phase !== "RETARGET_DELAY" && state.phase !== "BURST_DELAY") ||
        world.time + 1e-9 >= state.phaseEndsAt
      );
      if (state.phase !== "FIRING" &&
          session.isMpShortageRetryDeferred("ciws", retryTargetId)) return;
      if (burstDue && !hasSufficientCombatMp(world,CIWS_GUN_MP_BURST_COST)) {
        session.deferMpShortageRetry("ciws", retryTargetId);
        // Do not preempt a normal channel when a burst lacks the necessary MP.
        if (state.claimedChannelId) {
          session.releaseCiwsChannel(state.claimedChannelId, CIWS_GUN_OWNER);
          state.claimedChannelId = null;
        }
        return;
      }
      if (burstDue) session.clearMpShortageRetry("ciws");
      if (!session.claimCiwsChannel(channelId,CIWS_GUN_OWNER)) return;
      state.claimedChannelId = channelId;
      const target = threats.find(t => t.entityId === state.targetEntityId);
      if (!target) {
        // A new first-ever target starts immediately; reassignment during an
        // active engagement (including a lost target) waits exactly 1 s.
        this.acquireNewTarget(session,world,state,threats[0],state.phase === "IDLE");
        return;      }
      if (state.phase === "RETARGET_DELAY") {
        if (world.time + 1e-9 >= state.phaseEndsAt) this.beginBurst(session,world,state);
        return;
      }
      if (state.phase === "BURST_DELAY") {
        if (world.time + 1e-9 >= state.phaseEndsAt) this.beginBurst(session,world,state);
        return;
      }
      if (state.phase !== "FIRING") {
        this.beginBurst(session,world,state);
        return;
      }
      // The first burst ends after 1.5 seconds. Its final 0.25-s shot
      // is processed before transitioning into the 0.4-s repeat pause.
      if (world.time + 1e-9 >= state.nextPkCheckAt &&
          state.nextPkCheckAt <= state.burstEndsAt + 1e-9) {
        const tickNumber = state.pkDrawIndex++;
        const p = 1 - Math.pow(
          1 - Math.min(0.9, CIWS_GUN_PK_REFERENCE_PROBABILITY * (window.__RG ? window.__RG.ciwsMul : 1)),
          CIWS_GUN_PK_TICK_SECONDS / CIWS_GUN_PK_REFERENCE_SECONDS
        );
        const roll = deterministicUnit(
          world.pkStageSeed,
          "ciws_gun_pk_" + target.entityId,
          tickNumber
        );
        state.nextPkCheckAt += CIWS_GUN_PK_TICK_SECONDS;
        if (roll < p) {
          target.alive = false;
          // Reuse standard kill signal for BattleEndSystem and audio; no
          // fake interceptor object is created.
          world.events.push({
            type:"InterceptorHit",position:target.position.clone(),
            finalChannelId:null,ciwsGun:true,weaponId:"CIWS_GUN"
          });
          world.events.push({
            type:"CIWSGunHit",targetEntityId:target.entityId
          });
          world.effects.push({
            type:"burst",position:target.position.clone(),age:0,life:.65
          });
          const next = this.threats(world)[0];
          if (next) this.acquireNewTarget(session,world,state,next,false);
          else this.clear(session,channelId);
          return;
        }
      }
      if (world.time + 1e-9 >= state.burstEndsAt) {
        state.phase = "BURST_DELAY";
        state.phaseEndsAt = state.burstEndsAt + CIWS_GUN_REPEAT_DELAY_SECONDS;
        state.nextPkCheckAt = null;
        state.burstEndsAt = null;
        world.events.push({type:"CIWSGunBurstEnded",targetEntityId:target.entityId});
      }
    },
  };

  // Process HP thresholds after impacts in the same simulation tick.
  // CH-01 and CH-02 remain operational on all normal stages.
  const ChannelDestructionSystem = {
    update(session) {
      const world = session.world;
      if (!world.defenseState) return;
      const expectedCount = calculateDestroyedNormalChannelCount(
        world.defenseState.hp, session.stageSpec.channelCount
      );
      if (expectedCount <= world.destroyedNormalChannelIds.size) return;
      const newIds = [];
      for (let n=session.stageSpec.channelCount; n>=3 &&
           world.destroyedNormalChannelIds.size<expectedCount; n--) {
        const channelId = channelIdFromIndex(n);
        if (world.destroyedNormalChannelIds.has(channelId)) continue;
        world.destroyedNormalChannelIds.add(channelId);
        newIds.push(channelId);
      }
      const lost = new Set(newIds);
      session.returnUnlaunchedChannelReservations(lost);
      for (const missile of world.interceptors) {
        if (missile.alive && missile.channelId && lost.has(missile.channelId)) {
          EmergencyReassignmentSystem.enqueue(world,missile);
        }
      }
      for (const channelId of newIds) {
        const owner = world.ciwsChannelClaims.get(channelId);
        if (owner) world.ciwsChannelClaims.delete(channelId);
        if (owner === CIWS_GUN_OWNER) {
          CIWSGunSystem.clear(session,channelId);
        }
        if (owner === SHORT_RANGE_MISSILE_OWNER) {
          world.shortRangeMissileDefense.claimedChannelId = null;
          const airborne = world.interceptors.some(i =>
            i.alive && i.entityId === world.shortRangeMissileDefense.interceptorId
          );
          if (!airborne) {
            world.shortRangeMissileDefense.targetEntityId = null;
            world.shortRangeMissileDefense.launchReadyAt = null;
          }
        }
        world.events.push({type:"NormalChannelDestroyed",channelId});
      }
    },
  };

  const MovementSystem = {
    updateAttacks(world, dt) {
      const targetShip = world.ship.position;
      const movementSegments = [];

      for (const missile of world.attackMissiles) {
        if (!missile.alive) continue;
        const dir = targetShip.sub(missile.position).normalized();
        const previousPosition = missile.position.clone();

        missile.position = missile.position.add(
          dir.mul(missile.currentSpeed * world.missileMotionMultiplier * dt)
        );

        movementSegments.push({
          missile,
          previousPosition,
          currentPosition: missile.position.clone(),
        });
      }

      return movementSegments;
    },

    holdDirection(missile) {
      const center = missile.guidancePoint;
      if (!center) return missile.guidanceDirection;

      let radial = missile.position.sub(center);
      let radius = radial.len();
      let radialUnit;
      if (radius <= 1e-6) {
        const base = missile.guidanceDirection || new Vec2(1, 0);
        radialUnit = new Vec2(-base.y, base.x).normalized();
        radius = INTERCEPTOR_HOLD_RADIUS;
      } else {
        radialUnit = radial.normalized();
      }

      const sign = missile.terminalHoldDirection >= 0 ? 1 : -1;
      const tangent = new Vec2(
        -radialUnit.y * sign,
        radialUnit.x * sign
      );
      const radialError =
        (INTERCEPTOR_HOLD_RADIUS - radius) /
        INTERCEPTOR_HOLD_RADIUS;
      const correction = radialUnit.mul(
        clamp(
          radialError * INTERCEPTOR_HOLD_CORRECTION_GAIN,
          -0.9,
          0.9
        )
      );
      return tangent.add(correction).normalized();
    },

    isActiveBeforeLock(missile) {
      return missile.weaponId === WEAPON_IDS.TWO && !missile.seekerInitialLock;
    },
    updateInterceptors(world, dt) {
      const attackById = new Map(
        world.attackMissiles
          .filter(item => item.alive)
          .map(item => [item.entityId, item])
      );

      for (const missile of world.interceptors) {
        if (!missile.alive) continue;

        const target = attackById.get(missile.targetEntityId);
        if (!target && !missile.orphanDestination &&
          !(missile.weaponId === WEAPON_IDS.TWO && !world.exMode)) {
          missile.alive = false;
          continue;
        }

        const isShipSupported =
          missile.guidanceMode === GuidanceMode.SHIP_SUPPORTED;
        const weaponSelfDestructRadius = missile.weaponId === WEAPON_IDS.THREE
          ? MID_RANGE_MISSILE_SELF_DESTRUCT_RADIUS
          : missile.weaponId === WEAPON_IDS.FOUR
            ? SHORT_RANGE_MISSILE_SELF_DESTRUCT_RADIUS
            : null;
        if (weaponSelfDestructRadius !== null &&
            distance(missile.position, world.ship.position) >=
              weaponSelfDestructRadius) {
          selfDestructInterceptor(world, missile, missile.position, "OUTER_FAILSAFE");
          continue;
        }

        let dir = missile.guidanceDirection;
        if (missile.guidanceSupportSuspended && missile.suspendedGuidancePoint) {
          const remaining = missile.suspendedGuidancePoint.sub(missile.position);
          if (remaining.len() <= MISSION_POINT_TOLERANCE) {
            selfDestructInterceptor(world, missile, missile.suspendedGuidancePoint,
              "MISSION_POINT_NO_TERMINAL");
            continue;
          }
          dir = remaining.normalized();
          missile.guidanceDirection = dir;
        } else if (missile.orphanDestination) {
          dir = missile.orphanDestination.sub(missile.position).normalized();
          missile.guidanceDirection = dir;
        } else if (missile.terminalHold) {
          dir = this.holdDirection(missile);
          if (dir) missile.guidanceDirection = dir;
        } else if (
          missile.guidanceState === GuidanceState.TERMINAL_LOCK
        ) {
          // FINAL guidance is continuous simulation guidance: it reads the
          // current target coordinate every fixed simulation update, not only
          // on radar sweep ticks or visual render frames.
          missile.guidancePoint = target.position.clone();
          dir = target.position.sub(missile.position).normalized();
          missile.guidanceDirection = dir;
        }

        if (missile.orphanDestination &&
          distance(missile.position,missile.orphanDestination) <= MISSION_POINT_TOLERANCE) {
          selfDestructInterceptor(world,missile,missile.orphanDestination,"TARGET_LOST_MISSION_POINT");
          continue;
        }
        if (!dir || dir.len() <= 1e-9) continue;

        const usesBooster = !world.exMode && missile.boosterState !== null;
        let stepDistance;
        if (missile.guidanceState === GuidanceState.TERMINAL_LOCK) {
          missile.currentSpeed = Math.min(
            missile.terminalSpeed,
            missile.currentSpeed + missile.terminalAcceleration * dt
          );
          stepDistance = missile.currentSpeed * world.missileMotionMultiplier * dt;
          if (usesBooster) missile.traveledDistance += stepDistance;
        } else if (usesBooster) {
          stepDistance = BoosterSystem.advanceDistance(
            missile, dt, world.missileMotionMultiplier
          );
        } else {
          missile.currentSpeed = missile.baseSpeed;
          stepDistance = missile.currentSpeed * world.missileMotionMultiplier * dt;
        }

        const previousNose = interceptorNosePosition(missile, dir);
        const nextPosition = missile.position.add(dir.mul(stepDistance));
        if (weaponSelfDestructRadius !== null &&
            distance(nextPosition, world.ship.position) >=
              weaponSelfDestructRadius) {
          const currentRadius = distance(missile.position, world.ship.position);
          const nextRadius = distance(nextPosition, world.ship.position);
          const fraction = clamp(
            (weaponSelfDestructRadius - currentRadius) /
              Math.max(1e-9, nextRadius - currentRadius), 0, 1
          );
          const cutoffPoint = missile.position.add(
            nextPosition.sub(missile.position).mul(fraction)
          );
          selfDestructInterceptor(world, missile, cutoffPoint, "OUTER_FAILSAFE");
          continue;
        }

        if (missile.guidanceSupportSuspended && missile.suspendedGuidancePoint &&
            segmentPointDistance(missile.position, nextPosition,
              missile.suspendedGuidancePoint) <= MISSION_POINT_TOLERANCE) {
          selfDestructInterceptor(world, missile, missile.suspendedGuidancePoint,
            "MISSION_POINT_NO_TERMINAL");
          continue;
        }
        if (missile.orphanDestination && !missile.seekerInitialLock &&
            this.isActiveBeforeLock(missile) &&
            distance(missile.position,world.ship.position) >= ACTIVE_SEEKER.preLockOuterRadius) {
          selfDestructInterceptor(world,missile,missile.position,"OUTER_FAILSAFE");
          continue;
        }
        if (missile.orphanDestination &&
            segmentPointDistance(missile.position,nextPosition,missile.orphanDestination) <= MISSION_POINT_TOLERANCE) {
          selfDestructInterceptor(world,missile,missile.orphanDestination,"TARGET_LOST_MISSION_POINT");
          continue;
        }

        if (
          (isShipSupported || this.isActiveBeforeLock(missile)) &&
          missile.guidanceState !== GuidanceState.TERMINAL_LOCK &&
          !missile.orphanDestination
        ) {
          let selfDestructT = Infinity;
          let selfDestructReason = null;
          let selfDestructPosition = null;

          if (!missile.terminalHold && missile.launchGuidancePoint &&
              !missile.guidanceSupportSuspended) {
            const toLaunch = missile.launchGuidancePoint.sub(missile.position);
            const along = dot(toLaunch, dir);
            const toLaunchLenSq = dot(toLaunch, toLaunch);
            const lateralSq = Math.max(
              0,
              toLaunchLenSq - along * along
            );

            if (
              along >= -MISSION_POINT_TOLERANCE &&
              along <= stepDistance + MISSION_POINT_TOLERANCE &&
              lateralSq <= MISSION_POINT_TOLERANCE * MISSION_POINT_TOLERANCE
            ) {
              const t = stepDistance <= 1e-9
                ? 0
                : clamp(along / stepDistance, 0, 1);
              selfDestructT = t;
              selfDestructReason = "MISSION_POINT_NO_TERMINAL";
              selfDestructPosition = missile.launchGuidancePoint.clone();
            }
          }

          const currentRange = distance(
            missile.position,
            world.ship.position
          );
          const nextRange = distance(nextPosition, world.ship.position);
          let outerT = Infinity;
          const selfDestructRadius = weaponSelfDestructRadius !== null
            ? weaponSelfDestructRadius
            : this.isActiveBeforeLock(missile)
              ? ACTIVE_SEEKER.preLockOuterRadius
              : interceptorSelfDestructRadiusFor(world);
          if (currentRange >= selfDestructRadius) {
            outerT = 0;
          } else if (
            nextRange >= selfDestructRadius &&
            nextRange > currentRange + 1e-9
          ) {
            outerT = clamp(
              (selfDestructRadius - currentRange) /
              (nextRange - currentRange),
              0,
              1
            );
          }

          if (outerT < selfDestructT) {
            selfDestructT = outerT;
            selfDestructReason = "OUTER_FAILSAFE";
            selfDestructPosition = missile.position.add(
              nextPosition.sub(missile.position).mul(outerT)
            );
          }

          if (selfDestructReason && selfDestructPosition) {
            selfDestructInterceptor(
              world,
              missile,
              selfDestructPosition,
              selfDestructReason
            );
            continue;
          }
        }

        missile.previousNosePosition = previousNose;
        missile.position = nextPosition;
        appendInterceptorTrailPoint(missile, missile.position);
      }
    },

    update(world, dt) {
      this.updateAttacks(world, dt);
      FinalChannelSystem.update(world);
      this.updateInterceptors(world, dt);
    },
  };

  function normalizeRadiansPositive(angle) {
    const tau = Math.PI * 2;
    return ((angle % tau) + tau) % tau;
  }

  function radarSweepSectorForPosition(position, shipPosition) {
    // Visual sweep starts at north (-90deg canvas angle) and rotates
    // clockwise. Quantize the target bearing to the nearest 15deg direction.
    const bearing =
      normalizeRadiansPositive(
        Math.atan2(
          position.y - shipPosition.y,
          position.x - shipPosition.x
        ) - RADAR_SWEEP_START_ANGLE
      );

    return (
      Math.round(bearing / RADAR_SWEEP_STEP_RADIANS) %
      RADAR_SWEEP_SECTOR_COUNT
    );
  }

  const SensorSystem = {
    // Compute once per simulation update. Display keeps the precise continuous
    // angle; Track publication still uses the original quantized 15° tick.
    updateSweepState(world) {
      const interval = world.sensorUpdateInterval;
      const sectorDuration = interval / RADAR_SWEEP_SECTOR_COUNT;
      const phaseTime = world.time % interval;
      const phase = phaseTime / interval;
      const sweep = world.radarSweep;

      sweep.sectorDuration = sectorDuration;
      sweep.tick = Math.floor(
        (world.time + 1e-9) / sectorDuration
      );
      sweep.headAngle = phase * Math.PI * 2 + RADAR_SWEEP_START_ANGLE;
      sweep.remaining = phaseTime <= 1e-9
        ? interval
        : interval - phaseTime;
    },

    update(world) {
      // Always advance the display state, even on ticks without publication.
      this.updateSweepState(world);
      const refreshedTrackIds = new Set();
      const sectorDuration = world.radarSweep.sectorDuration;
      const currentSweepTick = world.radarSweep.tick;

      if (currentSweepTick <= world.lastProcessedSweepTick) {
        return refreshedTrackIds;
      }

      // Avoid building a source lookup on simulation ticks that scan no sector.
      const sourceById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );
      const firstTick = world.lastProcessedSweepTick + 1;
      const radarSoundTickInterval = Math.max(
        1,
        Math.round(RADAR_SCAN_SOUND_INTERVAL / sectorDuration)
      );

      for (
        let sweepTick = firstTick;
        sweepTick <= currentSweepTick;
        sweepTick++
      ) {
        const sweepSector =
          ((sweepTick % RADAR_SWEEP_SECTOR_COUNT) +
            RADAR_SWEEP_SECTOR_COUNT) %
          RADAR_SWEEP_SECTOR_COUNT;

        // Radar Track publication still follows the 0.5-second physical sweep,
        // but its audible update cue is intentionally slower: once per 1.0
        // Simulation Time second. This keeps sensor performance unchanged while
        // matching the slower, more deliberate combat tempo.
        if (
          sweepTick > 0 &&
          sweepTick % radarSoundTickInterval === 0
        ) {
          world.events.push({
            type: "RadarScanUpdate",
            sweepTick,
          });
        }

        // Gather every source actually seen by this sweep sector first.
        // New T-xx numbers must reflect first radar publication order rather
        // than the order in which Missile/Track objects happen to be stored.
        const detectedPairs = [];

        for (const track of world.tracks) {
          const source = sourceById.get(track.sourceEntityId);
          if (!source) continue;

          const sourceSector =
            radarSweepSectorForPosition(
              source.position,
              world.ship.position
            );
          if (sourceSector !== sweepSector) continue;

          const sourceRange =
            distance(source.position, world.ship.position);
          const eligibleForPublication =
            source.sensorProfile === SensorProfile.LOW_ALTITUDE
              ? sourceRange <= lowAltitudeDetectionRadiusFor(world)
              : sourceRange <= detectionRadarRadiusFor(world);

          if (!eligibleForPublication) continue;
          detectedPairs.push({ track, source });
        }

        // Tracks first published on the same radar tick are simultaneous from
        // the player's point of view. Only in that case does actual spawn order
        // decide which one receives the lower T-xx number.
        const newlyDetected = detectedPairs
          .filter(({ track }) => !track.visible)
          .sort((a, b) =>
            (a.track.spawnSequence ?? Number.MAX_SAFE_INTEGER) -
            (b.track.spawnSequence ?? Number.MAX_SAFE_INTEGER)
          );

        // Preserve the exact sweep time even if one fixed update catches up
        // across more than one 15-degree sector.
        const scanTime = Math.min(
          world.time,
          Math.max(0, sweepTick * sectorDuration)
        );

        for (const { track } of newlyDetected) {
          track.trackId =
            "TRACK-" +
            String(world.nextDetectedTrackNumber++)
              .padStart(2, "0");
          track.firstDetectionTime = scanTime;
          track.visible = true;
        }

        for (const { track, source } of detectedPairs) {
          // Existing Tracks retain the T-xx number permanently; later sweeps
          // only refresh their public position/speed information.
          track.displayPosition = source.position.clone();
          track.displaySpeed = source.currentSpeed;
          track.lastUpdateTime = scanTime;
          refreshedTrackIds.add(track.trackId);
        }
      }

      world.lastProcessedSweepTick = currentSweepTick;
      world.lastSensorUpdate = Math.min(
        world.time,
        currentSweepTick * sectorDuration
      );

      // Kept as the next full-revolution boundary for diagnostics/UI.
      const revolutionIndex =
        Math.floor(world.time / world.sensorUpdateInterval);
      world.nextSensorUpdate =
        (revolutionIndex + 1) *
        world.sensorUpdateInterval;

      return refreshedTrackIds;
    }
  };


  // --------------------------------------------------------------------------
  // EX-only automatic launch and guidance systems.
  // This is intentionally separate from the main GameSession reservation /
  // channel-assignment path so the removed v56 behavior cannot leak back into
  // STAGE 01~05.
  // --------------------------------------------------------------------------

  const EXAutoDefenseSystem = {
    registerVisibleTracks(session) {
      const world = session.world;
      const attackById = new Map(
        world.attackMissiles
          .filter(missile => missile.alive)
          .map(missile => [missile.entityId, missile])
      );

      for (const track of world.tracks) {
        if (!track.visible || !track.trackId) continue;
        if (world.exAutoDefenseByTarget.has(track.sourceEntityId)) continue;

        const target = attackById.get(track.sourceEntityId);
        if (!target) continue;
        const targetIndex = Number(target.entityId.slice(4)) || 0;
        const profile = exAutoDefenseSpecFor(
          session.stageSpec,
          target,
          targetIndex
        );

        const entry = {
          targetEntityId: target.entityId,
          targetIndex,
          wave: Math.ceil(targetIndex / EX_THREATS_PER_WAVE),
          burst:
            Math.floor(
              ((targetIndex - 1) % EX_THREATS_PER_WAVE) / 20
            ) + 1,
          detectedAt: track.firstDetectionTime ?? world.time,
          earliestLaunchTime:
            (track.firstDetectionTime ?? world.time) +
            profile.reactionDelay,
          launchRange: profile.launchRange,
          launchRangeMin: profile.launchRangeMin,
          launchRangeMax: profile.launchRangeMax,
          aimBias: profile.aimBias,
          launched: false,
        };

        world.exAutoDefenseByTarget.set(track.sourceEntityId, entry);
        world.exAutoLaunchQueue.push(entry);
        world.exAutoLaunchTotal += 1;
      }
    },

    launchInterceptor(session, entry, track) {
      const world = session.world;
      const target = world.attackMissiles.find(
        missile =>
          missile.entityId === entry.targetEntityId &&
          missile.alive
      );
      if (!target || !track?.visible) return false;

      const launchPosition =
        world.ship.position.add(new Vec2(0, -24));
      const publishedVector =
        track.displayPosition.sub(world.ship.position);
      const publishedRange = publishedVector.len();
      const publishedDirection = publishedVector.normalized();
      const publishedTargetSpeed = Math.max(
        1,
        track.displaySpeed ?? target.currentSpeed ?? target.baseSpeed
      );
      const missileMotionMultiplier = world.missileMotionMultiplier;
      const kinematicMeetingRadius =
        publishedRange *
