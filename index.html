.game-report-modal .report-dialogue {overflow:auto;}
.game-report-modal .report-typed-body {white-space:pre-wrap;font-family:var(--kr-font-product);font-size:12px;}
.game-report-score {margin-top:24px;width:470px;max-width:100%;font-family:var(--kr-font-product);font-size:12px;}
.game-report-score[hidden] {display:none !important;}
.game-report-score-table {width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid rgba(112,222,236,.36);color:#ddf7ff;}
.game-report-score-table tr {height:32px;}
.game-report-score-table th,.game-report-score-table td {border:1px solid rgba(112,222,236,.28);padding:6px 10px;white-space:nowrap;line-height:1.35;}

:root{
  --kr-font-brand:ui-monospace,SFMono-Regular,Menlo,Consolas,"Malgun Gothic",monospace;
  --kr-font-product:var(--kr-font-brand);
  --z-modal:60;
  --report-backdrop-fade-in:400ms; --report-backdrop-fade-out:220ms; --report-slide-duration:240ms; --report-preview-reveal-duration:400ms;
  --tx-leave:200ms; --tx-leave-y:50px; --info-collapse:240ms;
}

.stage-menu{gap:18px}
.rg-score{font-family:var(--kr-caption-family);font-size:var(--kr-caption-size);font-weight:var(--kr-body-medium-weight);letter-spacing:.08em;color:#83b8c5}
.rg-score b{color:#0cfbf9;margin-left:6px;font-size:var(--kr-body-size);font-weight:var(--kr-button-weight);font-variant-numeric:tabular-nums}
#gHp{stroke:#3ddc84}#gMp{stroke:#2aa8ff}#gMp.off{stroke:#6b7f8c}
.rg-modal-open .pointer-defense-rings{display:none!important}

.report-modal.game-report-modal[hidden]{display:none!important}
.report-actions{position:absolute;left:195px;top:52px;z-index:6;display:flex;gap:12px}
.report-actions .report-close-button{position:static;flex:0 0 auto}
.report-close-button,.report-window{background-origin:border-box}
.report-thinking-label{white-space:nowrap}
.report-text{white-space:pre-wrap}
.game-report-modal .report-dialogue{scrollbar-width:thin}

.tx-box.is-transitioning{overflow:hidden}
.tx-move{display:block;transform:translateY(0);opacity:1}
.tx-move.is-leaving{transform:translateY(calc(var(--tx-leave-y) * -1));opacity:0;transition:transform var(--tx-leave) ease-in-out,opacity var(--tx-leave) ease-in-out}
.report-typed-body.tx-box .tx-move{display:block}

.rg-extra{margin-top:8px}
.rg-reveal{clip-path:inset(0 100% 0 0);transition:clip-path var(--report-preview-reveal-duration) cubic-bezier(.22,1,.36,1)}
.rg-reveal.is-revealing{clip-path:inset(-1px -1px -1px -1px)}

.game-report-score.is-dual{display:flex;gap:41px;width:100%}
.game-report-score.is-dual .game-report-score-table{flex:0 0 470px;width:470px}
.game-report-score.is-flat{margin-top:0}
.game-report-score-table th{width:62%}
.game-report-score-table td{width:38%}
.game-report-score-table th,.game-report-score-table td{overflow:hidden;text-overflow:ellipsis}

.rg-cards{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}
.rg-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:170px;margin:0;padding:10px 12px;text-align:left;cursor:pointer;color:#f4fcff;font:inherit;border:1px solid rgba(112,222,236,.28);border-left:4px solid var(--rc);border-radius:0;background:rgba(4,25,43,.16)}
.rg-card:hover{background:rgba(8,40,61,.5);border-color:var(--rc)}
.rg-card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rg-card-head{display:flex;align-items:center;gap:8px;width:100%;font-size:var(--kr-small-size);font-weight:700;color:var(--rc)}
.rg-card-head em{font-style:normal;font-weight:400;color:#83b8c5}
.rg-card-head kbd{margin-left:auto;font:inherit;padding:0 5px;border:1px solid var(--rc);color:var(--rc)}
.rg-card strong{font-family:var(--kr-button-family);font-size:var(--kr-button-size);font-weight:var(--kr-button-weight);line-height:var(--kr-button-leading);color:var(--rc)}
.rg-card p{margin:0;font-size:var(--kr-small-size);line-height:var(--kr-small-leading);color:#ddf7ff}
.rg-card small{margin-top:auto;font-size:var(--kr-small-size);color:#83b8c5}

.rg-have{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:16px}
.rg-have div{padding:6px 10px;border:1px solid rgba(112,222,236,.28);border-left:4px solid var(--rc);background:rgba(4,25,43,.16)}
.rg-have b{display:block;font-weight:700;color:var(--rc)}
.rg-have i{font-style:normal;font-weight:400;color:#83b8c5;margin:0 4px}
.rg-have small{display:block;margin-top:2px;font-size:var(--kr-small-size);color:#ddf7ff}

#rgCoach{left:328.6px;top:596px;width:532.8px;z-index:50;min-width:0}
#rgCoach .ship-info-titlebar{align-items:center}
#rgCoach .ship-info-title{flex:1 1 auto}
.ship-info-dots{font-size:var(--kr-small-size);letter-spacing:.2em;color:#83b8c5;font-weight:400}
.ui-x{display:flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:18px;padding:0;border:0;cursor:pointer;pointer-events:auto;background:var(--img-close-slot) center/100% 100% no-repeat;clip-path:polygon(2px 0,100% 0,100% calc(100% - 2px),calc(100% - 2px) 100%,0 100%,0 2px)}
.ui-x:hover{filter:brightness(1.5)}
.ui-x img{display:block;width:11px;height:11px;pointer-events:none}
.ship-info-body .ln{display:block}.ship-info-body .ln.gap{height:.6em}
.ship-info-body kbd{font:inherit;margin:0 2px;padding:0 5px;border:1px solid rgba(112,222,236,.5)}
.ship-info-body .rg-coach-hint{display:block;margin-top:8px;padding-top:6px;border-top:1px solid rgba(112,222,236,.3);color:#83b8c5}
</style>

    "offer.11905": "신규 위협 — ",
    "offer.11906": "작전 개시",
    "guide.11922": "작전 개요",
    "guide.11922.2": "적 미사일을 요격해 함선을 지키세요.\n체력(HP)이 0이 되면 실패입니다.\n커서 옆 링: <b style='color:#25c3cb'>바깥 청록 = MP</b>, <b style='color:#10e05e'>안쪽 초록 = HP</b>.",
    "guide.11923": "실전 훈련",
    "guide.11923.2": "레이더에 잡힌 위협은 Track으로 표시됩니다.\n이제 코치를 따라 직접 요격해 보세요.\n훈련 중에는 함선이 격침되지 않습니다.",
    "guide.11925": "교전 순서",
    "guide.11925.2": "<b>클릭</b> 표적 예약, <b>Q</b> 무장 등록, <b>A</b> 발사 승인.\n<b>C</b> 자동 승인, <b>Z / X</b> 예약 취소.",
    "guide.11926": "위협 종류",
    "guide.11926.2": "속도는 느림 40, 보통 55, 빠름 75.\n\n새 속성은 일정 라운드마다 하나씩 추가됩니다.\n추가 직전, 카드 선택 뒤에 안내가 나옵니다.",
    "guide.11927": "무장과 MP",
    "guide.11927.2": "<b>1~4</b> 무장 선택 (4번 = RAM).\n\n발사마다 MP 소모, 2초마다 회복,\nMP가 0이면 실드가 꺼집니다.",
    "guide.11928": "조작 키",
    "guide.11928.2": "<b>V</b> 근접 자동 방어, <b>S</b> 정지, <b>W</b> 배속,\n<b>F</b> 기본 시점, <b>TAB</b> 업그레이드 현황,\n<b>R</b> 전체 초기화, <b>H</b> 가이드.",
    "guide.11930": "카드 등급",
    "guide.11930.2": "등급은 <b style='color:#4da3ff'>노말</b> &lt; <b style='color:#b36bff'>에픽</b> &lt; <b style='color:#ffd23f'>유니크</b> &lt; <b style='color:#3ee08a'>레어</b> 순입니다.\n\n첫 카드는 랭크가 등급을 확정합니다,\n(C 노말, B 에픽, A 유니크, S 레어).",
    "guide.11931": "나머지 카드는 확률로 나옵니다.\n<b>E</b> 리롤, <b>TAB</b> 업그레이드 현황.",
    "guide.11933": "점수와 랭크",
    "guide.11933.2": "요격 = 1000점 + 속성 보너스, 가까이서 격추할수록 감점.\n\n클리어 +500, 무피해 +1000, 체력 최대 +500.\n합계로 랭크(C/B/A/S)가 정해집니다.",
    "guide.11936": "저고도 비행",
    "guide.11936.2": "<b>저고도 비행</b>: 레이더에 늦게 잡힙니다, 격추 +200.",
    "guide.11937": "특수탄",
    "guide.11937.2": "<b>특수탄(보라)</b>: 피해 1400, 격추 +350.",
    "guide.11938": "해면 밀착",
    "guide.11938.2": "<b>해면 밀착</b>: 근접 시 급가속, 격추 +250.",
    "guide.11939": "웨이포인트",
    "guide.11939.2": "<b>웨이포인트</b>: 경유점을 돌아 와 도착 예측이 어렵습니다.",
    "guide.11940": "전폭기",
    "guide.11940.2": "<b>전폭기</b>: 접근해 미사일을 발사합니다,\n발사 전에 격추하면 +500.",

  class ViewportLayoutController {
    constructor(shell, gameRoot, designSize) {
      this.shell = shell;
      this.gameRoot = gameRoot;
      this.designSize = designSize;

      this.lastViewportWidth = -1;
      this.lastViewportHeight = -1;
      this.pendingResizeFrame = null;
      this.listeners = new Set();

      this.handleResize = this.handleResize.bind(this);
    }

    static calculateScale(viewportWidth, viewportHeight, designSize) {
      return Math.min(
        1,
        viewportWidth / designSize.width,
        viewportHeight / designSize.height
      );
    }

    addLayoutListener(listener) {
      this.listeners.add(listener);
      return () => this.listeners.delete(listener);
    }

    applyReadabilityTokens(scale) {
      for (const [name, spec] of Object.entries(FONT_SCALE_SPECS)) {
        const logicalFontSize = Math.max(
          spec.base,
          spec.minPhysical / Math.max(scale, 1e-6)
        );

        this.gameRoot.style.setProperty(
          name,
          `${logicalFontSize.toFixed(3)}px`
        );
      }

      const hairlineLogical =
        Math.max(1, 1 / Math.max(scale, 1e-6));
      const strongLogical =
        Math.max(2, 2 / Math.max(scale, 1e-6));

      this.gameRoot.style.setProperty(
        "--hairline",
        `${hairlineLogical.toFixed(3)}px`
      );
      this.gameRoot.style.setProperty(
        "--strong-line",
        `${strongLogical.toFixed(3)}px`
      );
    }

    applyLayout(force=false) {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      if (
        !force &&
        viewportWidth === this.lastViewportWidth &&
        viewportHeight === this.lastViewportHeight
      ) {
        return;
      }

      const scale = ViewportLayoutController.calculateScale(
        viewportWidth,
        viewportHeight,
        this.designSize
      );

      this.lastViewportWidth = viewportWidth;
      this.lastViewportHeight = viewportHeight;

      this.gameRoot.style.setProperty(
        "--ui-scale",
        scale.toFixed(6)
      );
      this.applyReadabilityTokens(scale);

      const layout = Object.freeze({
        scale,
        viewportWidth,
        viewportHeight,
        displayWidth: this.designSize.width * scale,
        displayHeight: this.designSize.height * scale,
        devicePixelRatio:
          Math.max(1, window.devicePixelRatio || 1),
      });

      for (const listener of this.listeners) {
        listener(layout);
      }
    }

    handleResize() {
      if (this.pendingResizeFrame !== null) return;

      this.pendingResizeFrame = requestAnimationFrame(() => {
        this.pendingResizeFrame = null;
        this.applyLayout();
      });
    }

    attach() {
      window.addEventListener(
        "resize",
        this.handleResize,
        { passive: true }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          this.handleResize,
          { passive: true }
        );
      }
    }

  class HiDPICanvasSurface {
    constructor(canvasElement) {
      this.canvas = canvasElement;
      this.logicalWidth = 1;
      this.logicalHeight = 1;
      this.pixelScaleX = 1;
      this.pixelScaleY = 1;
    }

    initializeLogicalSize() {
      this.logicalWidth =
        Math.max(1, this.canvas.clientWidth);
      this.logicalHeight =
        Math.max(1, this.canvas.clientHeight);
    }

    resizeBackingStore(layout) {
      const rect = this.canvas.getBoundingClientRect();
      const dpr = layout.devicePixelRatio;

      const backingWidth = Math.max(
        1,
        Math.round(rect.width * dpr)
      );
      const backingHeight = Math.max(
        1,
        Math.round(rect.height * dpr)
      );

      if (
        this.canvas.width !== backingWidth ||
        this.canvas.height !== backingHeight
      ) {
        this.canvas.width = backingWidth;
        this.canvas.height = backingHeight;
      }

      this.pixelScaleX =
        backingWidth / this.logicalWidth;
      this.pixelScaleY =
        backingHeight / this.logicalHeight;
    }

    setScreenTransform(context) {
      context.setTransform(
        this.pixelScaleX, 0,
        0, this.pixelScaleY,
        0, 0
      );
    }

    setWorldTransform(context, zoom, offset) {
      context.setTransform(
        this.pixelScaleX * zoom, 0,
        0, this.pixelScaleY * zoom,
        this.pixelScaleX * offset.x,
        this.pixelScaleY * offset.y
      );
    }
  }

  function fittedTargetIdentifierLocalFontPx(identifier) {
    const cacheKey = String(identifier);
    const cached = targetIdentifierFontCache.get(cacheKey);
    if (cached != null) return cached;

    const zoomFactor =
      targetHudScreenScale / TARGET_HUD.baseScale;

    const desiredScreenPx = Math.min(
      TARGET_HUD.centerIdentifierMaxScreenPx,
      TARGET_HUD.centerIdentifierBaseScreenPx * zoomFactor

    let high = Math.max(
      1,
      desiredScreenPx / Math.max(targetHudScreenScale, 1e-9)

    let low = 1;

    for (let i = 0; i < 10; i++) {
      const mid = (low + high) * 0.5;
      ctx.font =
        `900 ${mid}px ` +
        `ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

      const metrics = ctx.measureText(cacheKey);
      const measuredHeight =
        (metrics.actualBoundingBoxAscent || mid * 0.75) +
        (metrics.actualBoundingBoxDescent || mid * 0.25);

      const fits =
        metrics.width <= TARGET_HUD.centerIdentifierTextMaxWidth &&
        measuredHeight <= TARGET_HUD.centerIdentifierTextMaxHeight;

      if (fits) low = mid;
      else high = mid;

    enemyBaseSpeedPkCoefficient(targetBaseSpeed, coefficients, missileMotionMultiplier=1) {

    linearDistancePkCoefficient(pkEvaluationDistance, coefficients) {

    seaSkimmingDistanceCoefficient(pkEvaluationDistance, coefficients) {
      if (pkEvaluationDistance >= 3000) return coefficients.seaSkimmingCoefficientAt3000;

  function fnv1a32(text) {
    let value = 2166136261 >>> 0;
    const bytes = new TextEncoder().encode(text);

    for (const byte of bytes) {
      value ^= byte;
      value = Math.imul(value, 16777619) >>> 0;
    }

    return value >>> 0;
  }

  function deterministicUnit(stageSeed, streamName, index) {
    let value = (
      (stageSeed >>> 0) ^
      fnv1a32(streamName) ^
      Math.imul(index >>> 0, 0x9E3779B9)
    ) >>> 0;

    value ^= value >>> 16;
    value = Math.imul(value, 0x7FEB352D) >>> 0;
    value ^= value >>> 15;
    value = Math.imul(value, 0x846CA68B) >>> 0;
    value ^= value >>> 16;

    return (value >>> 0) / 4294967296;
  }

    const count = 1 + Math.floor(deterministicUnit(stageSeed, "flyover_point_count", index) * 4);
    const possibleRadii = [4650, 3800, 3100, 2400];
    return possibleRadii.slice(4 - count).map((radius, pointIndex) => ({
      radius,
      angleOffsetDeg:
        (deterministicUnit(stageSeed, `flyover_angle_${pointIndex}`, index) * 2 - 1) * 20,
    }));
  }

  function randomBomberInitialWaypoints(world, order) {
    const seed = order.stageSeed;
    const withExtraPoint = deterministicUnit(seed, "bomber_extra_waypoint", order.index) < 0.5;
    const initial = withExtraPoint
      ? [polarWaypoint(world.ship.position, order.bearing, {
          radius:3800,
          angleOffsetDeg:(deterministicUnit(seed,"bomber_turn",order.index)*2-1)*12,
        })]
      : [];
    return initial.concat([
      polarWaypoint(world.ship.position, order.bearing, {radius:BOMBER_LAUNCH_RADIUS}),
    ]);
  }

  function buildSpawnInstruction(stage, {
    time,
    index,
    extra,
    speed=ENEMY_SPEED_NORMAL,
    sensorProfile=SensorProfile.NORMAL,
    damageProfile="NORMAL",
    flightProfileOverride=null,
    entityKind=HostileKind.MISSILE,
    navigationProfile=NavigationProfile.DIRECT,
    waypoints=null,
    bearingDegrees=null,
  }) {
    const flightProfile = flightProfileOverride ?? chooseFlightProfile(
      stage.stageSeed,
      index,
      stage.seaSkimmingChance ?? 0,
      sensorProfile
    );

    return {
      time,
      index,
      extra,
      speed,
      sensorProfile,
      damageProfile,
      entityKind,
      navigationProfile,
      waypoints: (navigationProfile === NavigationProfile.FLY_OVER &&
          entityKind !== HostileKind.BOMBER && waypoints == null
        ? randomFlyOverWaypoints(stage.stageSeed, index)
        : (waypoints ?? [])).map(point => ({ ...point })),
      bearing: Number.isFinite(bearingDegrees)
        ? bearingDegrees
        : randomSpawnBearingDegrees(stage.stageSeed, index),
      flightProfile,
      stageSeed: stage.stageSeed,
      seaSkimTriggerTti: null,
    };
  }



  function attackPlanNodeEnabled(node) {
    return node?.enabled !== false;
  }

  function validateStageAttackPlan(stage, attackPlan=stage.attackPlan) {
    if (!attackPlan || !attackPlanNodeEnabled(attackPlan)) return true;
    if (!Array.isArray(attackPlan.waves)) {
      throw new Error(`[${stage.stageId}] attackPlan.waves must be an array`);
    }

    const missileIndices = new Set();
    const validSensors = new Set(Object.values(SensorProfile));
    const validFlights = new Set(Object.values(FlightProfile));
    const validNavigation = new Set(Object.values(NavigationProfile));
    const validKinds = new Set(Object.values(HostileKind));

    for (const [waveIndex, wave] of attackPlan.waves.entries()) {
      if (!Number.isFinite(wave.startTime ?? 0)) {
        throw new Error(`[${stage.stageId}] Wave ${wave.id ?? waveIndex + 1} has invalid startTime`);
      }
      if (!Array.isArray(wave.bursts)) {
        throw new Error(`[${stage.stageId}] Wave ${wave.id ?? waveIndex + 1} bursts must be an array`);
      }

      for (const [burstIndex, burst] of wave.bursts.entries()) {
        if (!Number.isFinite(burst.offset ?? 0)) {
          throw new Error(`[${stage.stageId}] Burst ${burst.id ?? burstIndex + 1} has invalid offset`);
        }
        if (!Array.isArray(burst.missiles)) {
          throw new Error(`[${stage.stageId}] Burst ${burst.id ?? burstIndex + 1} missiles must be an array`);
        }

        for (const missile of burst.missiles) {
          if (!Number.isInteger(missile.index) || missile.index <= 0) {
            throw new Error(`[${stage.stageId}] invalid missile index`);
          }
          if (missileIndices.has(missile.index)) {
            throw new Error(`[${stage.stageId}] duplicate missile index ${missile.index}`);
          }
          missileIndices.add(missile.index);

          if (!Number.isFinite(missile.offset ?? 0)) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid offset`);
          }
          if (!Number.isFinite(missile.extra) || missile.extra < 0) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid extra distance`);
          }
          if (missile.speed != null && !Number.isFinite(missile.speed)) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid speed`);
          }
          if (
            missile.sensorProfile != null &&
            !validSensors.has(missile.sensorProfile)
          ) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid sensorProfile`);
          }
          if (
            missile.flightProfileOverride != null &&
            !validFlights.has(missile.flightProfileOverride)
          ) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid flightProfileOverride`);
          }
          if (
            missile.damageProfile != null &&
            !Object.prototype.hasOwnProperty.call(ENEMY_DAMAGE_PROFILES, missile.damageProfile)
          ) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has invalid damageProfile`);
          }
          if (!validKinds.has(missile.entityKind ?? HostileKind.MISSILE)) {
            throw new Error(`[${stage.stageId}] invalid hostile kind ${missile.index}`);
          }
          if (!validNavigation.has(missile.navigationProfile ?? NavigationProfile.DIRECT)) {
            throw new Error(`[${stage.stageId}] invalid navigation profile ${missile.index}`);
          }
          if (missile.bearingDegrees != null && !Number.isFinite(missile.bearingDegrees)) {
            throw new Error(`[${stage.stageId}] invalid bearing ${missile.index}`);
          }
          if (missile.waypoints != null && !Array.isArray(missile.waypoints)) {
            throw new Error(`[${stage.stageId}] invalid waypoint list ${missile.index}`);
          }
          if ((missile.waypoints?.length ?? 0) > 4) {
            throw new Error(`[${stage.stageId}] Fly-over must have at most four waypoints: ${missile.index}`);
          }
          if ((missile.navigationProfile ?? NavigationProfile.DIRECT) === NavigationProfile.DIRECT &&
              (missile.waypoints?.length ?? 0) !== 0) {
            throw new Error(`[${stage.stageId}] direct hostile has waypoints ${missile.index}`);
          }
          for (const waypoint of missile.waypoints ?? []) {
            if (!Number.isFinite(waypoint.radius) || waypoint.radius <= 0 ||
                !Number.isFinite(waypoint.angleOffsetDeg ?? 0)) {
              throw new Error(`[${stage.stageId}] invalid waypoint coordinates ${missile.index}`);
            }
            if (waypoint.radius >= FLYOVER_NO_WAYPOINT_INNER &&
                waypoint.radius <= FLYOVER_NO_WAYPOINT_OUTER) {
              throw new Error(`[${stage.stageId}] waypoint inside SEA_SKIMMING acceleration band: ${missile.index}`);
            }
          }
          if (missile.entityKind === HostileKind.BOMBER &&
              ((missile.navigationProfile ?? NavigationProfile.DIRECT) !== NavigationProfile.FLY_OVER ||
               (missile.sensorProfile ?? SensorProfile.NORMAL) !== SensorProfile.NORMAL ||
               (missile.flightProfileOverride ?? FlightProfile.DIRECT) !== FlightProfile.DIRECT)) {
            throw new Error(`[${stage.stageId}] bomber must use normal detection and fly-over navigation`);
          }
        }
      }
    }

    return true;
  }

  function compileStageAttackPlan(
    stage,
    attackPlan=stage.attackPlan,
    { sortByTime=false }={}
  ) {
    if (!attackPlan || !attackPlanNodeEnabled(attackPlan)) return [];
    validateStageAttackPlan(stage, attackPlan);

    const compiled = [];
    let naturalOrder = 0;
    for (const wave of attackPlan.waves) {
      if (!attackPlanNodeEnabled(wave)) continue;
      const waveStart = wave.startTime ?? 0;

      for (const burst of wave.bursts) {
        if (!attackPlanNodeEnabled(burst)) continue;
        const burstOffset = burst.offset ?? 0;

        for (const missile of burst.missiles) {
          naturalOrder += 1;
          if (!attackPlanNodeEnabled(missile)) continue;

          const time =
            waveStart +
            burstOffset +
            (missile.offset ?? 0);

          if (time < -1e-9) {
            throw new Error(`[${stage.stageId}] missile ${missile.index} has negative spawn time`);
          }

          const order = buildSpawnInstruction(stage, {
            time: Math.max(0, time),
            index: missile.index,
            extra: missile.extra,
            speed: missile.speed ?? ENEMY_SPEED_NORMAL,
            sensorProfile:
              missile.sensorProfile ?? SensorProfile.NORMAL,
            damageProfile: missile.damageProfile ?? "NORMAL",
            flightProfileOverride:
              missile.flightProfileOverride ?? null,
            entityKind: missile.entityKind ?? HostileKind.MISSILE,
            navigationProfile: missile.navigationProfile ?? NavigationProfile.DIRECT,
            waypoints: missile.waypoints ?? null,
            bearingDegrees: missile.bearingDegrees ?? null,
          });

          compiled.push({
            order,
            compileOrder: missile.compileOrder ?? naturalOrder,
          });
        }
      }
    }

    compiled.sort((left, right) => {
      if (sortByTime) {
        const timeDelta = left.order.time - right.order.time;
        if (Math.abs(timeDelta) > 1e-12) return timeDelta;
      }
      return left.compileOrder - right.compileOrder;
    });

    return compiled.map(item => item.order);
  }

  const PLAYER_FEATURES = Object.freeze({
    showTTI: true,
    useAssistSelection: true,
    usePendingEngagements: true,
    useReservationQueue: true,
  });

  function registerStages(...stages) {
    return Object.freeze(Object.fromEntries(
      stages.map(stage => [
        stage.stageId,
        Object.freeze({ ...stage, ...PLAYER_FEATURES })
      ])
    ));
  }


  function polarWaypoint(shipPosition, bearingDegrees, waypoint) {
    const radians = (bearingDegrees + (waypoint.angleOffsetDeg ?? 0)) * Math.PI / 180;
    return shipPosition.add(new Vec2(
      Math.cos(radians) * waypoint.radius,
      Math.sin(radians) * waypoint.radius
    ));
  }

  function setFlyOverRoute(hostile, positions) {
    hostile.routeWaypoints = positions.map(point => point.clone());
    hostile.routeIndex = 0;
    hostile.navigationProfile = NavigationProfile.FLY_OVER;
  }

  function remainingFlyOverDistance(hostile, origin, shipPosition) {
    if (hostile.entityKind === HostileKind.BOMBER) return null;
    if (hostile.navigationProfile !== NavigationProfile.FLY_OVER) {
      return distance(origin, shipPosition);
    }
    let previous = origin;
    let length = 0;
    for (let i = hostile.routeIndex; i < hostile.routeWaypoints.length; i++) {
      const target = hostile.routeWaypoints[i];
      length += distance(previous, target);
      previous = target;
    }
    return length + distance(previous, shipPosition);
  }

  function spawnAttackOrder(world, order) {
    const position = enemySpawnPosition(
      world.ship.position,
      order.bearing,
      MIN_ENEMY_SPAWN_DISTANCE + order.extra
    );
    const kind = order.entityKind ?? HostileKind.MISSILE;
    const waypoints = kind === HostileKind.BOMBER
      ? randomBomberInitialWaypoints(world, order)
      : (order.waypoints ?? []).map(point =>
          polarWaypoint(world.ship.position, order.bearing, point)
        );
    addAttack(
      world,
      order.index,
      position,
      order.speed ?? ENEMY_SPEED_NORMAL,
      order.sensorProfile ?? SensorProfile.NORMAL,
      order.flightProfile ?? FlightProfile.DIRECT,
      order.seaSkimTriggerTti ?? null,
      order.bearing,
      order.damageProfile ?? "NORMAL",
      {
        entityKind: kind,
        navigationProfile: order.navigationProfile ?? NavigationProfile.DIRECT,
        routeWaypoints: waypoints,
      }
    );
    world.spawnedScheduledAttackCount += 1;
  }

  function spawnDueAttacks(world) {
    if (!world.spawnQueue.length) return;
    const remaining = [];
    for (const order of world.spawnQueue) {
      if (order.time <= world.time + 1e-9) {
        spawnAttackOrder(world, order);
      } else {
        remaining.push(order);
      }
    }
    world.spawnQueue = remaining;
  }

  function attackMissileDisplayRadiusForBaseSpeed(baseSpeed) {
    if (baseSpeed >= ENEMY_SPEED_FAST - 0.5) return 15.0;
    if (baseSpeed >= ENEMY_SPEED_NORMAL - 0.5) return 10.0;
    return 5.0;
  }

  function addAttack(
    world,
    index,
    position,
    speed=ENEMY_SPEED_NORMAL,
    sensorProfile=SensorProfile.NORMAL,
    flightProfile=FlightProfile.DIRECT,
    seaSkimTriggerTti=null,
    spawnBearingDegrees=null,
    damageProfile="NORMAL",
    options={}
  ) {
    const entityKind = options.entityKind ?? HostileKind.MISSILE;
    const entityId = options.entityId ??
      (entityKind === HostileKind.BOMBER ? "BMR-" : "ASM-") +
        String(index).padStart(3, "0");
    const spawnSequence = world.spawnedAttackCount + 1;

    const attack = new Missile({
      entityId,
      role: MissileRole.ATTACK,
      position,
      speed,
      baseSpeed: speed,
      currentSpeed: speed,
      terminalSpeed:
        speed * SEA_SKIM_TERMINAL_SPEED_MULTIPLIER,
      terminalAcceleration: null,
      hitRadius: 8,
      displayRadius: entityKind === HostileKind.BOMBER
        ? 15 : attackMissileDisplayRadiusForBaseSpeed(speed),
      targetEntityId: world.ship.entityId,
      sensorProfile,
      damageProfile,
      entityKind,
      launchPlatformEntityId: options.launchPlatformEntityId ?? null,
      navigationProfile: options.navigationProfile ?? NavigationProfile.DIRECT,
      routeWaypoints: options.routeWaypoints ?? [],
      bomberState: entityKind === HostileKind.BOMBER ? {
        phase: "APPROACH_FIRST",
        firstLaunchTime: null,
        launchedCount: 0,
        bearingDegrees: spawnBearingDegrees,
      } : null,
      flightProfile,
      flightPhase:
        flightProfile === FlightProfile.SEA_SKIMMING
          ? FlightPhase.CRUISE_HIGH
          : FlightPhase.DIRECT,
      seaSkimTriggerTti,
      spawnBearingDegrees,
    });

    world.attackMissiles.push(attack);
    world.tracks.push(new Track({
      trackId: null,
      sourceEntityId: entityId,
      displayPosition: position.clone(),
      displaySpeed: speed,
      spawnSequence,
      visible: false,
    }));
    world.spawnedAttackCount += 1;
    return attack;
  }

  function appendInterceptorTrailPoint(
    missile,
    position,
    force=false
  ) {
    if (!missile.trailPoints) {
      missile.trailPoints = [];
    }

    const points = missile.trailPoints;
    const lastPoint = points.length
      ? points[points.length - 1]
      : null;

    if (
      !force &&
      lastPoint &&
      distance(lastPoint, position) <
        INTERCEPTOR_TRAIL_SAMPLE_DISTANCE
    ) {
      return;
    }

    if (
      lastPoint &&
      distance(lastPoint, position) <= 1e-6
    ) {
      return;
    }

    points.push(position.clone());

    if (points.length > INTERCEPTOR_TRAIL_MAX_POINTS) {
      const compacted = [points[0]];
      for (let i = 2; i < points.length - 1; i += 2) {
        compacted.push(points[i]);
      }
      compacted.push(points[points.length - 1]);
      missile.trailPoints = compacted;
    }
  }

    const lengthSq = dot(segment, segment);
    if (lengthSq <= 1e-12) return distance(a, point);
    const t = clamp(dot(point.sub(a), segment) / lengthSq, 0, 1);
    const closest = a.add(segment.mul(t));
    return distance(closest, point);

        if (currentRange <= seaSkimFullRadiusFor(world)) {

          missile.flightPhase = FlightPhase.TERMINAL_LOW;
          continue;

        const accelBand =
          seaSkimTriggerRadiusFor(world) - seaSkimFullRadiusFor(world);
        const progress = clamp(
          (seaSkimTriggerRadiusFor(world) - currentRange) / accelBand,
          0,
          1
        );

        missile.currentSpeed =
          missile.baseSpeed +
          (missile.terminalSpeed - missile.baseSpeed) * progress;
      }

      return {

      const acceleratedSpeed = launchSpeed + (missile.baseSpeed - launchSpeed) * progress;
      const boosterLoss = INTERCEPTOR_WEAPON_SPEED_PROFILES[missile.weaponId]

      return acceleratedSpeed - this.removedCount(missile.boosterState) * boosterLoss;

      let remainingTime = dt;
      const launchSpeed = INTERCEPTOR_WEAPON_SPEED_PROFILES.COMMON.launchSpeed;
      const slope = (missile.baseSpeed - launchSpeed) / BOOSTER_ACCELERATION_DISTANCE;
      for (let segments = 0; segments < 5 && remainingTime > 1e-12; segments++) {
        this.updateState(missile);
        const traveled = missile.traveledDistance;
        const nextBoundary = Math.min(
          traveled < BOOSTER_ACCELERATION_DISTANCE - 1e-9
            ? BOOSTER_ACCELERATION_DISTANCE : Infinity,
          missile.boosterState === BoosterState.LAUNCHED
            ? missile.booster1RemovalDistance : Infinity,
          missile.weaponId === WEAPON_IDS.TWO &&
            missile.boosterState === BoosterState.BOOSTER_1_REMOVED

        const speed = this.speedAt(missile);

          accelerating && slope > 0
